name: "publish"

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles dmg app"
          - platform: "macos-15-intel"
            args: "--target x86_64-apple-darwin --bundles dmg app"
          - platform: "ubuntu-24.04"
            args: "--target x86_64-unknown-linux-gnu --bundles deb appimage"
          - platform: "ubuntu-24.04-arm"
            args: "--target aarch64-unknown-linux-gnu --bundles deb appimage"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-desktop-release

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev lld librsvg2-dev patchelf xdg-utils flatpak flatpak-builder

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-latest' || matrix.platform == 'macos-15-intel'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing / notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Updater
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: __VERSION__
          releaseName: "ROK Battles v__VERSION__"
          releaseBody: See the assets to download this version and install.
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          projectPath: crates/apps/rokbattles-desktop
          tauriScript: ../../../packages/desktop-client/node_modules/.bin/tauri
          args: ${{ matrix.args }}

      - name: Build Flatpak
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        id: flatpak
        run: bash .github/flatpak/build.sh

      - name: Upload Flatpak release asset
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tauri.outputs.appVersion }}
          FLATPAK_BUNDLE: ${{ steps.flatpak.outputs.bundle }}
        run: gh release upload "$RELEASE_TAG" "$FLATPAK_BUNDLE" --clobber

  publish-windows:
    permissions:
      contents: write
    concurrency:
      group: certum-windows-signing
      queue: max
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-desktop-release

      - name: Install Certum signing client
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'ssign-cli'
          # ssign v0.1.11, built from pinned source for each runner architecture.
          cargo install --locked --git https://github.com/Le-Syl21/ssign --rev 367bf7d3da14d5041d5e47f855ae2397b8028e33 --root $installDir ssign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $installDir 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build, sign and upload Windows release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
          CERTUM_CERT_THUMBPRINT: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: __VERSION__
          releaseName: "ROK Battles v__VERSION__"
          releaseBody: See the assets to download this version and install.
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          projectPath: crates/apps/rokbattles-desktop
          tauriScript: ../../../packages/desktop-client/node_modules/.bin/tauri
          args: >-
            --target ${{ matrix.target }} --bundles nsis
            --config '{"bundle":{"windows":{"signCommand":{"cmd":"pwsh","args":[
            "-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass",
            "-File","windows/sign-certum.ps1","%1"]}}}}'

      - name: Remove cached SimplySign session
        if: always()
        shell: pwsh
        run: |
          $session = Join-Path $env:RUNNER_TEMP 'ssign/session.json'
          if (Test-Path -LiteralPath $session) {
            Remove-Item -LiteralPath $session -Force
          }
