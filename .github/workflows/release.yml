name: "publish"

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles dmg app"
          - platform: "macos-15-intel"
            args: "--target x86_64-apple-darwin --bundles dmg app"
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu --bundles deb appimage"
          - platform: "ubuntu-22.04-arm"
            args: "--target aarch64-unknown-linux-gnu --bundles deb appimage"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: __VERSION__
          releaseName: "ROK Battles v__VERSION__"
          releaseBody: |
            See the assets to download this version and install.
      
            ---
      
            ### Which file should I download?
            Windows
            `ROK.Battles___VERSION___x64-setup.exe`
      
            macOS (Apple Silicon)
            `ROK.Battles___VERSION___aarch64.dmg`
      
            macOS (Intel)
            `ROK.Battles___VERSION___x64.dmg`
      
            Linux (Debian-based distributions)
            `ROK.Battles___VERSION___amd64.deb`
      
            Linux (portable version for most distributions)
            `ROK.Battles___VERSION___amd64.AppImage`
      
            ---
      
            ### ARM Builds (Advanced)
            Most computers use x64 (amd64) processors. If you're unsure which architecture your system uses, download the x64/amd64 version.
      
            Only download the ARM64 version if you know your device uses an ARM processor (such as Windows on ARM devices or certain ARM-based Linux systems).
      
            ---
      
            Signature files (`.sig`) are used by the updater to verify downloads. You do not need to download them manually.
          releaseDraft: true
          prerelease: false
          projectPath: crates/rokbattles-tauri
          args: ${{ matrix.args }}
