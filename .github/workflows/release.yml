name: "publish"

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles dmg app"
          - platform: "macos-15-intel"
            args: "--target x86_64-apple-darwin --bundles dmg app"
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu --bundles deb appimage"
          - platform: "ubuntu-22.04-arm"
            args: "--target aarch64-unknown-linux-gnu --bundles deb appimage"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-latest' || matrix.platform == 'macos-15-intel'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing / notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Updater
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: __VERSION__
          releaseName: "ROK Battles v__VERSION__"
          releaseBody: |
            See the assets to download this version and install.
      
            ---
      
            ### Which file should I download?
            Windows
            `ROK.Battles___VERSION___x64-setup.exe`
      
            macOS (Apple Silicon)
            `ROK.Battles___VERSION___aarch64.dmg`
      
            macOS (Intel)
            `ROK.Battles___VERSION___x64.dmg`
      
            Linux (Debian-based distributions)
            `ROK.Battles___VERSION___amd64.deb`
      
            Linux (portable version for most distributions)
            `ROK.Battles___VERSION___amd64.AppImage`
      
            ---
      
            ### ARM Builds (Advanced)
            Most computers use x64 (amd64) processors. If you're unsure which architecture your system uses, download the x64/amd64 version.
      
            Only download the ARM64 version if you know your device uses an ARM processor (such as Windows on ARM devices or certain ARM-based Linux systems).
      
            ---
      
            Signature files (`.sig`) are used by the updater to verify downloads. You do not need to download them manually.
          releaseDraft: true
          prerelease: false
          projectPath: apps/rokbattles-tauri
          args: ${{ matrix.args }}
