name: "publish"

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin --bundles dmg app"
          - platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin --bundles dmg app"
          - platform: "ubuntu-24.04"
            target: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu --bundles deb appimage"
          - platform: "ubuntu-24.04-arm"
            target: "aarch64-unknown-linux-gnu"
            args: "--target aarch64-unknown-linux-gnu --bundles deb appimage"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles nsis --config tauri.windows-x64.conf.json --config tauri.capture-x86_64-pc-windows-msvc.conf.json"
          - platform: "windows-11-arm"
            target: "aarch64-pc-windows-msvc"
            args: "--target aarch64-pc-windows-msvc --bundles nsis --config tauri.capture-aarch64-pc-windows-msvc.conf.json"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows capture maintenance without activating it
        if: runner.os == 'Windows'
        run: python crates/apps/rokbattles-desktop/scripts/stage_maintenance.py --target ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev lld librsvg2-dev patchelf xdg-utils flatpak flatpak-builder

      - name: Build and stage background agent
        run: python crates/apps/rokbattles-desktop/scripts/stage_agent.py --target ${{ matrix.target }}

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-latest' || matrix.platform == 'macos-15-intel'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build Unix capture helper and protected agent without running them
        if: runner.os != 'Windows'
        run: cargo build --locked --release -p rokbattles-capture-helper -p rokbattles-desktop-agent --target ${{ matrix.target }}

      - name: Prepare signed macOS capture release assets
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: >-
          python3 crates/apps/rokbattles-capture-helper/packaging/unix/stage_release.py
          --target ${{ matrix.target }}
          --helper target/${{ matrix.target }}/release/rokbattles-capture-helper
          --agent target/${{ matrix.target }}/release/rokbattles-desktop-agent
          --installer crates/apps/rokbattles-capture-helper/packaging/unix/maintain.py
          --output target/capture-release/${{ matrix.target }}
        # Existing Apple signing configuration only. macOS requires Accepted
        # notarization for both exact hardened identifiers before making payloads.
        # No user UID, elevation, service registration, native open or capture.

      - name: Prepare Linux capture release assets
        if: runner.os == 'Linux'
        run: >-
          python3 crates/apps/rokbattles-capture-helper/packaging/unix/stage_release.py
          --target ${{ matrix.target }}
          --helper target/${{ matrix.target }}/release/rokbattles-capture-helper
          --agent target/${{ matrix.target }}/release/rokbattles-desktop-agent
          --installer crates/apps/rokbattles-capture-helper/packaging/unix/maintain.py
          --output target/capture-release/${{ matrix.target }}

      # This overlay is deliberately absent from the native Windows ARM64 job.
      # Staging/signature verification never installs, loads or opens the driver.
      - name: Stage official pinned WinDivert (Windows x64 only)
        if: matrix.platform == 'windows-latest'
        run: python crates/apps/rokbattles-desktop/scripts/windivert_vendor.py stage --target x86_64-pc-windows-msvc

      - name: Verify WinDivert kernel signature before bundling
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./crates/apps/rokbattles-desktop/scripts/verify_windivert.ps1

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing / notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Updater
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: __VERSION__
          releaseName: "ROK Battles v__VERSION__"
          releaseBody: See the assets to download this version and install.
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          projectPath: crates/apps/rokbattles-desktop
          tauriScript: node ../../../packages/desktop-client/node_modules/@tauri-apps/cli/tauri.js
          args: ${{ matrix.args }} --config tauri.agent.conf.json

      - name: Attach Unix capture setup assets to the draft release
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tauri.outputs.appVersion }}
          CAPTURE_TARGET: ${{ matrix.target }}
        run: gh release upload "$RELEASE_TAG" target/capture-release/"$CAPTURE_TARGET"/assets/* --clobber

      - name: Build Flatpak
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        id: flatpak
        run: bash .github/flatpak/build.sh

      - name: Upload Flatpak release asset
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tauri.outputs.appVersion }}
          FLATPAK_BUNDLE: ${{ steps.flatpak.outputs.bundle }}
        run: gh release upload "$RELEASE_TAG" "$FLATPAK_BUNDLE" --clobber
