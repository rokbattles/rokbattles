name: Desktop Native Dependencies

on:
  pull_request:
    branches: [ main, "feat/capture-*" ]
    paths:
      - "crates/apps/rokbattles-desktop/**"
      - "crates/apps/rokbattles-desktop-agent/**"
      - "crates/apps/rokbattles-capture-helper/**"
      - "crates/apps/rokbattles-capture-maintenance/**"
      - "crates/apps/rokbattles-nat-gateway/**"
      - "crates/apps/rokbattles-ingress/**"
      - "crates/common/rokbattles-capture-*/**"
      - "crates/common/rokbattles-desktop-*/**"
      - "crates/common/rokbattles-mail-*/**"
      - "crates/common/rokbattles-gateway-protocol/**"
      - "packages/desktop-client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".cargo/**"
      - ".github/native-capture/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/desktop-native-dependencies.yml"
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-dependencies-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  native-desktop:
    name: Desktop build and load-only (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            pcap: /usr/lib/x86_64-linux-gnu/libpcap.so.0.8
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pcap: /usr/lib/aarch64-linux-gnu/libpcap.so.0.8
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            configs: --config tauri.windows-x64.conf.json --config tauri.capture-x86_64-pc-windows-msvc.conf.json
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            configs: --config tauri.capture-aarch64-pc-windows-msvc.conf.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable-${{ matrix.target }}
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-native-${{ matrix.target }}
          cache-on-failure: false
      - name: Install signed Ubuntu native runtime and desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          # Use the hosted Ubuntu 24.04 image's signed distribution repositories.
          # Do not add third-party apt sources or disable package authentication.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap0.8t64 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld
          dpkg-query -W libpcap0.8t64
          dpkg-query -S '${{ matrix.pcap }}'
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the build executes on its native architecture
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          actual=$(rustc -vV | sed -n 's/^host: //p')
          test "$actual" = "$EXPECTED_TARGET"
      - name: Build and stage agent without running it
        run: python crates/apps/rokbattles-desktop/scripts/stage_agent.py --debug --target ${{ matrix.target }}
      - name: Build helper without running it
        run: cargo build --locked -p rokbattles-capture-helper --target ${{ matrix.target }}
      - name: Format desktop and capture pipeline
        run: cargo fmt -p rokbattles-desktop -p rokbattles-desktop-agent -p rokbattles-mail-codec -p rokbattles-desktop-paths -p rokbattles-desktop-store -p rokbattles-capture-adapters -p rokbattles-capture-runtime -p rokbattles-capture-ipc -p rokbattles-capture-helper -p rokbattles-capture-maintenance -p rokbattles-gateway-protocol -p rokbattles-nat-gateway -p rokbattles-mail-reconstructor -p rokbattles-ingress -- --check
      - name: Validate vendor extraction and maintenance packaging fixtures
        run: python -m unittest discover -s crates/apps/rokbattles-desktop/scripts -p 'test_*.py' -v
      - name: Parse and test fixed Windows bootstrap without executing installer actions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = Join-Path $PWD 'crates/apps/rokbattles-desktop/windows/bootstrap.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | Out-String | Write-Error; exit 1 }
          & ./crates/apps/rokbattles-desktop/windows/test-bootstrap.ps1
      - name: Validate inert Unix service package fixtures
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s crates/apps/rokbattles-capture-helper/packaging/unix -p 'test_*.py' -v
      - name: Build and stage Windows helper and maintenance without running them
        if: runner.os == 'Windows'
        run: python crates/apps/rokbattles-desktop/scripts/stage_maintenance.py --debug --target ${{ matrix.target }}
      - name: Compile NSIS hooks without executing the fixture installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./crates/apps/rokbattles-desktop/windows/compile-hooks.ps1 -Target ${{ matrix.target }}
      - name: Stage official pinned WinDivert without installing it
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu'
        run: python crates/apps/rokbattles-desktop/scripts/windivert_vendor.py stage --target x86_64-pc-windows-msvc
      - name: Verify exact WinDivert resource manifest
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu'
        run: python crates/apps/rokbattles-desktop/scripts/windivert_vendor.py verify --target x86_64-pc-windows-msvc
      - name: Verify WinDivert hashes and Windows driver signature policy
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: ./crates/apps/rokbattles-desktop/scripts/verify_windivert.ps1
      - name: Native driver-policy positive and negative signature checks
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          WINDIVERT_NATIVE_TRUST_TESTS: "1"
        run: python -m unittest discover -s crates/apps/rokbattles-desktop/scripts -p 'test_windivert_signature.py' -v
      - name: Build complete desktop frontend and native application
        run: pnpm -F @rokbattles/desktop-client tauri build --debug --no-bundle --target ${{ matrix.target }} ${{ matrix.configs }} --config tauri.agent.conf.json
        # No signing credentials, installers, application launch or live capture.
      - name: Lint desktop and capture pipeline
        run: cargo clippy --locked -p rokbattles-desktop -p rokbattles-desktop-agent -p rokbattles-mail-codec -p rokbattles-desktop-paths -p rokbattles-desktop-store -p rokbattles-capture-adapters -p rokbattles-capture-runtime -p rokbattles-capture-ipc -p rokbattles-capture-helper -p rokbattles-capture-maintenance -p rokbattles-gateway-protocol --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Run desktop and capture pipeline synthetic tests
        run: cargo test --locked -p rokbattles-desktop -p rokbattles-desktop-agent -p rokbattles-mail-codec -p rokbattles-desktop-paths -p rokbattles-desktop-store -p rokbattles-capture-adapters -p rokbattles-capture-runtime -p rokbattles-capture-ipc -p rokbattles-capture-helper -p rokbattles-capture-maintenance -p rokbattles-gateway-protocol --target ${{ matrix.target }}
      - name: Stage immutable signature-only fixtures
        if: runner.os == 'Windows'
        env:
          ROKBATTLES_NATIVE_TRUST_FIXTURES: ${{ runner.temp }}/rokbattles-signature-fixtures
        shell: pwsh
        run: python crates/apps/rokbattles-capture-helper/tests/stage_trust_fixtures.py "$env:ROKBATTLES_NATIVE_TRUST_FIXTURES"
      - name: Native offline driver-policy positive and negative checks
        if: runner.os == 'Windows'
        env:
          ROKBATTLES_NATIVE_TRUST_FIXTURES: ${{ runner.temp }}/rokbattles-signature-fixtures
        run: cargo test --locked -p rokbattles-capture-helper --target ${{ matrix.target }} windows::native_trust::tests::native_offline_driver_policy_accepts_only_exact_valid_signature -- --ignored --exact
        # WinVerifyTrust reads signed files only. No DLL load, SCM, driver or capture.
      - name: Shared NAT reassembly regression checks
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked -p rokbattles-nat-gateway --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --locked -p rokbattles-nat-gateway --target ${{ matrix.target }}
      - name: Incremental ingress and reconstruction checks
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked -p rokbattles-ingress -p rokbattles-mail-reconstructor --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --locked -p rokbattles-ingress -p rokbattles-mail-reconstructor --target ${{ matrix.target }}
      - name: Load real system libpcap and resolve adapter symbols only
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD DYLD_LIBRARY_PATH DYLD_INSERT_LIBRARIES DYLD_FALLBACK_LIBRARY_PATH
          cargo test --locked -p rokbattles-capture-adapters --target ${{ matrix.target }} --test native_dependencies pcap_system_library_loads_without_capture -- --ignored --exact
      - name: Load verified WinDivert and resolve adapter symbols only
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked -p rokbattles-capture-adapters --target ${{ matrix.target }} --test native_dependencies windivert_verified_library_loads_without_capture -- --ignored --exact
      - name: Report Npcap runtime coverage blocked by external installation
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output '::notice title=Npcap runtime NOT RUN::Npcap is not installed or bundled. Free Npcap has no silent installer; an administrator must separately accept its license and install it. SDK or compile checks are not runtime coverage.'
          @'
          Npcap runtime loading: **NOT RUN / BLOCKED** on this hosted runner.
          The free installer is interactive; silent installation requires Npcap OEM.
          No Npcap installer, SDK, DLL or driver is downloaded, cached or bundled.
          See .github/native-capture/README.md in this checkout for the explicit manual load-only acceptance command.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Report load-only boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'These checks build the desktop, agent and helper and test library loading/symbol resolution. They never open capture handles, activate drivers, run installers, or perform live capture. See the individual steps for pass/fail; no live-capture acceptance is claimed.' >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ matrix.target }}' = 'aarch64-pc-windows-msvc' ]; then
            printf '%s\n' 'WinDivert runtime: unsupported on Windows ARM64 by the pinned upstream release; build and synthetic tests only.' >> "$GITHUB_STEP_SUMMARY"
          fi
