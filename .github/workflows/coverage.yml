name: Rust Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  coverage:
    name: Rust Workspace Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Generate workspace coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Report coverage
        uses: getsentry/codecov-action@b3db4e382bd9859c913a96093a3d369b67f59177 # 0.4.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ./lcov.info
          coverage-format: lcov
          disable-search: true
          enable-tests: false
          post-pr-comment: true
          fail-ci-if-error: true
          name: rust-workspace
