name: Rust Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  coverage:
    name: Rust Workspace Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Generate workspace coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Report coverage
        uses: getsentry/codecov-action@a006c445d3aa57b4d347da1986c79cd06faa7a30 # 0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ./lcov.info
          coverage-format: lcov
          disable-search: true
          enable-tests: false
          post-pr-comment: true
          fail-ci-if-error: true
          name: rust-workspace
