name: Capture Foundation

on:
  pull_request:
    branches: [ main, "feat/capture-*" ]
    paths:
      - "crates/common/rokbattles-capture-adapters/**"
      - "crates/common/rokbattles-capture-runtime/**"
      - "crates/common/rokbattles-desktop-paths/**"
      - "crates/common/rokbattles-desktop-store/**"
      - "crates/apps/rokbattles-desktop-agent/**"
      - "crates/common/rokbattles-mail-codec/**"
      - "crates/common/rokbattles-gateway-protocol/**"
      - "crates/common/rokbattles-mail-reconstructor/**"
      - "crates/apps/rokbattles-ingress/**"
      - "crates/apps/rokbattles-nat-gateway/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/capture-adapters.yml"
  push:
    branches: [ main ]
    paths:
      - "crates/common/rokbattles-capture-adapters/**"
      - "crates/common/rokbattles-capture-runtime/**"
      - "crates/common/rokbattles-desktop-paths/**"
      - "crates/common/rokbattles-desktop-store/**"
      - "crates/apps/rokbattles-desktop-agent/**"
      - "crates/common/rokbattles-mail-codec/**"
      - "crates/common/rokbattles-gateway-protocol/**"
      - "crates/common/rokbattles-mail-reconstructor/**"
      - "crates/apps/rokbattles-ingress/**"
      - "crates/apps/rokbattles-nat-gateway/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/capture-adapters.yml"

permissions:
  contents: read

concurrency:
  group: capture-adapters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-tests:
    name: Synthetic capture (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Install repository-required ARM Linux linker
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld
      - name: Format
        run: cargo fmt -p rokbattles-desktop-agent -p rokbattles-mail-codec -p rokbattles-desktop-paths -p rokbattles-desktop-store -p rokbattles-capture-adapters -p rokbattles-capture-runtime -p rokbattles-gateway-protocol -p rokbattles-nat-gateway -p rokbattles-mail-reconstructor -p rokbattles-ingress -- --check
      - name: Lint
        run: cargo clippy --locked -p rokbattles-desktop-agent -p rokbattles-mail-codec -p rokbattles-desktop-paths -p rokbattles-desktop-store -p rokbattles-capture-adapters -p rokbattles-capture-runtime -p rokbattles-gateway-protocol --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Inspect native state-path prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $item = Get-Item $env:TEMP
          while ($null -ne $item) {
            Write-Output $item.FullName
            $acl = Get-Acl -LiteralPath $item.FullName
            Write-Output $acl.Owner
            Write-Output $acl.Sddl
            $item = $item.Parent
          }
      - name: Inspect Darwin ACL getter behavior
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import ctypes, os, pathlib, tempfile
          libc = ctypes.CDLL(None, use_errno=True)
          libc.acl_get_fd_np.argtypes = [ctypes.c_int, ctypes.c_int]
          libc.acl_get_fd_np.restype = ctypes.c_void_p
          libc.acl_free.argtypes = [ctypes.c_void_p]
          with tempfile.TemporaryDirectory() as temp:
              path = pathlib.Path(temp).resolve()
              for parent in (path, *path.parents):
                  fd = os.open(parent, os.O_RDONLY | os.O_NOFOLLOW)
                  ctypes.set_errno(0)
                  acl = libc.acl_get_fd_np(fd, 0x100)
                  error = ctypes.get_errno()
                  print(parent, 'ACL present', bool(acl), 'errno', error)
                  if acl:
                      libc.acl_free(acl)
                  os.close(fd)
          PYTHON
      - name: Synthetic and mock tests only
        run: cargo test --locked -p rokbattles-desktop-agent -p rokbattles-mail-codec -p rokbattles-desktop-paths -p rokbattles-desktop-store -p rokbattles-capture-adapters -p rokbattles-capture-runtime -p rokbattles-gateway-protocol --target ${{ matrix.target }}
        # No libpcap, WinDivert DLL or driver installation. No live-capture tests.
      - name: Shared NAT reassembly regression checks
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked -p rokbattles-nat-gateway --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --locked -p rokbattles-nat-gateway --target ${{ matrix.target }}
      - name: Incremental ingress and reconstruction checks
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked -p rokbattles-ingress -p rokbattles-mail-reconstructor --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --locked -p rokbattles-ingress -p rokbattles-mail-reconstructor --target ${{ matrix.target }}
