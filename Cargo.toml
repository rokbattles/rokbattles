[workspace]
members = [
    "crates/apps/*",
    "crates/common/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "1.6.1"

[workspace.dependencies]
anyhow = "1.0.104"
serde = "1.0.229"
serde_json = "1.0.151"
yaml_serde = "0.10.4"
clap = "4.6.5"
axum = { version = "0.8.9", default-features = false }
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tauri-build = "2.6.3"
tauri = "2.11.5"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
mongodb = "3.8.0"
mimalloc = "0.1.52"
zstd = { version = "0.13.3", default-features = false }
reqwest = { version = "0.12.28", default-features = false }
base64 = "0.22.1"
rand = "0.10.2"
sha2 = "0.10.9"
futures = { version = "0.3.33", default-features = false }
tauri-plugin-updater = "2.10.1"
notify = "8.2.0"
tempfile = "3.27.0"
bytes = "1.12.1"
dotenvy = "0.15.7"
flate2 = { version = "1.1.9", default-features = false }
thiserror = "2.0.19"
sentry = { version = "0.48.5", default-features = false }
tokio-cron-scheduler = "0.15.1"
hickory-proto = { version = "0.26.1", default-features = false }
tower = "0.5.3"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.clippy]
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
