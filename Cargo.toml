[workspace]
members = [
    "crates/common/rokbattles-drastc",
    "crates/common/rokbattles-mail-cli",
    "crates/common/rokbattles-mail-decoder",
    "crates/common/rokbattles-mail-decoder-simd",
    "crates/common/rokbattles-mail-registry",
    "crates/common/rokbattles-mail-processor-alliance-aoo-battle-info",
    "crates/common/rokbattles-mail-processor-alliance-aoo-battle-results",
    "crates/common/rokbattles-mail-processor-alliance-aoo-individual-results",
    "crates/common/rokbattles-mail-processor-alliance-aoo-registration",
    "crates/common/rokbattles-mail-processor-barcanyonkillboss",
    "crates/common/rokbattles-mail-processor-battle",
    "crates/common/rokbattles-mail-processor-duelbattle2",
    "crates/common/rokbattles-mail-processor-eventmemberlootreport",
    "crates/common/rokbattles-mail-processor-rss",
    "crates/common/rokbattles-mail-processor-scoutreport",
    "crates/common/rokbattles-mail-sdk",
    "crates/common/rokbattles-mail-processor-system-barbarianfort",
    "crates/common/rokbattles-mail-processor-system-kahartreasure",
    "crates/apps/rokbattles-api",
    "crates/common/rokbattles-bson",
    "crates/apps/rokbattles-jobs",
    "crates/apps/rokbattles-ingress",
    "crates/apps/rokbattles-processor",
    "crates/apps/rokbattles-desktop",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
serde = "1.0.229"
serde_json = "1.0.150"
yaml_serde = "0.10.4"
clap = "4.6.2"
axum = "0.8.9"
tokio = "1.53.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tauri-build = "2.6.3"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
mongodb = "3.8.0"
zstd = "0.13.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rand = "0.10.2"
sha2 = "0.10.9"
hex = "0.4.3"
md-5 = { version = "0.11.0" }
futures = "0.3.33"
tauri-plugin-updater = "2.10.1"
notify = "8.2.0"
tempfile = "3.27.0"
bytes = "1.12.1"
dotenvy = "0.15.7"
flate2 = { version = "1.1.9", default-features = false }
thiserror = "2.0.19"
sentry = { version = "0.48.5", default-features = false, features = ["rustls", "backtrace", "contexts", "debug-images", "panic", "reqwest"] }
tokio-cron-scheduler = "0.15.1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.clippy]
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
