packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: false

overrides:
  "next>sharp": "-"
  fast-uri: 3.1.5
  postcss: 8.5.23
  nanoid: 3.3.18

shellEmulator: true

minimumReleaseAge: 2880 # 48 hours
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - next
  - "@next/*"
