packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: false

overrides:
  "fast-uri@": 3.1.4
  "next@16.2.11>sharp": "-"
  postcss: 8.5.18

shellEmulator: true

minimumReleaseAge: 2880 # 48 hours
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - brace-expansion@5.0.8
  - next
  - "@next/*"
