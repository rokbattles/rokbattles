packages:
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: false
  workerd: true

overrides:
  "@tailwindcss/typography>postcss-selector-parser": "6.1.5"
  "next>sharp": "-"

shellEmulator: true

minimumReleaseAge: 2880 # 48 hours
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - next
  - "@next/*"
