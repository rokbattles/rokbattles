[package]
name = "core-tcp-stream"
version = "1.0.5"
edition = "2024"

[features]
default = []
pcap-capture = ["dep:pcap"]

[dependencies]
base64 = { workspace = true }
pcap = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[lib]
doctest = false
