[package]
name = "rokbattles-desktop-agent"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
rokbattles-capture-ipc = { path = "../../common/rokbattles-capture-ipc" }
rokbattles-capture-runtime = { path = "../../common/rokbattles-capture-runtime" }
tokio-stream = "0.1.19"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
dirs = "6.0.0"
reqwest = { workspace = true, features = ["json", "multipart", "rustls-tls-native-roots", "stream"] }
rokbattles-desktop-store = { path = "../../common/rokbattles-desktop-store" }
rokbattles-mail-codec = { path = "../../common/rokbattles-mail-codec", features = ["read"] }
rokbattles-mail-registry = { path = "../../common/rokbattles-mail-registry" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal", "sync", "io-util", "net"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile.workspace = true
rokbattles-mail-codec = { path = "../../common/rokbattles-mail-codec", features = ["read", "write"] }

[lints]
workspace = true
