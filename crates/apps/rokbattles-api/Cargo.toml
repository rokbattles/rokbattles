[package]
name = "rokbattles-api"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
doctest = false

[dependencies]
rustc-hash.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["form", "http1", "json", "query", "tokio", "tracing"] }
base64.workspace = true
dotenvy.workspace = true
futures = { workspace = true, features = ["std"] }
mongodb.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"] }
rokbattles-bson = { path = "../../common/rokbattles-bson" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
ring.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
yaml_serde.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["sync", "time"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { workspace = true, features = ["secure"] }

[lints]
workspace = true
