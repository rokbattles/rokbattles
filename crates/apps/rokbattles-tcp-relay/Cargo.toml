[package]
name = "rokbattles-tcp-relay"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
dotenvy = { workspace = true }
flate2 = { workspace = true, features = ["zlib-rs"] }
reqwest = { workspace = true, features = ["json", "multipart", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { workspace = true, features = ["secure"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
