[package]
name = "rokbattles-ingress"
version = "1.6.1"
edition = "2024"

[dependencies]
axum = { workspace = true, features = ["multipart"] }
bytes = { workspace = true }
dotenvy = { workspace = true }
flate2 = { workspace = true, default-features = false, features = ["zlib"] }
rokbattles-mail-decoder = { path = "../../common/rokbattles-mail-decoder" }
rokbattles-mail-registry = { path = "../../common/rokbattles-mail-registry" }
mongodb = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zstd = { workspace = true }
sentry = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { workspace = true }
