[package]
name = "rokbattles-desktop"
description = "A community-driven platform for sharing battle reports and surfacing actionable trends in Rise of Kingdoms."
authors = ["Sylke Technologies, LLC"]
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
# A distinct library name avoids collisions with the binary's Windows debug symbols.
# See https://github.com/rust-lang/cargo/issues/8519.
name = "rokbattles_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[dependencies]
rustc-hash.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-opener.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri-plugin-dialog.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
reqwest = { workspace = true, features = ["json", "multipart", "rustls-tls-native-roots"] }
rokbattles-mail-codec = { path = "../../common/rokbattles-mail-codec", features = ["read"] }
rokbattles-mail-registry = { path = "../../common/rokbattles-mail-registry" }
tauri-plugin-updater.workspace = true
notify.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55.0"

[target.'cfg(target_os = "linux")'.dependencies]
yaml_serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart.workspace = true
tauri-plugin-single-instance.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
rokbattles-mail-codec = { path = "../../common/rokbattles-mail-codec", features = ["write"] }
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true
