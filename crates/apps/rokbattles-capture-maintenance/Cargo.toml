[package]
name = "rokbattles-capture-maintenance"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
rokbattles-capture-helper = { path = "../rokbattles-capture-helper" }
rokbattles-capture-ipc = { path = "../../common/rokbattles-capture-ipc" }
rokbattles-capture-adapters = { path = "../../common/rokbattles-capture-adapters" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_Shell"] }

[lints]
workspace = true
