[package]
name = "rokbattles-webgpu-map-engine"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
rokbattles-container = { path = "../rokbattles-container", default-features = false, features = ["read"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["std", "webgpu", "webgl", "wgsl"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
bytemuck = { workspace = true, features = ["derive"] }

[dev-dependencies]
rokbattles-container = { path = "../rokbattles-container", default-features = false, features = ["write"] }

[lints]
workspace = true
