[package]
name = "rokbattles-ingress"
version = "1.5.2"
edition = "2024"

[dependencies]
axum = { workspace = true, features = ["multipart"] }
bytes = { workspace = true }
dotenvy = { workspace = true }
flate2 = { workspace = true, default-features = false, features = ["zlib"] }
mail-decoder = { path = "../mail-decoder" }
mail-registry = { path = "../mail-registry" }
mongodb = { workspace = true }
rokbattles-bson = { path = "../rokbattles-bson" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zstd = { workspace = true }
sentry = { workspace = true }
