talents:
  1:
    name:
      ar: "التضاريس المعادية"
      de: "Feindliches Gelände"
      en: "Hostile Terrain"
      es: "Terreno hostil"
      fr: "Terrain hostile"
      id: "Medan Musuh"
      it: "Terreno ostile"
      ja: "敵陣強攻"
      ko: "적진 쇄도"
      ms: "Rupa Bumi Berbahaya"
      pl: "Wrogi teren"
      pt: "Terreno Hostil"
      ru: "Враждебная местность"
      th: "บุกตะลุยแดนศัตรู"
      tr: "Tehlikeli Arazi"
      vi: "Lãnh Thổ Đối Địch"
      zh_CN: "敌境强攻"
      zh_TW: "敵境強攻"
    description:
      ar: "تُلحِق ضررًا أكبر بنسبة 20% في أراضي العدو."
      de: "+20 % Schaden in feindlichem Gebiet zufügen."
      en: "Deal 20% more damage in enemy territory."
      es: "Provoca un 20 % más de daño en territorio enemigo."
      fr: "Inflige 20 % de dégâts en plus en territoire ennemi."
      id: "Memberikan damage 20% lebih banyak di wilayah musuh."
      it: "Infliggi un 20% di danni in più in territorio nemico."
      ja: "敵の領土範囲内で、自部隊の与える全てのダメージが20%上昇する。"
      ko: "적군 영토 범위 내에서 입히는 모든 피해 +20%"
      ms: "Menyebabkan 20% lebih banyak kerosakan di wilayah musuh."
      pl: "Zadawaj o 20% więcej obrażeń na terytorium przeciwnika."
      pt: "Causa 20% a mais de dano em território inimigo."
      ru: "Наносят на 20% больше урона на вражеской территории."
      th: "สร้างความเสียหายเพิ่มขึ้น 20% ในอาณาเขตศัตรู"
      tr: "Düşman bölgesinde %20 daha çok hasar verir."
      vi: "Gây thêm 20% sát thương trong lãnh thổ kẻ thù."
      zh_CN: "在敌方领土范围内造成的所有伤害提升20%。"
      zh_TW: "在敵方領土範圍內造成的所有傷害提升20%。"

  2:
    name:
      ar: "ساحق الرتب"
      de: "Rangbrecher"
      en: "Rank Crusher"
      es: "Rompefilas"
      fr: "Écraseur de rang"
      id: "Penghancur Peringkat"
      it: "Spezzagradi"
      ja: "破陣"
      ko: "파진"
      ms: "Penggempur Kedudukan"
      pl: "Niszczyciel rang"
      pt: "Destruidor de Escalões"
      ru: "Крушитель рангов"
      th: "ทำลายกระบวนทัพ"
      tr: "Rütbe Avcısı"
      vi: "Phá Vỡ Đội Hình"
      zh_CN: "破阵"
      zh_TW: "破陣"
    description:
      ar: "تُلحِق قواتك الميدانية ضررًا أكبر بنسبة 15% عند مهاجمة الجيوش المُحتشدة أو قوات الحامية."
      de: "Deine Feldtruppen fügen +15 % Schaden zu, wenn sie Sammeltruppen oder Garnisonstruppen angreifen."
      en: "Your field troops deal 15% more damage when attacking rallied armies or garrison troops."
      es: "Tus tropas de campo provocan un 15 % más de daño al atacar ejércitos concentrados o tropas de guarnición."
      fr: "Vos troupes de terrain infligent 15 % de dégâts en plus lors d'attaques contre des armées ralliées ou des troupes de garnison."
      id: "Pasukan lapanganmu memberikan damage 15% lebih banyak saat menyerang pasukan rally atau pasukan garnisun."
      it: "Le tue truppe da campo infliggono un 15% di danni in più quando attaccano eserciti radunati o truppe di guarnigione."
      ja: "自部隊が野戦部隊の場合：自部隊の集結部隊や防衛部隊に与える全てのダメージが15%上昇する。"
      ko: "야전 부대 통솔 시: 집결 부대/주둔 부대를 공격 시 입히는 모든 피해 +15%"
      ms: "Trup lapangan anda menyebabkan 15% lebih banyak kerosakan apabila menyerang trup rali atau pasukan garison."
      pl: "Twoje oddziały w polu zadają o 15% więcej obrażeń podczas atakowania zmobilizowanych armii lub garnizonu."
      pt: "Suas tropas de campo causam 15% a mais de dano ao atacar exércitos reunidos ou tropas de guarnição."
      ru: "Ваши отряды в поле наносят на 15% больше урона при атаке созванных армий или отрядов в гарнизоне."
      th: "กองทหารภาคสนามของคุณจะสร้างความเสียหายเพิ่ม 15% เมื่อโจมตีกองทหารที่ระดมทัพหรือกองทหารประจำการ"
      tr: "Sahra kıtaların, seferberlik ordularına veya garnizon kıtalarına saldırırken %15 daha çok hasar verir."
      vi: "Đội quân dã chiến của ngài gây thêm 15% sát thương khi tấn công đội quân tập kết hoặc đội quân đồn trú."
      zh_CN: "自身为野战部队时：进攻集结部队或驻防部队造成的所有伤害提升15%。"
      zh_TW: "自身為野戰部隊時：進攻集結部隊或駐防部隊造成的所有傷害提升15%。"

  3:
    name:
      ar: "العزيمة"
      de: "Entschlossenheit"
      en: "Resolve"
      es: "Determinación"
      fr: "Opiniâtreté"
      id: "Tekad"
      it: "Risolutezza"
      ja: "百戦錬磨"
      ko: "백전불굴"
      ms: "Keazaman"
      pl: "Determinacja"
      pt: "Determinação"
      ru: "Решимость"
      th: "แน่วแน่"
      tr: "Azim"
      vi: "Quyết Tâm"
      zh_CN: "百战不摧"
      zh_TW: "百戰不摧"
    description:
      ar: "تتلقّى ضررًا أقل بنسبة 2.5%."
      de: "2.5 % weniger Schaden erleiden."
      en: "Take 2.5% less damage."
      es: "Sufre un 2.5 % menos de daño."
      fr: "Subit 2.5 % de dégâts en moins."
      id: "Menerima damage 2.5% lebih sedikit."
      it: "Subisci un 2.5% di danni in meno."
      ja: "自部隊の受ける全てのダメージが2.5%減少する。"
      ko: "받는 모든 피해 -2.5%"
      ms: "Menerima 2.5% kurang kerosakan."
      pl: "Otrzymuj o 2.5% mniej obrażeń."
      pt: "Sofre 2.5% a menos de dano."
      ru: "Получают на 2.5% меньше урона."
      th: "รับความเสียหายลดลง 2.5%"
      tr: "%2.5 daha az hasar alır."
      vi: "Nhận ít đi 2.5% sát thương."
      zh_CN: "受到的所有伤害降低2.5%。"
      zh_TW: "受到的所有傷害降低2.5%。"

  4:
    name:
      ar: "الزخم السريع"
      de: "Rascher Schwung"
      en: "Swift Momentum"
      es: "Impulso arrollador"
      fr: "Élan fulgurant"
      id: "Momentum Cepat"
      it: "Impeto rapido"
      ja: "兵鋒盛んなり"
      ko: "절정의 기량"
      ms: "Momentum Pantas"
      pl: "Błyskawiczny impet"
      pt: "Impulso Rápido"
      ru: "Стремительный импульс"
      th: "คมศึกเกรียงไกร"
      tr: "Seri İvme"
      vi: "Đà Tiến Nhanh Chóng"
      zh_CN: "兵锋正盛"
      zh_TW: "兵鋒正盛"
    description:
      ar: "تُلحِق ضررًا عاديًا أكبر بنسبة 10%."
      de: "10 % mehr normalen Schaden verursachen."
      en: "Deal 10% more normal damage."
      es: "Provoca un 10 % más de daño normal."
      fr: "Inflige 10 % de dégâts normaux en plus."
      id: "Memberikan damage normal 10% lebih banyak."
      it: "Infliggi un 10% di danni normali in più."
      ja: "自部隊の通常攻撃ダメージが10%上昇する。"
      ko: "일반 공격 피해 +10%"
      ms: "Menyebabkan 10% lebih banyak kerosakan biasa."
      pl: "Zadawaj o 10% większe podstawowe obrażenia."
      pt: "Causa 10% a mais de dano normal."
      ru: "Наносят на 10% больше обычного урона."
      th: "สร้างความเสียหายปกติเพิ่มขึ้น 10%"
      tr: "%10 daha çok normal hasar verir."
      vi: "Gây thêm 10% sát thương thường."
      zh_CN: "普通攻击伤害提升10%。"
      zh_TW: "普通攻擊傷害提升10%。"

  5:
    name:
      ar: "سيف ذو حدين"
      de: "Zweischneidiges Schwert"
      en: "Double-Edged Sword"
      es: "Espada de doble filo"
      fr: "Épée à double tranchant"
      id: "Pedang Bermata Dua"
      it: "Lama a doppio taglio"
      ja: "諸刃の剣"
      ko: "양날검"
      ms: "Pedang Bermata Dua"
      pl: "Obosieczny miecz"
      pt: "Espada de Dois Gumes"
      ru: "Обоюдоострый меч"
      th: "ดาบสองคม"
      tr: "İki Tarafı Keskin Kılıç"
      vi: "Gươm Hai Lưỡi"
      zh_CN: "双刃剑"
      zh_TW: "雙刃劍"
    description:
      ar: "تُلحِق ضررًا أكبر بنسبة 15%، لكن تتلقى أيضًا ضررًا أكبر بنسبة 5%."
      de: "15 % mehr Schaden verursachen, aber auch 5 % mehr Schaden erleiden."
      en: "Deal 15% more damage, but also take 5% more damage."
      es: "Provoca un 15 % más de daño, pero también sufre un 5 % más de daño."
      fr: "Inflige 15 % de dégâts en plus, mais subit aussi 5 % de dégâts en plus."
      id: "Memberikan damage 15% lebih banyak, tetapi juga menerima damage 5% lebih banyak."
      it: "Infliggi un 15% di danni in più, ma subisci anche un 5% di danni in più."
      ja: "自部隊の与える全てのダメージが15%、受けるダメージが5%上昇する。"
      ko: "입히는 모든 피해 +15%, 받는 모든 피해 +5%"
      ms: "Menyebabkan 15% lebih banyak kerosakan, tetapi turut menerima 5% lebih banyak kerosakan."
      pl: "Zadawaj o 15% więcej obrażeń, ale i otrzymuj o 5% więcej obrażeń."
      pt: "Causa 15% a mais de dano, mas também sofre 5% a mais de dano."
      ru: "Наносят на 15% больше урона, но и получают на 5% больше урона."
      th: "สร้างความเสียหายเพิ่มขึ้น 15% แต่จะรับความเสียหายเพิ่มขึ้น 5% เช่นกัน"
      tr: "%15 daha çok hasar verir ancak ayrıca %5 daha fazla hasar alır."
      vi: "Gây thêm 15% sát thương, nhưng cũng nhận thêm 5% sát thương."
      zh_CN: "造成的所有伤害提升15%，受到的所有伤害提升5%。"
      zh_TW: "造成的所有傷害提升15%，受到的所有傷害也提升5%。"

  6:
    name:
      ar: "ضربة مدوية"
      de: "Nachhallender Schlag"
      en: "Resounding Strike"
      es: "Golpe atronador"
      fr: "Frappe retentissante"
      id: "Serangan Menggema"
      it: "Colpo risonante"
      ja: "残響連撃"
      ko: "여세의 메아리"
      ms: "Serangan Bergema"
      pl: "Grzmiące uderzenie"
      pt: "Golpe Retumbante"
      ru: "Громоподобный удар"
      th: "คลื่นสะท้อนทรงพลัง"
      tr: "Yankılı Saldırı"
      vi: "Đòn Đánh Vang Dội"
      zh_CN: "余势回响"
      zh_TW: "餘勢迴響"
    description:
      ar: "عندما تُلحِق قواتك الميدانية ضرر مهارة/ضرر ضربة قاضية/ضرر هجوم مجموعة، فإنها تُلحِق مثيلاً إضافيًا من ضرر المهارة/ضرر الضربة القاضية/ضرر هجوم المجموعة للقوة المستهدفة المصابة (معامل الضرر 600). يمكن لكل من القوات تفعيل هذا التأثير مرة واحدة كل 10 من الثواني (ينطبق وقت التهدئة على المباراة بأكملها ولا يتم إعادة ضبطه عند الخروج من المعركة)."
      de: "Wenn deine Feldtruppen Fähigkeits-/Schmettern-/Kombo-Angriffsschaden zufügen, fügen sie der getroffenen Truppe eine zusätzliche Instanz von Fähigkeits-/Schmettern-/Kombo-Angriffsschaden zu (Schadensfaktor 600). Jede Truppe kann diesen Effekt einmal alle 10 Sekunden auslösen (Abklingzeit gilt für das gesamte Match und wird beim Verlassen des Kampfes nicht zurückgesetzt)."
      en: "When your field troops deal skill/smite/combo attack damage, they deal an extra instance of skill/smite/combo attack damage to the hit target troop (Damage Factor 600). Each troop can trigger this effect once every 10 seconds (Cooldown applies to the entire match and does not reset upon exiting battle)."
      es: "Cuando tus tropas de campo provocan daño de habilidad/embate/ataque combinado, provocan una instancia adicional de daño de habilidad/embate/ataque combinado a la tropa objetivo golpeada (factor de daño 600). Cada tropa puede activar este efecto una vez cada 10 s (el enfriamiento se aplica a toda la partida y no se reinicia al salir de batalla)."
      fr: "Lorsque vos troupes de terrain infligent des dégâts de compétence/de concussion/d'attaque combinée, elles infligent une instance supplémentaire de dégâts de compétence/de concussion/d'attaque combinée à la troupe cible touchée (multiplicateur de dégâts : 600). Chaque troupe peut déclencher cet effet une fois toutes les 10 s (la recharge s'applique à l'ensemble du match et n'est pas réinitialisée en quittant la bataille)."
      id: "Ketika pasukan lapanganmu memberikan damage skill/hantaman/serangan kombo, mereka memberikan damage skill/hantaman/serangan kombo tambahan kepada pasukan target yang terkena (Faktor Damage 600). Setiap pasukan dapat memicu efek ini sekali setiap 10 detik (Cooldown berlaku untuk seluruh pertandingan dan tidak direset saat keluar dari pertempuran)."
      it: "Quando le tue truppe da campo infliggono danni da abilità/percosse/attacco combinato, infliggono un'istanza aggiuntiva di danni da abilità/percosse/attacco combinato alla truppa bersaglio colpita (fattore di danno 600). Ogni truppa può attivare questo effetto una volta ogni 10 s (il tempo di ricarica si applica all'intero scontro e non si resetta uscendo dalla battaglia)."
      ja: "自部隊が野戦部隊の場合：スキル/重撃/連撃ダメージを与えた時、そのダメージを受けたターゲット部隊に追加でスキル/重撃/連撃ダメージ（ダメージ係数600）を1回与える。同じ部隊に対して10秒ごとに最大1回発動可能（このクールタイムは常に適用され、戦闘を離脱してもリセットされない）。"
      ko: "야전 부대 통솔 시: 스킬/강타/연격 피해를 입힐 경우, 해당 피해를 받은 대상 부대에 스킬/강타/연격 피해(피해 계수 600)를 1회 추가로 입힌다. 해당 효과는 부대당 10초마다 최대 1회 발동된다(글로벌 쿨타임 적용, 전투 이탈 시 초기화되지 않음)."
      ms: "Apabila trup lapangan anda menyebabkan kerosakan kemahiran/pukulan/serangan kombo, mereka menyebabkan kerosakan kemahiran/pukul/serangan kombo tambahan kepada trup sasaran yang terkena serangan (Faktor Kerosakan 600). Setiap trup boleh mencetuskan kesan ini sekali setiap 10 saat (Bertenang terpakai kepada keseluruhan perlawanan dan tidak ditetapkan semula apabila keluar daripada pertempuran)."
      pl: "Gdy twoje oddziały w polu zadają obrażenia od umiejętności/rąbnięcia/ataku kombo, zadają trafionym oddziałom przeciwnika dodatkowe obrażenia od powyższych (współczynnik obrażeń: 600). Każdy oddział może wywołać ten efekt raz na 10 s (czas odnowienia dotyczy całej walki i nie resetuje się po opuszczeniu bitwy)."
      pt: "Quando suas tropas de campo causam dano de habilidade/concussão/ataque em combo, elas causam uma instância adicional de dano de habilidade/concussão/ataque em combo à tropa alvo atingida (Fator de Dano: 600). Cada tropa pode ativar este efeito uma vez a cada 10 s (a espera se aplica a toda a partida e não é reiniciado ao sair da batalha)."
      ru: "Когда ваши отряды в поле наносят урон навыками/комбо-атаками или ударный урон, они наносят ими дополнительный урон пораженному отряду (множитель урона: 600). Каждый отряд может активировать этот эффект раз в 10 сек. (перезарядка действует на весь матч и не сбрасывается при выходе из битвы)."
      th: "เมื่อกองทหารภาคสนามของคุณสร้างความเสียหายจากทักษะ/ทุบ/การโจมตีคอมโบ พวกเขาจะสร้างความเสียหายจากทักษะ/ทุบ/การโจมตีคอมโบเพิ่มเติมต่อกองทหารเป้าหมายที่โดนโจมตี (ตัวคูณความเสียหาย 600) กองทหารแต่ละกองสามารถเรียกใช้เอฟเฟ็กต์นี้ได้หนึ่งครั้งทุก 10 วินาที (คูลดาวน์ใช้กับการต่อสู้ทั้งหมดและไม่รีเซ็ตเมื่อออกจากการต่อสู้)"
      tr: "Sahra kıtaların beceri/darbe/kombo saldırı hasarı verdiğinde vurulan hedef kıtaya ek bir beceri/darbe/kombo saldırı hasarı verir (Hasar Faktörü 600). Her kıta, bu etkiyi 10 saniyede bir tetikleyebilir (Bekleme süresi tüm maç boyunca geçerlidir ve savaştan çıkıldığında sıfırlanmaz)."
      vi: "Khi đội quân dã chiến của ngài gây sát thương kỹ năng/trừng phạt/tấn công combo, họ gây thêm một lần sát thương kỹ năng/trừng phạt/tấn công combo lên đội quân mục tiêu trúng đòn (Hệ số sát thương 600). Mỗi đội quân có thể kích hoạt hiệu ứng này một lần mỗi 10 giây (Thời gian hồi chiêu áp dụng cho toàn bộ trận đấu và không đặt lại khi thoát khỏi trận chiến)."
      zh_CN: "自身为野战部队时：造成技能/重击/连击伤害时，对受到该次伤害的目标部队额外造成一次技能/重击/连击伤害（伤害系数600）。每支部队每10秒最多触发一次（全局冷却，脱战不重置）。"
      zh_TW: "自身為野戰部隊時：造成技能/重擊/連擊傷害時，對受到該次傷害的目標部隊額外造成一次技能/重擊/連擊傷害（傷害係數600）。每支部隊每10秒最多觸發一次（全局冷卻，脫戰不重置）。"

  7:
    name:
      ar: "عداد القوة"
      de: "Konterschlag"
      en: "Power Counter"
      es: "Contrapoder"
      fr: "Riposte décisive"
      id: "Balasan Kekuatan"
      it: "Contrasto di potere"
      ja: "後手必勝"
      ko: "전술적 반격"
      ms: "Serangan Balas Ampuh"
      pl: "Potężny kontratak"
      pt: "Dar o Troco"
      ru: "Мощная контратака"
      th: "สวนกลับทรงพลัง"
      tr: "Güçlü Karşı Saldırı"
      vi: "Phản Đòn Sức Mạnh"
      zh_CN: "后发制人"
      zh_TW: "後發制人"
    description:
      ar: "تُلحِق قواتك الميدانية ضرر هجوم مضاد أكبر بنسبة 25%."
      de: "Deine Feldtruppen verursachen +25 % Gegenangriffsschaden."
      en: "Your field troops deal 25% more counterattack damage."
      es: "Tus tropas de campo provocan un 25 % más de daño de contraataque."
      fr: "Vos troupes de terrain infligent 25 % de dégâts de contre-attaque en plus."
      id: "Pasukan lapanganmu memberikan damage serangan balasan 25% lebih banyak."
      it: "Le tue truppe da campo infliggono un 25% di danni da contrattacco in più."
      ja: "自身が野戦部隊の場合：反撃ダメージが25%上昇する。"
      ko: "야전 부대 통솔 시: 반격 피해 +25%"
      ms: "Trup lapangan anda menyebabkan 25% lebih banyak kerosakan serangan balas."
      pl: "Twoje oddziały w polu zadają o 25% więcej obrażeń od kontrataku."
      pt: "Suas tropas de campo causam 25% a mais de dano de contra-ataque."
      ru: "Ваши отряды в поле наносят на 25% больше урона контратаками."
      th: "กองทหารภาคสนามของคุณจะสร้างความเสียหายจากการโจมตีสวนกลับเพิ่ม 25%"
      tr: "Sahra kıtaların %25 daha çok karşı saldırı hasarı verir."
      vi: "Đội quân dã chiến gây thêm 25% sát thương phản công."
      zh_CN: "自身为野战部队时：反击伤害提升25%。"
      zh_TW: "自身為野戰部隊時：反擊傷害提升25%。"

  8:
    name:
      ar: "توهج الحرب"
      de: "Kriegsglut"
      en: "War Glow"
      es: "Resplandor bélico"
      fr: "Éclat de la guerre"
      id: "Cahaya Perang"
      it: "Bagliore bellico"
      ja: "闘争激化"
      ko: "전의 격화"
      ms: "Semarak Peperangan"
      pl: "Blask wojny"
      pt: "Brilho da Guerra"
      ru: "Огни войны"
      th: "ประกายไฟแห่งสงคราม"
      tr: "Savaş Parıltısı"
      vi: "Ánh Sáng Chiến Tranh"
      zh_CN: "愈战愈烈"
      zh_TW: "愈戰愈烈"
    description:
      ar: "عند بدء الحشود أو الحاميات: ستُلحِق قواتك والقوات المستهدفة ضررًا أكبر بنسبة 1% لبعضهما البعض بعد كل 10 من الثواني من القتال (حتى 100%)."
      de: "Beim Initiieren von Sammelangriffen oder Garnisonen: Sowohl deine Truppe als auch die Zieltruppe fügen sich nach jeweils 10 Sekunden Kampf +1 % Schaden zu (bis zu 100 %)."
      en: "When initiating rallies or garrisons: Both your troop and the target troop will deal 1% more damage to each other after every 10 seconds of combat (up to 100%)."
      es: "Al iniciar concentraciones o guarniciones: tanto tu tropa como la tropa objetivo provocarán un 1 % más de daño entre sí después de cada 10 s de combate (hasta un 100 %)."
      fr: "Lors de l'initiation de rassemblements ou de garnisons : votre troupe et la troupe cible infligeront 1 % de dégâts en plus l'une à l'autre toutes les 10 s de combat (jusqu'à 100 %)."
      id: "Saat memulai rally atau garnisun: Pasukanmu dan pasukan target akan memberikan damage 1% lebih banyak satu sama lain setelah setiap 10 detik pertempuran (hingga 100%)."
      it: "Quando avvii raduni o guarnigioni: sia la tua truppa che la truppa bersaglio infliggeranno un 1% di danni in più l'una all'altra dopo ogni 10 s di combattimento (fino a un 100%)."
      ja: "集結または防衛の発動した場合：10秒ごとに双方が相手に与える全てのダメージが1%上昇する。最大100%まで上昇可能。"
      ko: "집결 개시 또는 주둔 시: 대상 부대와 10초 교전할 때마다 양측 서로 상대방에게 입히는 모든 피해 +1%(최대 100% 증가)"
      ms: "Apabila memulakan rali atau melakukan garison: Trup anda dan trup sasaran akan menyebabkan 1% lebih banyak kerosakan kepada satu sama lain selepas setiap 10 saat pertempuran (hingga 100%)."
      pl: "Podczas inicjowania mobilizacji lub garnizonów: Zarówno twój oddział, jak i oddział przeciwnika będą zadawać sobie nawzajem o 1% więcej obrażeń co 10 s walki (do 100%)."
      pt: "Ao iniciar reuniões ou guarnições: tanto sua tropa quanto a tropa alvo causarão 1% a mais de dano uma à outra após cada 10 s de combate (até 100%)."
      ru: "При инициировании сбора или гарнизона: и ваш отряд, и целевой отряд будут наносить на 1% больше урона друг другу каждые 10 сек. боя (до 100%)."
      th: "เมื่อเริ่มต้นการรวมพลหรือประจำการ: ทั้งกองทหารของคุณและกองทหารเป้าหมายจะสร้างความเสียหายต่อกันเพิ่มขึ้น 1% หลังจากการต่อสู้ทุก 10 วินาที (สูงสุด 100%)"
      tr: "Seferberlik veya garnizon başlatırken: Hem kıtan hem de hedef kıta her 10 saniyelik çarpışmadan sonra birbirlerine %1 daha çok hasar verir (%100 oranına kadar)."
      vi: "Khi phát động tập kết hoặc đồn trú: Cả đội quân của ngài và đội quân mục tiêu sẽ gây thêm 1% sát thương cho nhau sau mỗi 10 giây chiến đấu (tối đa 100%)."
      zh_CN: "发起集结或驻防时：与目标部队每交战10秒，双方对对方造成的所有伤害提升1%，最多可提升100%。"
      zh_TW: "發起集結或駐防時：與目標部隊每交戰10秒，雙方對敵方所造成的所有傷害提升1%，最多可提升100%。"

  9:
    name:
      ar: "كسر الحصار"
      de: "Belagerungsdurchbruch"
      en: "Siege Break"
      es: "Corte implacable"
      fr: "Bris de siège"
      id: "Penerobos Serbuan"
      it: "Rottura dell'assedio"
      ja: "迎撃態勢"
      ko: "고립 저항"
      ms: "Pemecah Kepungan"
      pl: "Przełamanie oblężenia"
      pt: "Fim do Cerco"
      ru: "Прорыв осады"
      th: "ตีฝ่าวงล้อม"
      tr: "Kuşatma Bozan"
      vi: "Chống Vây Thành"
      zh_CN: "抗围"
      zh_TW: "抗圍"
    description:
      ar: "عندما يتبقى لدى قواتك الميدانية أقل من 60% من الوحدات وتكون محاصَرة بواسطة 5+ من قوات العدو، فإن قواتك الميدانية تكتسب 5% من مقاومة الضرر. بالإضافة إلى ذلك، فإن أي قوات تُلحِق بها ضرر الهجوم المضاد تفقد 20% من سرعة المسيرة."
      de: "Wenn deine Feldtruppen weniger als 60 % verbleibende Einheiten haben und von 5+ gegnerischen Truppen umzingelt sind, erhalten sie 5 % Schadenswiderstand. Zusätzlich verliert jede Truppe, der sie Gegenangriffsschaden zufügen, 20 % Marschtempo."
      en: "When your field troops have less than 60% units remaining and are surrounded by 5+ enemy troops, your field troops gain 5% damage resistance. In addition, any troop they deal counterattack damage to loses 20% March Speed."
      es: "Cuando tus tropas de campo tienen menos del 60 % de unidades restantes y están rodeadas por 5 o más tropas enemigas, obtienen un 5 % de resistencia al daño. Además, cualquier tropa a la que provoquen daño de contraataque pierde un 20 % de velocidad de marcha."
      fr: "Si vos troupes de terrain ont moins de 60 % d'unités restantes et sont encerclées par au moins 5 troupes ennemies, vos troupes de terrain gagnent 5 % de résistance aux dégâts. De plus, toute troupe à laquelle elles infligent des dégâts de contre-attaque perd 20 % de vitesse de marche."
      id: "Ketika pasukan lapanganmu memiliki sisa unit kurang dari 60% dan dikepung oleh 5+ pasukan musuh, pasukan lapanganmu memperoleh 5% resistansi damage. Selain itu, pasukan yang terkena damage serangan balasan dari mereka akan kehilangan 20% Kecepatan Berjalan."
      it: "Quando le tue truppe da campo hanno meno di un 60% di unità rimanenti e sono circondate da più di 5 truppe nemiche, le tue truppe da campo ottengono un 5% di resistenza ai danni. Inoltre, qualsiasi truppa a cui infliggono danni da contrattacco perde un 20% di velocità di marcia."
      ja: "自部隊が野戦部隊の場合：兵力が60%以下になった時、受けた挟み撃ちの数が5以上の場合、追加で5%の全ダメージ抵抗を獲得し、自部隊の反撃ダメージを受けた部隊の行軍速度を20%減少させる。"
      ko: "야전 부대 통솔 시: 병력이 60% 이하로 하락하고 5개 이상의 부대로부터 협공받을 경우, 통솔한 부대의 모든 피해 저항 +5%, 통솔한 부대의 반격 피해를 받은 대상 부대의 행군 속도 -20%"
      ms: "Apabila trup lapangan anda berbaki kurang daripada 60% unit dan dikepung oleh 5+ trup musuh, trup lapangan anda memperoleh 5% rintangan kerosakan. Selain itu, mana-mana trup yang menerima kerosakan serangan balas daripada mereka akan kehilangan 20% Kelajuan Kawad."
      pl: "Gdy twoje oddziały w polu mają mniej niż 60% jednostek i otacza je określona liczba oddziałów przeciwnika (ponad 5), zyskują 5% odporności na obrażenia. Dodatkowo każdy oddział, któremu zadają obrażenia od kontrataku, traci 20% szybkości marszu."
      pt: "Quando suas tropas de campo têm menos de 60% de unidades restantes e estão cercadas por 5 ou mais tropas inimigas, suas tropas de campo ganham 5% de resistência a dano. Além disso, qualquer tropa que receber dano de contra-ataque delas perde 20% de Velocidade de Marcha."
      ru: "Когда в ваших отрядах в поле осталось менее 60% воинов и они окружены вражескими отрядами в количестве 5 или более, ваши отряды в поле получают 5% к сопротивлению урону. Кроме того, каждый отряд, которому они наносят урон контратаками, теряет 20% скорости на марше."
      th: "เมื่อกองทหารภาคสนามของคุณมีหน่วยรบที่เหลืออยู่น้อยกว่า 60% และถูกล้อมโดยกองทหารศัตรู 5 กองขึ้นไป กองทหารภาคสนามของคุณจะได้รับการต้านทานความเสียหาย 5% นอกจากนี้ กองทหารใดก็ตามที่ได้รับความเสียหายจากการโจมตีสวนกลับจะสูญเสียความเร็วการเคลื่อนพล 20%"
      tr: "Sahra kıtalarının %60 oranından az birimi kalmışsa ve 5+ düşman kıtası tarafından etrafı sarılmışsa sahra kıtaların %5 hasar direnci kazanır. Ayrıca karşı saldırı hasarı verdiği herhangi bir kıta %20 İntikal Hızı kaybeder."
      vi: "Khi đội quân dã chiến của ngài còn ít hơn 60% đơn vị và bị 5+ đội quân kẻ thù bao vây, đội quân dã chiến của ngài nhận 5% kháng sát thương. Ngoài ra, bất kỳ đội quân nào nhận sát thương phản công từ đội quân này sẽ mất 20% Tốc độ hành quân."
      zh_CN: "自身为野战部队时：兵力降至60%以下后，若受到的夹击数不低于5，则额外获得5%的所有伤害抗性，并使受到自身反击伤害的部队行军速度降低20%。"
      zh_TW: "自身為野戰部隊時：兵力降至60%以下後，若受到的夾擊數不低於5，則額外獲得5%的所有傷害抗性，並使受到自身反擊傷害的部隊行軍速度降低20%。"

