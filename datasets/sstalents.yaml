talents:
  1:
    name: "Hostile Terrain"
    description: "Deal 20% more damage in enemy territory."

  2:
    name: "Rank Crusher"
    description: "Your field troops deal 15% more damage when attacking rallied armies or garrison troops."

  3:
    name: "Resolve"
    description: "Take 2.5% less damage."

  4:
    name: "Swift Momentum"
    description: "Deal 10% more normal damage."

  5:
    name: "Double-Edged Sword"
    description: "Deal 15% more damage, but also take 5% more damage."

  6:
    name: "Resounding Strike"
    description: "When your field troops deal skill/smite/combo attack damage, they deal an extra instance of skill/smite/combo attack damage to the hit target troop (Damage Factor 600). Each troop can trigger this effect once every 10 seconds (Cooldown applies to the entire match and does not reset upon exiting battle)."

  7:
    name: "Power Counter"
    description: "Your field troops deal 25% more counterattack damage."

  8:
    name: "War Glow"
    description: "When initiating rallies or garrisons: Both your troop and the target troop will deal 1% more damage to each other after every 10 seconds of combat (up to 100%)."

  9:
    name: "Siege Break"
    description: "When your field troops have less than 60% units remaining and are surrounded by 5+ enemy troops, your field troops gain 5% damage resistance. In addition, any troop they deal counterattack damage to loses 20% March Speed."

  10:
    name: "Whirlwind"
    description: "Gain 15% March Speed."

  11:
    name: "Safe Retreat"
    description: "Defeated troops return to cities 100% faster."

  12:
    name: "Reinvigoration"
    description: "After your field troop exits battle, heal a substantial amount of slightly wounded units in the troop (Healing Factor 1000)."

  13:
    name: "Ranged Shot"
    description: "When using V formation, your field troops can attack while on the move, but have lower hit range."

  14:
    name: "Battle Leverage"
    description: "When your field troops deal combo attack/smite/skill damage, heal slightly wounded units with heal strength equal to 15% of the damage dealt."

  15:
    name: "Delay"
    description: "Each basic attack from your field troops reduces the target troop's March Speed by 10% for 5 seconds. This effect can stack up to 5 times, and stacks can be applied from different sources."

  16:
    name: "Unceasing Strife"
    description: "When your field troops become defeated after having entered battle for more than 10 seconds, they inflict debuffs on nearby enemy troops; debuffed troops take 2% more damage and lose 10% March Speed for 5 seconds. This effect does not stack."

  17:
    name: "Sustainable Combat"
    description: "When your field troops apply a buff or debuff to other troops, they gain a Mighty Shield (Shield Factor 800) that lasts for 5 seconds. Cooldown: 10 seconds."

  18:
    name: "Victory Heal"
    description: "After your field troops defeat another governor's troops (excluding garrison troops), heal slightly wounded units in up to 5 nearby friendly troops (Healing Factor 1200). This effect can trigger once every 10 seconds."

  19:
    name: "Lone Wolf"
    description: "Only applies when attacking non-neutral units: Neither your troop nor your current target can receive temporary normal buffs from other troops."

  20:
    name: "United Might"
    description: "When joining garrisons or rally attacks on a stronghold: Every one of your troops taking part will provide a 1% damage bonus to the captain. This effect can stack up to 5 times."

  21:
    name: "Strategists Convened"
    description: "When launching a rally attack: All governors taking part may dispatch 2 troops to join the rally."

  22:
    name: "Home Turf"
    description: "Take 20% less damage in alliance territory."
