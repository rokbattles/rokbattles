      de: "Bei Verwendung der V-Formation können deine Feldtruppen während der Bewegung angreifen, haben aber eine geringere Trefferreichweite."
      en: "When using V formation, your field troops can attack while on the move, but have lower hit range."
      es: "Al usar la formación en V, tus tropas de campo pueden atacar mientras avanzan, pero tienen menor rango de golpe."
      fr: "Lorsque vous utilisez la formation en V, vos troupes de terrain peuvent attaquer en mouvement, mais ont une portée de tir réduite."
      id: "Saat menggunakan formasi V, pasukan lapanganmu dapat menyerang sambil bergerak, tetapi memiliki range serangan yang lebih rendah."
      it: "Quando usi la formazione a V, le tue truppe da campo possono attaccare mentre sono in movimento, ma hanno un raggio di attacco inferiore."
      ja: "自部隊が野戦部隊の場合：雁行陣を携帯している時、移動しながらの攻撃ができるが、射程が短縮される。"
      ko: "야전 부대 통솔 시: 안행 진형 적용 중일 경우, 이동 중 공격이 가능해지지만, 사거리가 감소한다."
      ms: "Apabila menggunakan Formasi V, trup lapangan anda boleh menyerang semasa bergerak, tetapi mempunyai julat serangan yang lebih rendah."
      pl: "Podczas korzystania z formacji V twoje oddziały polowe mogą atakować w ruchu, ale mają mniejszy zasięg ataku."
      pt: "Ao usar a Formação em V, suas tropas de campo podem atacar enquanto se movem, mas têm menor alcance de acerto."
      ru: "При использовании строя «Буква V» ваши отряды в поле могут атаковать на ходу, но дальность попадания снижается."
      th: "เมื่อใช้รูปขบวนตัววี กองทหารภาคสนามของคุณสามารถโจมตีขณะเคลื่อนที่ได้ แต่จะมีระยะการโจมตีที่ลดลง"
      tr: "V dizilişi kullanırken sahra kıtaların hareket hâlindeyken saldırabilir ancak daha düşük vuruş menziline sahip olur."
      vi: "Khi sử dụng Đội Hình V, đội quân dã chiến của ngài có thể tấn công trong khi di chuyển, nhưng có tầm bắn ngắn hơn."
      zh_CN: "自身为野战部队时：携带雁行阵时，可在移动时攻击，但射程降低。"
      zh_TW: "自身為野戰部隊時：攜帶雁行陣時，可在移動時攻擊，但射程降低。"

  14:
    name:
      ar: "قوة المعركة"
      de: "Kampfesvorteil"
      en: "Battle Leverage"
      es: "Impulso de batalla"
      fr: "Avantage tactique"
      id: "Keunggulan Pertempuran"
      it: "Vantaggio in battaglia"
      ja: "敵を以て資と為す"
      ko: "전리품 노획"
      ms: "Kelebihan Pertempuran"
      pl: "Przewaga bojowa"
      pt: "Vantagem em Batalha"
      ru: "Преимущество в бою"
      th: "ยืมมือพลิกสถานการณ์"
      tr: "Savaş Baskısı"
      vi: "Lợi Thế Chiến Đấu"
      zh_CN: "因敌为资"
      zh_TW: "以敵為資"
    description:
      ar: "عندما تُلحق قواتك الميدانية ضرر هجو مجموعة/ضرر ضربة قاضية/ضرر مهارة، قم بشفاء الوحدات المصابة بجروح طفيفة بقوة شفاء تساوي 15% من الضرر المُلحق."
      de: "Wenn deine Feldtruppen Kombo-Angriff-/Schmettern-/Fähigkeitsschaden verursachen, heile leicht verletzte Einheiten mit einer Heilstärke von 15 % des verursachten Schadens."
      en: "When your field troops deal combo attack/smite/skill damage, heal slightly wounded units with heal strength equal to 15% of the damage dealt."
      es: "Cuando tus tropas de campo infligen daño de ataque combinado/embate/habilidad, sana unidades levemente heridas con fuerza de sanación igual al 15 % del daño infligido."
      fr: "Quand vos troupes de terrain infligent des dégâts d'attaque combinée/concussion/compétence, soigne les blessés légers à hauteur de 15 % des dégâts infligés."
      id: "Ketika pasukan lapanganmu memberikan serangan kombo/hantaman/damage skill, sembuhkan unit yang terluka ringan dengan kekuatan penyembuhan setara dengan 15% dari damage yang diberikan."
      it: "Quando le tue truppe da campo infliggono danni da attacco combinato/percosse/abilità, guarisci unità ferite lievemente con forza di guarigione pari a un 15% dei danni inflitti."
      ja: "自部隊が野戦部隊の場合：連撃、重撃またはスキルダメージを与えた時、自部隊の軽傷兵を治療する。回復量はダメージ量の15%となる。"
      ko: "야전 부대 통솔 시: 연격/강타/스킬 피해를 입힐 시, 통솔한 부대에 있는 대량의 경상 유닛을 치료하며, 치료량은 해당 피해의 15%에 해당된다."
      ms: "Apabila trup lapangan anda menyebabkan kerosakan serangan kombo/pukul/kemahiran, akan menyembuhkan unit tercedera ringan dengan kekuatan penyembuhan bersamaan 15% daripada kerosakan yang disebabkan."
      pl: "Gdy twoje oddziały w polu zadają obrażenia od ataku kombo/rąbnięcia/umiejętności, leczą lekko ranne jednostki z siłą leczenia równą 15% zadanych obrażeń."
      pt: "Quando suas tropas de campo causam dano de ataque em combo/concussão/habilidade, cura unidades levemente feridas com força de cura igual a 15% do dano causado."
      ru: "Когда ваши отряды в поле наносят урон комбо-атакой/навыками или ударный урон, исцеляются легко раненные воины с силой исцеления, равной 15% от нанесенного урона."
      th: "เมื่อกองทหารภาคสนามของคุณสร้างความเสียหายจากโจมตีคอมโบ/ทุบ/ทักษะ รักษาหน่วยรบที่บาดเจ็บเล็กน้อยด้วยความแข็งแกร่งในการรักษาเท่ากับ 15% ของความเสียหายที่ทำได้"
      tr: "Sahra kıtaların kombo saldırı/darbe/beceri hasarı verdiğinde verilen hasarın %15 kadarına eşit iyileştirme kuvvetiyle hafif yaralı birimleri iyileştirir."
      vi: "Khi đội quân dã chiến của ngài gây sát thương tấn công combo/trừng phạt/kỹ năng, chữa lành đơn vị bị thương nhẹ với sức chữa lành bằng 15% sát thương gây ra."
      zh_CN: "自身为野战部队时：造成连击、重击或技能伤害时，治疗恢复自身部队中的轻伤单位，治疗量为该次伤害值的15%。"
      zh_TW: "自身為野戰部隊時：造成連擊、重擊或技能傷害時，治療恢復自身部隊中的輕傷單位，治療量為該次傷害值的15%。"

  15:
    name:
      ar: "التأخير"
      de: "Verzögerung"
      en: "Delay"
      es: "Lentitud"
      fr: "Décalage"
      id: "Penunda"
      it: "Rinvio"
      ja: "鈍足"
      ko: "정체"
      ms: "Penangguhan"
      pl: "Opóźnienie"
      pt: "Atraso"
      ru: "Задержка"
      th: "หน่วงกลยุทธ์"
      tr: "Gecikme"
      vi: "Trì Trệ"
      zh_CN: "迟滞"
      zh_TW: "遲滯"
    description:
      ar: "كل هجوم أساسي من قواتك الميدانية يقلل سرعة مسيرة قوات الهدف بنسبة 10% لمدة 5 من الثواني. يُمكن أن يتكدس هذا التأثير حتى 5 من المرّات، ويمكن تطبيق التكديسات من مصادر مختلفة."
      de: "Jeder Basisangriff deiner Feldtruppen reduziert das Marschtempo der Zieltruppe um 10 % für 5 Sekunden. Dieser Effekt ist bis zu 5-mal stapelbar, und Stapel können von verschiedenen Quellen angewendet werden."
      en: "Each basic attack from your field troops reduces the target troop's March Speed by 10% for 5 seconds. This effect can stack up to 5 times, and stacks can be applied from different sources."
      es: "Cada ataque básico de tus tropas de campo reduce la velocidad de marcha de la tropa objetivo en 10 % durante 5 s. Este efecto se puede acumular hasta 5 veces, y las acumulaciones se pueden aplicar desde diferentes fuentes."
      fr: "Chaque attaque de base de vos troupes de terrain réduit la vitesse de marche de la troupe cible de 10 % pendant 5 s. Effet cumulable 5 fois, et les cumuls peuvent provenir de différentes sources."
      id: "Setiap serangan dasar dari pasukan lapanganmu mengurangi Kecepatan Berjalan pasukan target sebesar 10% selama 5 detik. Efek ini dapat ditumpuk hingga 5 kali, dan tumpukan dapat diterapkan dari sumber yang berbeda."
      it: "Ogni attacco di base delle tue truppe da campo riduce la velocità di marcia della truppa bersaglio di un 10% per 5 s. Questo effetto può essere cumulato fino a 5 volte e i cumuli possono essere applicati da fonti diverse."
      ja: "自部隊が野戦部隊の場合：基礎攻撃を行うと、5秒間、ターゲット部隊の行軍速度を10%減少させる（最大5スタック）。異なる発生源の同効果はスタックできる。"
      ko: "야전 부대 통솔 시: 기본 공격할 때마다 대상 부대의 행군 속도 -10%(5초간 지속, 최대 5스택, 서로 다른 대상이 부여한 동일 효과는 중첩 가능)"
      ms: "Setiap serangan asas daripada trup lapangan anda akan mengurangkan Kelajuan Kawad trup sasaran sebanyak 10% selama 5 saat. Kesan ini boleh bertindan hingga 5 kali dan tindanan boleh diperoleh daripada pelbagai sumber."
      pl: "Każdy zwykły atak twoich oddziałów w polu zmniejsza szybkość marszu docelowego oddziału o 10% na 5 s. Ten efekt może się kumulować do 5 razy, a kumulacje mogą być nakładane z różnych źródeł."
      pt: "Cada ataque básico de suas tropas de campo reduz a Velocidade de Marcha da tropa alvo em 10% por 5 s. Este efeito pode acumular até 5 vezes, e os acúmulos podem ser aplicados de diferentes fontes."
      ru: "Каждая базовая атака ваших отрядов в поле снижает скорость на марше целевого отряда на 10% на 5 сек. Эффект накапливается до 5 р., а накопления могут применяться из разных источников."
      th: "การโจมตีพื้นฐานแต่ละครั้งจากกองทหารภาคสนามของคุณจะลดความเร็วการเคลื่อนพลของกองทหารเป้าหมายลง 10% เป็นเวลา 5 วินาที เอฟเฟ็กต์นี้สามารถสะสมได้สูงสุด 5 ครั้ง และสามารถใช้จำนวนชั้นการสะสมจากแหล่งที่มาต่างๆ ได้"
      tr: "Sahra kıtalarından gelen her temel saldırı, hedef kıtanın İntikal Hızını 5 saniyeliğine %10 azaltır. Bu etki 5 defaya kadar birikebilir ve birikimler farklı kaynaklardan uygulanabilir."
      vi: "Mỗi đòn tấn công cơ bản từ đội quân dã chiến của ngài sẽ giảm 10% Tốc độ hành quân của đội quân mục tiêu trong 5 giây. Hiệu ứng này có thể cộng dồn tối đa 5 lần và có thể được áp dụng từ nhiều nguồn khác nhau."
      zh_CN: "自身为野战部队时：每次基础攻击后，使目标部队的行军速度降低10%，持续5秒，最多叠加5层；不同来源的该效果可叠加。"
      zh_TW: "自身為野戰部隊時：每次基礎攻擊後，使目標部隊的行軍速度降低10%，持續5秒，最多疊加5層。不同來源的該效果可疊加。"

  16:
    name:
      ar: "صراع لا يتوقف"
      de: "Unaufhörlicher Kampf"
      en: "Unceasing Strife"
      es: "Lucha incesante"
      fr: "Lutte sans fin"
      id: "Perselisihan Tanpa Henti"
      it: "Lotta incessante"
      ja: "消えない戦意"
      ko: "끝없는 전의"
      ms: "Persengketaan Tanpa Henti"
      pl: "Nieprzerwany konflikt"
      pt: "Conflito Incessante"
      ru: "Нескончаемая борьба"
      th: "จิตสู้รบไม่ดับสูญ"
      tr: "Ebedî Çatışma"
      vi: "Xung Đột Triền Miên"
      zh_CN: "战意不息"
      zh_TW: "戰意不息"
    description:
      ar: "عندما تُهزم قواتك الميدانية بعد دخولها المعركة بأكثر من 10 من الثواني، فإنها تُلحق آثارًا سلبية بقوات العدو المجاورة؛ وتتلقى القوات المتأثرة بالآثار السلبية ضررًا إضافيًا بنسبة 2% وتفقد 10% من سرعة المسيرة لمدة 5 من الثواني. لا يمكن تكديس هذا التأثير."
      de: "Werden deine Feldtruppen besiegt, nachdem sie mehr als 10 Sekunden im Kampf waren, fügen sie nahen gegnerischen Truppen Debuffs zu; Truppen mit Debuff erleiden 2 % mehr Schaden und verlieren 10 % Marschtempo für 5 Sekunden. Dieser Effekt ist nicht stapelbar."
      en: "When your field troops become defeated after having entered battle for more than 10 seconds, they inflict debuffs on nearby enemy troops; debuffed troops take 2% more damage and lose 10% March Speed for 5 seconds. This effect does not stack."
      es: "Cuando tus tropas de campo son derrotadas después de haber ingresado a la batalla durante más de 10 s, infligen debilitamientos a las tropas enemigas cercanas; las tropas debilitadas reciben 2 % más daño y pierden 10 % de velocidad de marcha durante 5 s. Este efecto no se acumula."
      fr: "Si vos troupes de terrain sont vaincues plus de 10 s après avoir rejoint la bataille, elles infligent des malus aux troupes ennemies à proximité ; les troupes affectées par un malus subissent 2 % de dégâts supplémentaires et perdent 10 % de vitesse de marche pendant 5 s. Effet non cumulable."
      id: "Ketika pasukan lapanganmu dikalahkan setelah memasuki pertempuran selama lebih dari 10 detik, mereka memberikan debuff pada pasukan musuh di sekitar; pasukan yang terkena debuff menerima damage 2% lebih tinggi dan kehilangan 10% Kecepatan Berjalan selama 5 detik. Efek ini tidak dapat ditumpuk."
      it: "Quando le tue truppe da campo vengono sconfitte dopo più di 10 s da quando sono entrate in battaglia, infliggono debuff alle truppe nemiche nelle vicinanze; le truppe con debuff subiscono un 2% danni in più e perdono un 10% di velocità di marcia per 5 s. Questo effetto non è cumulabile."
      ja: "自部隊が野戦部隊の場合：自軍部隊が戦闘に入って10秒以上経過してから撃破されると、5秒間、周囲の敵部隊の受ける全てのダメージを2%上昇させ、行軍速度を10%減少させる。この効果はスタックできない。"
      ko: "야전 부대 통솔 시: 아군 부대가 10초 이상 전투 후 처치되면, 원형 범위 내 적군 부대가 받는 모든 피해 +2%, 해당 부대의 행군 속도 -10% (5초간 지속, 중첩 불가)"
      ms: "Apabila trup lapangan anda dikalahkan selepas memasuki pertempuran selama lebih daripada 10 saat, mereka mengenakan debuf terhadap trup musuh yang berhampiran; trup yang terkena debuf akan menerima 2% lebih banyak kerosakan dan kehilangan 10% Kelajuan Kawad selama 5 saat. Kesan ini tidak bertindan."
      pl: "Gdy twoje oddziały w polu zostaną pokonane więcej niż 10 s po przystąpieniu do bitwy, nakładają osłabienia na pobliskie oddziały przeciwnika. Osłabione oddziały otrzymują o 2% więcej obrażeń i tracą 10% szybkości marszu na 5 s. Efekt nie kumuluje się."
      pt: "Quando suas tropas de campo são derrotadas após terem entrado na batalha por mais de 10 s, elas infligem penalidades em tropas inimigas próximas; tropas com penalidade recebem 2% a mais de dano e perdem 10% de Velocidade de Marcha por 5 s. Este efeito não acumula."
      ru: "Когда ваши отряды в поле терпят поражение после того, как провели в битве более 10 сек., они накладывают ослабления на вражеские отряды поблизости; ослабленные отряды получают на 2% больше урона и теряют 10% скорости на марше на 5 сек. Эффект не накапливается."
      th: "เมื่อกองทหารภาคสนามของคุณพ่ายแพ้หลังเข้าสู่การต่อสู้เกิน 10 วินาที พวกเขาจะสร้างดีบัฟให้กับกองทหารศัตรูใกล้เคียง กองทหารที่ได้รับดีบัฟจะได้รับความเสียหายเพิ่มขึ้น 2% และสูญเสียความเร็วการเคลื่อนพล 10% เป็นเวลา 5 วินาที เอฟเฟ็กต์นี้จะไม่สะสม"
      tr: "Sahra kıtaların savaşa girmenin ardından 10 saniyeden uzun süre sonra yenilirse yakındaki düşman kıtalarına negatif güç uygular. Negatif güç alan kıtalar %2 daha çok hasar alır ve 5 saniyeliğine %10 İntikal Hızı kaybeder. Bu etki birikmez."
      vi: "Khi đội quân dã chiến của ngài bị đánh bại sau khi vào trận đấu hơn 10 giây, họ sẽ gây bùa hại lên đội quân kẻ thù trong phạm vi hình tròn; đội quân dính bùa hại nhận thêm 2% sát thương và mất 10% Tốc độ hành quân trong 5 giây. Hiệu ứng này không cộng dồn."
      zh_CN: "自身为野战部队时：己方部队持续战斗超过10秒并被击败后，对圆形范围内的敌方部队施加减益效果，使其受到的所有伤害提升2%，行军速度降低10%，持续5秒。该效果不可叠加。"
      zh_TW: "自身作為野戰部隊時：己方部隊持續戰鬥超過10秒並被擊敗後，對圓形範圍內的敵方部隊施加減益效果，使其受到的所有傷害提升2%，行軍速度降低10%，持續5秒。該效果不可疊加。"

  17:
    name:
      ar: "القتال المستدام"
      de: "Ausdauernder Kampf"
      en: "Sustainable Combat"
      es: "Combate sostenible"
      fr: "Combat d'endurance"
      id: "Pertempuran Berkelanjutan"
      it: "Combattimento sostenibile"
      ja: "機略堅固"
      ko: "전략적 방어"
      ms: "Pertempuran Berterusan"
      pl: "Wytrwała walka"
      pt: "Combate Sustentável"
      ru: "Устойчивость в бою"
      th: "ตั้งรับยั่งยืน"
      tr: "Sürdürülebilir Çarpışma"
      vi: "Chiến Đấu Bền Vững"
      zh_CN: "运筹自固"
      zh_TW: "運籌自固"
    description:
      ar: "عندما تطبق قواتك الميدانية تعزيزًا أو أثرًا سلبيًا على قوات أخرى، فإنها تحصل على الدرع الهائل (معامل الدرع 800) يستمر لمدة 5 من الثواني. وقت التهدئة: 10 من الثواني."
      de: "Wenn deine Feldtruppen einen Buff oder Debuff auf andere Truppen anwenden, erhalten sie einen Mächtigen Schild (Schildfaktor 800), der 5 Sekunden anhält. Abklingzeit: 10 Sekunden."
      en: "When your field troops apply a buff or debuff to other troops, they gain a Mighty Shield (Shield Factor 800) that lasts for 5 seconds. Cooldown: 10 seconds."
      es: "Cuando tus tropas de campo aplican una bonificación o debilitamiento a otras tropas, obtienen un Escudo potente (factor de escudo 800) que dura 5 s. Enfriamiento: 10 s."
      fr: "Quand vos troupes de terrain appliquent un bonus ou un malus à d'autres troupes, elles gagnent un bouclier de force (facteur de bouclier 800) qui dure 5 s. Recharge : 10 s."
      id: "Ketika pasukan lapanganmu memberikan buff atau debuff pada pasukan lain, mereka mendapatkan Perisai Kuat (Faktor Perisai 800) yang berlangsung selama 5 detik. Cooldown: 10 detik."
      it: "Quando le tue truppe da campo applicano un buff o debuff ad altre truppe, ottengono uno scudo possente (fattore scudo 800) che dura per 5 s. Tempo di ricarica: 10 s."
      ja: "自部隊が野戦部隊の場合：他の部隊にバフまたはデバフ効果を付与した時、5秒間、自部隊に強化シールド（ダメージ係数800）を付与する。クールタイム：10秒。"
      ko: "야전 부대 통솔 시: 다른 부대에 버프/디버프 효과를 부여하면, 자신은 5초간 강력한 방패(계수: 800)를 획득한다. 쿨타임: 10초"
      ms: "Apabila trup lapangan anda mengenakan buf atau debuf terhadap trup lain, mereka memperoleh Perisai Perkasa (Faktor Perisai 800) yang bertahan selama 5 saat. Bertenang: 10 saat."
      pl: "Gdy twoje oddziały w polu nakładają wzmocnienie lub osłabienie na inne oddziały, zyskują potężną tarczę (współczynnik tarczy: 800), która trwa 5 s. Czas odnowienia: 10 s."
      pt: "Quando suas tropas de campo aplicam um buff ou penalidade a outras tropas, elas ganham um Escudo Poderoso (Fator de Escudo: 800) que dura por 5 s. Tempo de espera: 10 s."
      ru: "Когда ваши отряды в поле применяют усиление или ослабление к другим отрядам, они получают могучий щит (множитель щита: 800), который действует 5 сек. Перезарядка: 10 сек."
      th: "เมื่อกองทหารภาคสนามของคุณใช้บัฟหรือดีบัฟกับกองทหารอื่น พวกเขาจะได้รับโล่ทรงพลัง (ตัวคูณโล่ 800) ที่คงอยู่เป็นเวลา 5 วินาที คูลดาวน์: 10 วินาที"
      tr: "Sahra kıtaların, diğer kıtalara güç veya negatif güç uyguladığında 5 saniye süren bir Güçlü Kalkan (Kalkan Faktörü 800) kazanır. Bekleme süresi: 10 saniye."
      vi: "Khi đội quân dã chiến của ngài gây bùa lợi hoặc bùa hại lên đội quân khác, họ sẽ nhận Lá Chắn Hùng Mạnh (Hệ số lá chắn 800) kéo dài 5 giây. Hồi chiêu: 10 giây."
      zh_CN: "自身为野战部队时：对其他部队施加增益或减益效果时，自身获得一个系数为800的强效护盾，持续5秒，冷却时间10秒。"
      zh_TW: "自身為野戰部隊時：對其他部隊施加增益或減益效果時，自身獲得一個係數為800的強效護盾，持續5秒，冷卻時間10秒。"

  18:
    name:
      ar: "شفاء المنتصرين"
      de: "Siegesheilung"
      en: "Victory Heal"
      es: "Sanación victoriosa"
      fr: "Soins de victoire"
      id: "Penyembuhan Kemenangan"
      it: "Guarigione della vittoria"
      ja: "凱旋の癒やし"
      ko: "개선의 치유"
      ms: "Penyembuhan Kemenangan"
      pl: "Uleczenie zwycięstwa"
      pt: "Cura da Vitória"
      ru: "Победное исцеление"
      th: "การเยียวยาแห่งชัยชนะ"
      tr: "Zafer Şifası"
      vi: "Phục Hồi Thắng Lợi"
      zh_CN: "凯旋之愈"
      zh_TW: "凱旋之愈"
    description:
      ar: "بعد أن تهزم قواتك الميدانية قوات حاكم آخر (باستثناء قوات الحامية)، قم بشفاء الوحدات المصابة بجروح طفيفة في ما يصل إلى 5 من القوات الصديقة المجاورة (معامل الشفاء 1200). يمكن تفعيل هذا التأثير مرة واحدة كل 10 من الثواني."
      de: "Nachdem deine Feldtruppen die Truppen eines anderen Statthalters besiegt haben (ausgenommen Garnisonstruppen), heile leicht verletzte Einheiten in bis zu 5 nahen befreundeten Truppen (Heilungsfaktor 1200). Dieser Effekt kann alle 10 Sekunden einmal ausgelöst werden."
      en: "After your field troops defeat another governor's troops (excluding garrison troops), heal slightly wounded units in up to 5 nearby friendly troops (Healing Factor 1200). This effect can trigger once every 10 seconds."
      es: "Después de que tus tropas de campo derroten las tropas de otro gobernador (excluyendo tropas de guarnición), sana unidades levemente heridas en hasta 5 tropas amigas cercanas (factor de sanación 1200). Este efecto se puede activar una vez cada 10 s."
      fr: "Quand vos troupes de terrain battent les troupes d'un autre gouverneur (à l'exclusion des troupes de garnison), soigne les blessés légers de jusqu'à 5 troupes amies à proximité (facteur de soin 1200). Cet effet peut se déclencher une fois toutes les 10 s."
      id: "Setelah pasukan lapanganmu mengalahkan pasukan gubernur lain (tidak termasuk pasukan garnisun), sembuhkan unit yang terluka ringan pada maksimum 5 pasukan teman di sekitar (Faktor Penyembuhan 1200). Efek ini dapat dipicu sekali setiap 10 detik."
      it: "Dopo che le tue truppe da campo sconfiggono le truppe di un altro governatore (escluse le truppe di guarnigione), guarisci fino a 5 truppe amiche ferite lievemente nelle vicinanze (fattore di guarigione 10). Questo effetto può attivarsi una volta ogni 1200 s."
      ja: "自部隊が野戦部隊の場合：他の総督の部隊を撃破（防衛部隊を除く）すると、周囲の最大5部隊の味方野戦部隊を治療（治療係数1200）する。この効果は10秒に1回のみ発動可能。"
      ko: "야전 부대 통솔 시: 다른 지도자의 부대(주둔 부대 제외) 1개를 처치한 후, 주변 최대 5개의 아군 야전 부대에 있는 경상 유닛을 치료(치료 계수: 1200)한다. 해당 효과는 10초마다 최대 1회 발동한다."
      ms: "Selepas trup lapangan anda mengalahkan trup gabenor lain (kecuali pasukan garison), akan menyembuhkan unit tercedera ringan kepada hingga 5 trup rakan yang berhampiran (Faktor Penyembuhan 1200). Kesan ini boleh dicetuskan sekali setiap 10 saat."
      pl: "Leczy lekko ranne jednostki w maksymalnie 5 pobliskich zaprzyjaźnionych oddziałach po tym, jak twoje oddziały w polu pokonają oddziały innego zarządcy (z wyłączeniem garnizonu; współczynnik leczenia 1200). Ten efekt może być aktywowany raz na 10 s."
      pt: "Depois que suas tropas de campo derrotam as tropas de outro governador (excluindo tropas de guarnição), cura unidades levemente feridas em até 5 tropas amigas próximas (Fator de Cura: 1200). Este efeito pode ser ativado uma vez a cada 10 s."
      ru: "После того как ваши отряды в поле побеждают войска другого правителя (исключая отряды в гарнизоне), исцеляются легко раненные воины в дружественных отрядах (до 5 отрядов) поблизости (множитель исцеления: 1200). Этот эффект может срабатывать раз в 10 сек."
      th: "หลังจากกองทหารภาคสนามของคุณเอาชนะกองทหารของผู้ว่าการคนอื่น (ไม่รวมกองทหารประจำการ) รักษาหน่วยรบที่บาดเจ็บเล็กน้อยในกองทหารเป็นมิตรใกล้เคียงสูงสุด 5 กอง (ตัวคูณการรักษา 1200) เอฟเฟ็กต์นี้สามารถเปิดใช้งานได้ครั้งละ 10 วินาที"
      tr: "Sahra kıtaların, başka bir valinin kıtalarını yendikten sonra (garnizon kıtaları hariç) yakındaki en fazla 5 dost kıtadaki hafif yaralı birimleri iyileştirir (İyileştirme Faktörü 1200). Bu etki her 10 saniyede bir tetiklenebilir."
      vi: "Sau khi đội quân dã chiến của ngài đánh bại đội quân của thống đốc khác (không bao gồm đội quân đồn trú), chữa lành đơn vị bị thương nhẹ trong tối đa 5 đội quân của ngài trong phạm vi hình tròn (Hệ số chữa lành 1200). Hiệu ứng này có thể kích hoạt một lần mỗi 10 giây."
      zh_CN: "自身为野战部队时：击败一支其他执政官的部队（驻防部队除外）后，治疗恢复周围最多5支己方野战部队中的轻伤单位（治疗系数1200）。每10秒最多触发一次。"
      zh_TW: "自身為野戰部隊時：擊敗一支其他執政官的部隊（駐防部隊除外）後，治療恢復周圍最多5支己方野戰部隊中的輕傷單位（治療係數1200）。每10秒最多觸發一次。"

  19:
    name:
      ar: "المقاتل الوحيد"
      de: "Einsamer Wolf"
      en: "Lone Wolf"
      es: "Lobo solitario"
      fr: "Loup solitaire"
      id: "Serigala Penyendiri"
      it: "Lupo solitario"
      ja: "孤軍奮闘"
      ko: "일기토"
      ms: "Serigala Solo"
      pl: "Samotny wilk"
      pt: "Lobo Solitário"
      ru: "Одинокий волк"
      th: "หมาป่าเดียวดาย"
      tr: "Yalnız Kurt"
      vi: "Sói Đơn Độc"
      zh_CN: "独力争锋"
      zh_TW: "獨力爭鋒"
    description:
      ar: "ينطبق فقط عند مهاجمة الوحدات غير المحايدة: لا يمكن لقواتك ولا لهدفك الحالي تلقي تأثيرات إيجابية عادية مؤقتة من قوات أخرى."
      de: "Gilt nur beim Angriff auf nicht-neutrale Einheiten: Weder deine Truppe noch dein aktuelles Ziel können temporäre normale Buffs von anderen Truppen erhalten."
      en: "Only applies when attacking non-neutral units: Neither your troop nor your current target can receive temporary normal buffs from other troops."
      es: "Solo se aplica al atacar unidades no neutrales: ni tu tropa ni tu objetivo actual pueden recibir bonificaciones normales temporales de otras tropas."
      fr: "S'applique uniquement lors d'attaques contre des unités non neutres : ni votre troupe ni votre cible actuelle ne peuvent recevoir de bonus normaux temporaires d'autres troupes."
      id: "Hanya berlaku saat menyerang unit non-netral: Pasukanmu dan target yang sedang diserang tidak bisa menerima buff normal sementara dari pasukan lain."
      it: "Si applica solo quando si attaccano unità non neutrali: né la tua truppa né il tuo bersaglio attuale possono ricevere buff normali temporanei da altre truppe."
      ja: "非中立部隊への攻撃時のみ発動：自部隊とターゲット部隊は、他の部隊から臨時の通常バフ効果を受けられなくなる。"
      ko: "중립이 아닌 유닛 공격 시: 통솔한 부대와 현재 공격 대상은 주변 부대로부터 임시 일반 버프 효과를 받을 수 없다."
      ms: "Hanya terpakai apabila menyerang unit bukan neutral: Trup anda mahupun sasaran semasa anda tidak boleh menerima buf biasa daripada trup lain buat sementara waktu."
      pl: "Dotyczy tylko atakowania jednostek nieneutralnych: Ani Twój oddział, ani obecny cel nie może otrzymać tymczasowych podstawowych wzmocnień od innych oddziałów."
      pt: "Aplica-se apenas ao atacar unidades não neutras: nem sua tropa nem seu alvo atual podem receber buffs normais temporários de outras tropas."
      ru: "Действует только при атаке на не нейтральных воинов: ни ваш отряд, ни ваша текущая цель не могут получать временные обычные усиления от других отрядов."
      th: "ใช้ได้เฉพาะเมื่อโจมตีหน่วยรบที่ไม่เป็นกลางเท่านั้น: ทั้งกองทหารของคุณและเป้าหมายปัจจุบันของคุณจะไม่สามารถรับบัฟปกติชั่วคราวจากกองทหารอื่นได้"
      tr: "Yalnızca tarafsız olmayan birimlere saldırırken geçerlidir: Ne senin kıtan ne de mevcut hedefin diğer kıtalardan geçici normal güç alabilir."
      vi: "Chỉ áp dụng khi tấn công đơn vị không trung lập: Cả đội quân của ngài và mục tiêu hiện tại đều không thể nhận bùa lợi thường tạm thời từ đội quân khác."
      zh_CN: "仅在攻击非中立单位时生效：自身部队与当前攻击目标均无法获得其他部队施加的临时性普通增益效果。"
      zh_TW: "僅在攻擊非中立單位時生效：自身部隊與目前攻擊目標均無法獲得其他部隊施加的臨時性普通增益效果。"

  20:
    name:
      ar: "قوة الاتحاد"
      de: "Vereinte Stärke"
      en: "United Might"
      es: "Poder combinado"
      fr: "Force unie"
      id: "Kekuatan Bersatu"
      it: "Potenza unita"
      ja: "戦友団結"
      ko: "단결의 힘"
      ms: "Kekuatan Bersatu"
      pl: "Siła jedności"
      pt: "Força Unida"
      ru: "Объединенная мощь"
      th: "ผนึกกำลังสหายศึก"
      tr: "Birliğin Kuvveti"
      vi: "Sức Mạnh Đoàn Kết"
      zh_CN: "同袍聚力"
      zh_TW: "同袍聚力"
    description:
      ar: "عند الانضمام إلى حاميات أو هجمات حشد على معقل: كل واحدة من قواتك المشاركة ستوفر 1% من التأثير الإضافي للضرر للقائد. يُمكن أن يتكدس هذا التأثير حتى 5 من المرّات."
      de: "Beim Beitritt zu Garnisonen oder Gemeinschaftsangriffen auf ein Bollwerk: Jede deiner teilnehmenden Truppen gewährt dem Hauptmann einen Schadensbonus von 1 %. Dieser Effekt ist bis zu 5-mal stapelbar."
      en: "When joining garrisons or rally attacks on a stronghold: Every one of your troops taking part will provide a 1% damage bonus to the captain. This effect can stack up to 5 times."
      es: "Al unirse a guarniciones o ataques de congregación en un bastión: cada una de tus tropas participantes otorgará una bonificación de daño del 1 % al capitán. Este efecto se puede acumular hasta 5 veces."
      fr: "Lors de garnisons ou d'attaques groupées sur un bastion : chacune de vos troupes participantes fournit un bonus de dégâts de 1 % au capitaine. Effet cumulable 5 fois."
      id: "Saat bergabung dalam garnisun atau serangan rally terhadap benteng pertahanan: Setiap pasukanmu yang berpartisipasi akan memberikan bonus damage sebesar 1% pada kapten. Efek ini bisa ditumpuk hingga 5 kali."
      it: "Quando si presidia o si attacca in raduno una roccaforte: ogni truppa che vi partecipa fornisce un bonus danni di un 1% al capitano. Questo effetto può essere cumulato fino a 5 volte."
      ja: "拠点への集結攻撃、または拠点防衛を行う場合：率いる各部隊がそれぞれ、隊長にダメージを1%上昇させるバフ効果（最大5スタック）を付与する。"
      ko: "거점에 대해 집결을 개시하거나 거점에 주둔 시: 통솔한 부대 1개당 대장에게 1%의 피해 증가 효과를 제공한다. (최대 5스택 중첩)"
      ms: "Apabila menyertai garison atau serangan rali ke atas kubu: Setiap trup anda yang mengambil bahagian akan memberikan 1% bonus kerosakan kepada kapten. Kesan ini boleh bertindan hingga 5 kali."
      pl: "Podczas dołączania do garnizonów lub zmobilizowanych ataków na twierdzę: Każdy z Twoich oddziałów biorących udział w walce zapewnia kapitanowi premię 1% do obrażeń. Efekt kumuluje się maks. 5 razy."
      pt: "Ao ingressar em guarnições ou realizar ataques de reunião em uma fortaleza: cada uma de suas tropas participantes fornecerá um Bônus de Dano de 1% ao capitão. Este efeito pode acumular até 5 vezes."
      ru: "При присоединении к гарнизону или при совместной атаке на крепость: каждый ваш отряд-участник дает капитану 1% бонуса к урону. Эффект накапливается до 5 р."
      th: "เมื่อเข้าร่วมประจำการหรือระดมทัพโจมตีที่มั่น: กองทหารของคุณทุกกองที่มีส่วนร่วมจะให้โบนัสความเสียหาย 1% กับกัปตัน เอฟเฟ็กต์นี้สามารถสะสมได้สูงสุด 5 ครั้ง"
      tr: "Bir kaleye garnizon kurarken ya da seferberlik saldırısı yaparken: Katılan her kıtan, komutana %1 hasar bonusu sağlar. Bu etki 5 defaya kadar birikebilir."
      vi: "Khi tham gia đồn trú hoặc tập kết tấn công thành trì: Mỗi đội quân tham gia sẽ tăng 1% sát thương cho đội trưởng. Hiệu ứng này có thể cộng dồn tối đa 5 lần."
      zh_CN: "参与对据点发起集结或驻防据点时：自身每支部队为队长提供伤害提升1%的增益效果，该效果最多叠加5层。"
      zh_TW: "參與對據點發起集結或駐防據點時：自身每支部隊為隊長提供傷害提升1%的增益效果，該效果最多疊加5層。"

  21:
    name:
      ar: "اجتماع الإستراتيجيين"
      de: "Versammelte Strategen"
      en: "Strategists Convened"
      es: "Reunión de estrategas"
      fr: "Conseil des stratèges"
      id: "Musyawarah Strategis"
      it: "Riunione strategica"
      ja: "諸軍会合"
      ko: "전군 집결"
      ms: "Perhimpunan Pakar Strategi"
      pl: "Zwołani stratedzy"
      pt: "Reunião de Estrategistas"
      ru: "Совещание стратегов"
      th: "ชุมนุมยอดยุทธการ"
      tr: "Strateji Uzmanı Toplantısı"
      vi: "Chiến Lược Gia Họp Mặt"
      zh_CN: "诸军会师"
      zh_TW: "諸軍會師"
    description:
      ar: "أثناء إطلاق هجوم حشد: يُمكن لجميع الحكام المُشاركين إرسال 2 من القوات للانضمام إلى الحشد."
      de: "Beim Starten eines Gemeinschaftsangriffs dürfen alle teilnehmenden Statthalter 2 Truppen zur Teilnahme entsenden."
      en: "When launching a rally attack: All governors taking part may dispatch 2 troops to join the rally."
      es: "Al lanzar un ataque de congregación: Todos los gobernadores que participen pueden enviar 2 tropas para unirse a la congregación."
      fr: "Quand une attaque groupée est lancée, tous les gouverneurs participants peuvent déployer 2 troupes qui rejoindront le rassemblement."
      id: "Saat meluncurkan serangan rally: Semua gubernur peserta bisa mengerahkan 2 pasukan untuk ikut rally."
      it: "Quando si lancia un attacco di raduno: tutti i governatori partecipanti possono inviare 2 truppe per unirsi al raduno."
      ja: "集結攻撃を発動した場合：集結チームに参加する各総督は、最大2部隊まで集結に派遣できる。"
      ko: "집결 공격 개시 시: 집결 팀 내 각 지도자는 2개의 부대를 파견하여 집결에 합류시킬 수 있다."
      ms: "Apabila melancarkan serangan rali: Semua gabenor yang mengambil bahagian boleh menghantar 2 trup untuk menyertai rali tersebut."
      pl: "Po zainicjowaniu mobilizacji: Wszyscy uczestniczący zarządcy mogą wysłać do niej następującą liczbę oddziałów: 2."
      pt: "Ao lançar um ataque de reunião: todos os governadores participantes podem enviar 2 tropas para participar da reunião."
      ru: "При запуске совместной атаки: все участвующие правители могут отправить на сбор отряды (2)."
      th: "เมื่อเปิดการระดมทัพโจมตี ผู้ว่าการทั้งหมดที่เข้าร่วมอาจส่งกองทหาร 2 กองเพื่อเข้าร่วมการระดมทัพ"
      tr: "Bir seferberlik saldırısı başlatırken: Katılan tüm valiler seferberliğe katılmak için 2 kıta gönderebilir."
      vi: "Khi phát động tấn công tập kết: Tất cả thống đốc tham gia có thể điều động 2 đội quân để tham gia tập kết."
