      zh_TW: "疾撤"
    description:
      ar: "تعود القوات المهزومة إلى المدن بسرعة أكبر بنسبة 100%."
      de: "Besiegte Truppen kehren 100 % schneller in die Städte zurück."
      en: "Defeated troops return to cities 100% faster."
      es: "Las tropas derrotadas regresan a las ciudades 100 % más rápido."
      fr: "Les troupes vaincues retournent aux villes 100 % plus rapidement."
      id: "Pasukan yang kalah kembali ke kota 100% lebih cepat."
      it: "Le truppe sconfitte tornano alle città 100% più velocemente."
      ja: "自部隊が敗退すると、撤退速度が100%上昇する。"
      ko: "패배한 부대의 귀환 속도 +100%"
      ms: "Trup yang dikalahkan kembali ke bandar 100% lebih cepat."
      pl: "Pokonane oddziały powracają do miast 100% szybciej."
      pt: "Tropas derrotadas retornam às cidades 100% mais rápido."
      ru: "Побежденные войска возвращаются в города на 100% быстрее."
      th: "กองทหารที่พ่ายแพ้กลับสู่เมืองเร็วขึ้น 100%"
      tr: "Yenilgiye uğrayan kıtalar, şehirlere %100 daha hızlı döner."
      vi: "Đội quân bị đánh bại quay về thành phố nhanh hơn 100%."
      zh_CN: "部队溃败后，溃退速度提升100%。"
      zh_TW: "部隊潰敗後，潰退速度提升100%。"

  12:
    name:
      ar: "إعادة التنشيط"
      de: "Neue Kraft"
      en: "Reinvigoration"
      es: "Revitalización"
      fr: "Regain de vigueur"
      id: "Penyegaran"
      it: "Rilancio"
      ja: "戦力温存"
      ko: "전열 정비"
      ms: "Pemulihan Semangat"
      pl: "Pokrzepienie"
      pt: "Revitalização"
      ru: "Прилив сил"
      th: "พักทัพฟื้นกำลัง"
      tr: "Yeniden Diriliş"
      vi: "Khôi Phục Sức Mạnh"
      zh_CN: "息战养锐"
      zh_TW: "休養生息"
    description:
      ar: "بعد خروج قواتك الميدانية من المعركة، قم بشفاء كمية كبيرة من الوحدات المصابة بجروح طفيفة في القوات (معامل الشفاء 1000)."
      de: "Nachdem deine Feldtruppen den Kampf verlassen, heile eine beträchtliche Anzahl leicht verletzter Einheiten in der Truppe (Heilungsfaktor 1000)."
      en: "After your field troop exits battle, heal a substantial amount of slightly wounded units in the troop (Healing Factor 1000)."
      es: "Después de que tus tropas de campo salen de la batalla, sana una cantidad sustancial de unidades levemente heridas en la tropa (factor de sanación 1000)."
      fr: "Après que vos troupes de terrain quittent la bataille, soigne une quantité substantielle de blessés légers dans la troupe (facteur de soin 1000)."
      id: "Setelah pasukan lapanganmu keluar dari pertempuran, sembuhkan sejumlah besar unit yang terluka ringan dalam pasukan (Faktor Penyembuhan 1000)."
      it: "Dopo che le tue truppe da campo escono dalla battaglia, guarisci una quantità sostanziale di unità ferite lievemente nella truppa (fattore di guarigione 1000)."
      ja: "自部隊が野戦部隊の場合：戦闘から離脱すると、自部隊の軽傷兵を大量に治療（治療係数1000）する。"
      ko: "야전 부대 통솔 시: 전투 이탈 후, 통솔 부대의 경상 유닛을 대량 치료한다. (치료 계수 1000)"
      ms: "Selepas trup lapangan anda keluar daripada pertempuran, akan menyembuhkan sejumlah besar unit tercedera ringan dalam trup tersebut (Faktor Penyembuhan 1000)."
      pl: "Leczy znaczną liczbę lekko rannych jednostek w oddziale po tym, jak twoje oddziały w polu opuszczą bitwę (współczynnik leczenia: 1000)."
      pt: "Depois que suas tropas de campo saem da batalha, cura uma quantidade substancial de unidades levemente feridas na tropa (Fator de Cura: 1000)."
      ru: "После того как ваши отряды в поле выходят из битвы, исцеляется значительное количество легко раненных воинов в отряде (множитель исцеления: 1000)."
      th: "หลังจากกองทหารภาคสนามของคุณออกจากการต่อสู้ รักษาหน่วยรบที่บาดเจ็บเล็กน้อยในกองทหารจำนวนมาก (ตัวคูณการรักษา 1000)"
      tr: "Sahra kıtan savaştan çıktıktan sonra kıtadaki önemli miktarda hafif yaralı birimi iyileştirir (İyileştirme Faktörü 1000)."
      vi: "Sau khi đội quân dã chiến của ngài rời trận đấu, chữa lành một lượng lớn đơn vị bị thương nhẹ trong đội quân (Hệ số chữa lành 1000)."
      zh_CN: "自身为野战部队时：脱离战斗后，治疗恢复自身部队中大量的轻伤单位（治疗系数1000）。"
      zh_TW: "自身為野戰部隊時：脫離戰鬥後，治療恢復自身部隊中大量的輕傷單位（治療係數1000）。"

