  22:
    name:
      ar: "الخبير اللوجستي"
      de: "Logistikgenie"
      en: "Logistics Whiz"
      es: "As de la logística"
      fr: "Génie logistique"
      id: "Ahli Logistik"
      it: "Mago logistico"
