  11:
    name:
      ar: "دماء البيرسيركي"
      de: "Berserker-Blut"
      en: "Berserker Blood"
      es: "Sangre berserker"
      fr: "Sang de berserker"
      id: "Darah Berserker"
      it: "Sangue dei berserker"
      ja: "裸衣血戦"
      ko: "맨몸의 혈전"
      ms: "Darah Berserker"
      pl: "Krew berserka"
      pt: "Lâmina Berserker"
      ru: "Пыл берсерка"
      th: "เลือดเบอร์เซอร์เกอร์"
      tr: "Vahşi Savaşçı Kanı"
      vi: "Máu Điên"
      zh_CN: "裸衣血战"
      zh_TW: "裸衣血戰"
    description:
      ar: "تتسبب قواتك في ضرر إضافي بنسبة 5%، لكنها تتلقى ضررًا أكبر بنسبة 3%."
      de: "Deine Truppen verursachen 5 % mehr Schaden, aber sie erleiden auch 3 % mehr Schaden."
      en: "Your troops deal 5% more damage, but they also take 3% more damage."
      es: "Tus tropas provocan un 5 % más de daño, pero también sufren un 3 % más de daño."
      fr: "Vos troupes infligent 5 % de dégâts en plus, mais subissent 3 % de dégâts en plus."
      id: "Pasukanmu memberikan damage 5% lebih besar, tetapi mereka juga menerima damage 3% lebih banyak."
      it: "Le tue truppe infliggono un 5% di danni in più, ma subiscono anche un 3% di danni in più."
      ja: "与える全てのダメージが5%上昇し、受けるダメージが3%上昇する。"
      ko: "입히는 모든 피해가 5% 증가하고, 받는 모든 피해가 3% 증가한다."
      ms: "Trup anda menyebabkan 5% lebih kerosakan, tetapi mereka juga menerima 3% lebih kerosakan."
      pl: "Twoje oddziały zadają o 5% więcej obrażeń, ale i otrzymują o 3% więcej obrażeń."
      pt: "Suas tropas causam 5% a mais de dano, mas também sofrem 3% a mais de dano."
      ru: "Ваши войска наносят на 5% больше урона, но и получают на 3% больше урона."
      th: "กองทหารของคุณจะสร้างความเสียหายเพิ่มขึ้น 5% แต่จะได้รับความเสียหายเพิ่มขึ้น 3% เช่นกัน"
      tr: "Kıtaların %5 daha fazla hasar verir ancak %3 daha fazla hasar alır."
      vi: "Đội quân của ngài gây thêm 5% sát thương, nhưng cũng sẽ chịu thêm 3% sát thương."
      zh_CN: "造成的所有伤害提升5%，受到的所有伤害提升3%。"
      zh_TW: "造成的所有傷害提升5%，受到的所有傷害也提升3%。"

  12:
    name:
      ar: "ساحق النمل"
      de: "Ameisenzerstörer"
      en: "Ant Crusher"
      es: "Aplastahormigas"
      fr: "Écraseur de fourmis"
      id: "Penghancur Semut"
      it: "Schiacciatore di formiche"
      ja: "圧倒的な勢い"
      ko: "압도적 기세"
      ms: "Penghancur Semut"
      pl: "Deptanie mrówek"
      pt: "Esmagador de formigas"
      ru: "Растоптать букашек"
      th: "เครื่องบดขยี้"
      tr: "Karınca Ezer"
      vi: "Máy Nghiền Kiến"
      zh_CN: "碾压之势"
      zh_TW: "碾壓之勢"
    description:
      ar: "عندما تخوض إحدى القوات الميدانية معركة ضد القوات الميدانية لعدو عدد وحداته أقل بنسبة 15% من عدد وحدات قواتك، ستُلحِق قواتك ضررًا أكبر بنسبة 15% بقوات العدو."
      de: "Immer wenn eine deiner Feldtruppen gegen eine feindliche Feldtruppe kämpft, deren Einheitenzahl weniger als 15 % der Einheitenzahl deiner Truppe beträgt, fügt deine Truppe ihr 15 % mehr Schaden zu."
      en: "Whenever one of your field troops battles an enemy field troop whose unit count is less than 15% of your troop's unit count, your troop deals 15% more damage to it."
      es: "Cuando una de tus tropas de campo se enfrenta a una tropa de campo enemiga cuya cantidad de unidades es menor del 15 % de tus unidades de tropa, tu tropa le provoca un 15 % más de daño."
      fr: "Chaque fois qu'une de vos troupes de terrain combat une troupe de terrain ennemie dont le nombre d'unités est inférieur à 15 % du nombre d'unités de votre troupe,cette dernière lui inflige 15 % de dégâts supplémentaires."
      id: "Setiap kali salah satu pasukan lapangan bertempur dengan pasukan lapangan musuh yang jumlah unitnya kurang dari 15% dari jumlah unit pasukanmu, maka pasukanmu akan memberikan damage 15% lebih banyak kepada musuh tersebut."
      it: "Ogni volta che una delle tue truppe da campo combatte contro una truppa da campo nemica, il cui numero di unità è inferiore a un 15% del numero di unità della tua truppa, la tua truppa infligge un 15% di danni in più."
      ja: "ターゲットの野戦部隊の現在の兵力が自部隊の兵力の15%を下回った場合、ターゲット部隊に対する全てのダメージが15%上昇する。（自身が集結防衛部隊の場合は無効）"
      ko: "목표 야전 부대의 현재 병력이 자신의 부대 현재 병력의 15% 보다 적을 경우, 해당 목표에 입히는 모든 피해가 15% 증가한다(자신이 집결 주둔 부대일 경우 적용되지 않음)."
      ms: "Apabila salah satu trup lapangan anda bertempur dengan trup lapangan musuh yang jumlah unitnya kurang daripada 15% daripada jumlah unit trup anda sendiri, trup anda akan menyebabkan 15% lebih banyak kerosakan kepada trup musuh."
      pl: "Gdy jeden z twoich oddziałów w polu walczy z wrogim oddziałem w polu, którego liczba jednostek wynosi mniej niż 15% twojego oddziału, przeciwnik otrzymuje 15% więcej obrażeń."
      pt: "Sempre que uma de suas tropas de campo batalhar contra uma tropa de campo inimiga cuja contagem de unidades seja menor que 15% da contagem de unidades da sua tropa, sua tropa causará 15% mais dano a ela."
      ru: "Когда один из ваших отрядов в поле вступает в битву с вражеским отрядом в поле, чье количество воинов меньше 15% от количества воинов вашего отряда, ваш отряд наносит на 15% больше урона."
      th: "เมื่อใดก็ตามที่กองทหารภาคสนามของคุณต่อสู้กับกองทหารภาคสนามของศัตรูที่มีจำนวนหน่วยรบน้อยกว่า 15% ของกองทหารคุณ กองทหารของคุณจะสร้างความเสียหายเพิ่มขึ้น 15% ต่อศัตรู"
      tr: "Sahra kıtalarından biri, birim sayısı senin kıtanın birim sayısının %15 miktarından az olan bir düşman sahra kıtasıyla savaştığında kıtan, düşmana %15 daha fazla hasar verir."
      vi: "Bất cứ khi nào một trong các đội quân dã chiến của bạn giao chiến với một đội quân dã chiến của kẻ thù có số lượng đơn vị ít hơn 15% so với số lượng đơn vị của đội quân bạn, đội quân của bạn sẽ gây thêm 15% sát thương cho kẻ thù đó."
      zh_CN: "若目标野战部队的当前兵力低于自身部队当前兵力的15%，则对其造成的所有伤害提升15%。（自身是集结驻防部队时不生效）"
      zh_TW: "若目標野戰部隊的目前兵力低於自身部隊目前兵力的15%，則對其造成的所有傷害提升15%。（自身是集結駐防部隊時不生效）"

  13:
    name:
      ar: "حتى أسقط"
      de: "Bis ich falle"
      en: "Till I Fall"
      es: "Hasta el final"
      fr: "Jusqu'à ce que je tombe"
      id: "Sampai Aku Jatuh"
      it: "Finché non cado"
      ja: "決死の戦い"
      ko: "혈전"
      ms: "Sehingga Aku Tewas"
      pl: "Aż do upadłego"
      pt: "Até cair"
      ru: "До последнего вздоха"
      th: "จนกว่าจะจบสิ้น"
      tr: "Yenilene Kadar"
      vi: "Cho Đến Khi Ta Gục Ngã"
      zh_CN: "血战到底"
      zh_TW: "血戰到底"
    description:
      ar: "تصبح مكافأة الهجوم من الخدعة العسكرية سافك للدماء:\nمقابل كل 3000000 من القوة، تحصل قواتك الميدانية على مكافأة 3% للهجوم (حتى 30%)."
      de: "Der Angriff-Bonus des Blutgehärtet-Strategems wird zu:\nFür jeweils 3000000 Energie erhalten deine Feldtruppen einen Bonus von 3 % auf Angriff (bis zu 30 %)."
      en: "The Attack bonus from the Blood-Tempered Stratagem becomes:\nFor every 3000000 power, your field troops gain a 3% bonus to Attack (up to 30%)."
      es: "La bonificación de ataque de la estratagema Impulso de sangre se convierte en:\nPor cada 3000000 de poder, tus tropas de campo obtienen una bonificación de 3 % de ataque (hasta un 30 %)."
      fr: "Le bonus d'attaque du stratagème Forgé dans le sang devient :\nTous les 3000000 de puissance, vos troupes de terrain gagnent un bonus d'attaque de 3 % (jusqu'à 30 %)."
      id: "Bonus Serangan dari Stratagem Pemarah menjadi:\nUntuk setiap 3000000 power, pasukan lapanganmu mendapatkan tambahan 3% untuk Serangan (hingga 30%)."
      it: "Il bonus attacco dello stratagemma Temprato dal sangue diventa:\nPer ogni 3000000 di potenza, le tue truppe da campo ottengono un bonus di 3% all'attacco (fino a 30%)."
      ja: "悪戦苦闘による攻撃力上昇効果が以下に変化する：\n重傷戦力が3000000に達するごとに、攻撃力が3%上昇する、上限は30%。"
      ko: "피의 분투로 제공하는 공격력 증가 효과가 다음과 같이 변경된다.\n3000000 전투력에 해당하는 중상 유닛이 발생할 때마다 공격력이 3%씩, 최대 30% 증가한다."
      ms: "Bonus Serangan daripada Taktik Ditempa Dengan Darah menjadi:\nBagi setiap 3000000 kuasa, trup lapangan anda memperoleh bonus 3% untuk Serangan (sehingga 30%)."
      pl: "Premia do ataku z manewru Zahartowanie krwią staje się:\nZa każdą wielokrotność 3000000 pkt siły twoje oddziały w polu zyskują premię 3% do ataku (maksymalnie 30%)."
      pt: "O bônus de ataque do estratagema Têmpera de sangue se torna:\nPara cada 3000000 de poder, suas tropas de campo ganham um bônus de 3% de ataque (até 30%)."
      ru: "Бонус к атаке от стратагемы Закалка кровью становится:\nЗа каждые 3000000 ед. мощи ваши отряды в поле получают бонус 3% к атаке (до 30%)."
      th: "โบนัสพลังโจมตีจากกลอุบายโลหิตเดือดดาลจะกลายเป็น:\nทุก 3000000 อำนาจ กองทหารภาคสนามของคุณจะได้รับโบนัสพลังโจมตีเพิ่มขึ้น 3% (สูงสุด 30%)"
      tr: "Kan Dirençli Stratejisinden gelen Saldırı bonusu:\nHer 3000000 güç için sahra kıtaların %3 Saldırı bonusu kazanır (en fazla %30)."
      vi: "Tăng tấn công từ Chiến Lược Máu Nóng trở thành:\nCứ mỗi 3000000 sức mạnh, đội quân dã chiến của bạn nhận được tăng 3% tấn công (tối đa 30%)."
      zh_CN: "浴血奋战造成的攻击力提升效果变为：\n每达到3000000重伤战力，提升3%的攻击力，提升上限为30%。"
      zh_TW: "浴血奮戰造成的攻擊力提升效果變為：\n每達到3000000重傷戰力，提升3%的攻擊力，提升上限為30%。"

  14:
    name:
      ar: "اقضِ عليهم"
      de: "Rennt sie nieder"
      en: "Run Them Down"
      es: "Aplástalos"
      fr: "Écrasez-les"
      id: "Hancurkan Mereka"
      it: "Scovateli"
      ja: "追奔逐北"
      ko: "쉼없는 추격"
      ms: "Buru Mereka"
      pl: "Przytłoczenie"
      pt: "Persiga-os"
      ru: "Добивание разбитых"
      th: "วิ่งไล่ล่า"
      tr: "Onları Ez Geç"
      vi: "Nghiền Nát Chúng"
      zh_CN: "追亡逐北"
      zh_TW: "追亡逐北"
    description:
      ar: "يصبح ضرر الجروح الشديدة الإضافي من الخدعة العسكرية الإبادة كما يلي:\n- إذا كان معدل نقاط القتل النهائية على الأقل 200% لصالحك، فستعاني قوات العدو من جروح شديدة إضافية بنسبة 3% في نهاية المعركة.\n- إذا كان معدل نقاط القتل النهائية على الأقل 300% لصالحك، فستزداد الجروح الشديدة الإضافية إلى 6%."
      de: "Der Bonus für schwere Wunden vom Strategem Dezimierung wird wie folgt:\n- Wenn das endgültige Verhältnis der Kill-Punkte mindestens 200 % zu deinen Gunsten beträgt, erleiden die gegnerischen Truppen am Ende des Kampfes 3 % zusätzliche schwere Wunden.\n- Wenn das endgültige Verhältnis der Kill-Punkte mindestens 300 % zu deinen Gunsten beträgt, erhöhen sich die zusätzlichen schweren Wunden auf 6 %."
      en: "The severe wound bonus from the Decimation Stratagem becomes:\n- If the battle's final kill point ratio is at least 200% in your favor, the enemy troop will suffer 3% extra severe wounds at the end of the battle.\n- If the final kill point ratio is at least 300% in your favor, the extra severe wounds will be increased to 6%."
      es: "La bonificación de heridas severas de la Aniquilación estratagema se convierte en:\n- Si la proporción final de puntos de eliminación de la batalla es al menos del 200 % a tu favor, la tropa enemiga sufrirá un 3 % extra de heridas severas al final de la batalla.\n- Si la proporción final de puntos de eliminación es al menos del 300 % a tu favor, las heridas severas adicionales aumentarán al 6 %."
      fr: "Le bonus de blessures graves du stratagème Décimationdevient :\n- Si le taux final de points de meurtre de la bataille est en votre faveur d'au moins 200 %, la troupe ennemie subit 3 % de blessés graves supplémentaires à la fin de la bataille.\n- Si le taux final de points de meurtre de la bataille est en votre faveur d'au moins 300 %, les blessés graves supplémentaires passent à 6 %."
      id: "Bonus luka parah dari Stratagem Desimasi menjadi:\n- Jika rasio poin pembunuhan akhir dalam pertempuran minimal 200% berpihak padamu, pasukan musuh akan menderita 3% luka parah tambahan di akhir pertempuran.\n- Jika rasio poin pembunuhan akhir minimal 300% berpihak padamu, luka parah tambahan akan meningkat menjadi 6%."
      it: "Il bonus per le ferite gravi dello stratagemma Decimazione diventa:\n- Se il rapporto finale dei punti uccisione è almeno di un 200% a tuo favore, la truppa nemica subirà un 3% di ferite gravi extra alla fine della battaglia.\n- Se il rapporto finale dei punti uccisione è almeno di un 300% a tuo favore, le ferite gravi extra saranno aumentate a 6%."
      ja: "敵軍撃破による重傷効果が以下に変化する：\n- 最終撃破比率が200%以上の場合、戦闘終了時に追加で発生した重傷兵が3%まで増加する。\n- 最終撃破比率が300%以上の場合、戦闘終了時に追加で発生した重傷兵が6%まで増加する。"
      ko: "적군 제거로 부여하는 중상 효과가 다음과 같이 변경된다.\n- 최종 처치 비율이 200% 이상인 경우, 전투 종료 시 추가 중상 유닛이 3%로 증가한다.\n- 최종 처치 비율이 300% 이상인 경우, 전투 종료 시 추가 중상 유닛이 6%로 증가한다."
      ms: "Bonus cedera parah dari Taktik Pemusnahan menjadi:\n- Jika nisbah mata bunuh akhir pertempuran sekurang-kurangnya 200% memihak kepada anda, trup musuh akan mengalami 3% tambahan cedera parah pada akhir pertempuran.\n- Jika nisbah mata bunuh akhir sekurang-kurangnya 300% memihak kepada anda, cedera parah tambahan akan meningkat kepada 6%."
      pl: "Premia do ciężkich ran z manewru zdziesiątkowanie wygląda teraz następująco:\n– Jeśli końcowy stosunek punktów zabicia w bitwie wynosi co najmniej 200% na twoją korzyść, oddział przeciwnika otrzyma na koniec bitwy dodatkowo 3% ciężkich ran.\n– Jeśli końcowy stosunek punktów zabicia wynosi co najmniej 300% na twoją korzyść, te dodatkowe ciężkie rany zostaną zwiększone do 6%."
      pt: "O bônus de ferimentos graves do Estratagema Dizimação torna-se:\n- se a proporção final de pontos de morte da batalha for de pelo menos 200% a seu favor, a tropa inimiga sofrerá 3% de ferimentos graves adicionais no final da batalha.\n- se a proporção final de pontos de morte for de pelo menos 300% a seu favor, os ferimentos graves adicionais aumentarão para 6%."
      ru: "Бонус тяжелых ранений от стратагемы Истребление противника становится:\n- Если итоговое соотношение очков убийств в битве составляет не менее 200% в вашу пользу, вражеские войска получат дополнительно 3% тяжелых ранений в конце битвы.\n- Если итоговое соотношение очков убийств составляет не менее 300% в вашу пользу, дополнительные тяжелые ранения увеличатся до 6%."
      th: "โบนัสบาดแผลรุนแรงจากกลอุบายทำลายล้างจะกลายเป็น:\n- หากอัตราคะแนนการฆ่าสุดท้ายในการต่อสู้อย่างน้อย 200% อยู่ในความเห็นชอบของคุณ กองทหารศัตรูจะได้รับบาดแผลรุนแรงเพิ่มขึ้น 3% เมื่อสิ้นสุดการต่อสู้\n- หากอัตราคะแนนการฆ่าสุดท้ายอย่างน้อย 300% อยู่ในความเห็นชอบของคุณ บาดแผลรุนแรงเพิ่มเติมจะเพิ่มขึ้นเป็น 6%"
      tr: "Katliam Stratejisinden gelen ağır yara bonusu şöyledir:\n- Eğer savaşın son öldürme puanı oranı en az %200 senin lehine ise düşman kıtası savaşın sonunda fazladan %3 ağır yara alır.\n- Eğer son öldürme puanı oranı en az %300 senin lehine ise, fazladan ağır yaralar %6 düzeyine çıkar."
      vi: "Tỉ lệ vết thương nghiêm trọng từ Chiến Lược Sự Tàn Vong trở thành:\n- Nếu tỷ lệ điểm tiêu diệt cuối cùng của trận đấu ít nhất là 200% nghiêng về phía ngài, đội quân kẻ thù sẽ chịu thêm 3% vết thương nghiêm trọng vào cuối trận đấu.\n- Nếu tỷ lệ điểm tiêu diệt cuối cùng ít nhất là 300% nghiêng về phía ngài, các vết thương nghiêm trọng thêm sẽ tăng lên 6%."
      zh_CN: "大破敌军造成的重伤效果变为：\n- 最终击杀比例达到200%以上，战斗结束时额外造成的重伤单位提升至3%；\n- 最终击杀比例达到300%以上，战斗结束时额外造成的重伤单位提升至6%。"
      zh_TW: "大破敵軍造成的重傷效果變為：\n- 最終擊殺比例達到200%以上，戰鬥結束時額外造成的重傷單位提升至3%；\n- 最終擊殺比例達到300%以上，戰鬥結束時額外造成的重傷單位提升至6%。"

  15:
    name:
      ar: "تمامًا مثلك"
      de: "Gleichfalls"
      en: "Right Back At You"
      es: "Igualmente"
      fr: "Retour à l'envoyeur"
      id: "Kembali Padamu"
      it: "Lo stesso vale per te"
      ja: "勇敢な戦い"
      ko: "위기 극복"
      ms: "Kembali Kepada Anda"
      pl: "Szybka odpłata"
      pt: "Na mesma moeda"
      ru: "Обратить солнце"
      th: "หวนกลับคืน"
      tr: "Aynen Öyle"
      vi: "Ngươi Cũng Vậy Nhé"
      zh_CN: "挥戈返日"
      zh_TW: "揮戈返日"
    description:
      ar: "زيادة التأثير الإضافي لضرر الهجوم المضاد من الخدعة العسكرية الهجوم المضاد إلى 30%"
      de: "Erhöht den Gegenangriffs-Schadensbonus des Strategems Gegenoffensive auf 30 %."
      en: "Increases the counterattack damage bonus from the Counter Offensive Stratagem to 30%"
      es: "Aumenta la bonificación de daño de contraataque de la estratagema Represalia a un 30 %"
      fr: "Augmente le bonus de dégâts de contre-attaque du stratagème de Contre-offensive à 30 %."
      id: "Meningkatkan bonus damage serangan balasan dari Stratagem Serangan Balik menjadi 30%"
      it: "Aumenta il bonus danni da contrattacco dello stratagemma Controffensiva fino a 30%"
      ja: "反攻の一撃によって発生する反撃ダメージ上昇が30%になる。"
      ko: "복수의 일격으로 입히는 반격 피해 증가 비율이 30%로 변경된다."
      ms: "Meningkatkan bonus kerosakan serangan balas dari Taktik Serangan Balas kepada 30%"
      pl: "Zwiększa premię do obrażeń od kontrataku od manewru kontrofensywa do 30%"
