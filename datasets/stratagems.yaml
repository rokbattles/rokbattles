  21:
    name:
      ar: "ميزة الميدان الرئيسي"
      de: "Heimvorteil"
      en: "Home Field Advantage"
      es: "Ventaja de local"
      fr: "Avantage à domicile"
      id: "Keunggulan Rumah Sendiri"
      it: "Vantaggio in casa"
      ja: "地の利・人の和"
      ko: "지리인화"
      ms: "Kelebihan Tempat Sendiri"
      pl: "Przewaga gospodarza"
      pt: "Vant. da equipe da casa"
      ru: "Родная земля"
      th: "สถานอันเหมาะสม"
      tr: "Kendi Meydanında Üstünlük"
      vi: "Lợi Thế Sân Nhà"
      zh_CN: "地利人和"
      zh_TW: "地利人和"
    description:
      ar: "تتلقَّى قواتك الميدانية ضرر هجوم مضاد أقل بنسبة 7% في أثناء وجودها داخل إقليم رابطتك."
      de: "Deine Feldtruppen erleiden 7 % weniger Gegenangriffsschaden, wenn sie sich auf dem Gebiet deiner Koalition befinden."
      en: "Your field troops take 7% less counterattack damage while within your coalition's territory."
      es: "Tus tropas de campo reciben un 7 % menos de daño de contraataque mientras están dentro del territorio de tu coalición."
      fr: "Vos troupes de terrain subissent 7 % de dégâts de contre-attaque en moins quand elles sont sur le territoire de votre coalition."
      id: "Pasukan lapanganmu menerima 7% damage serangan balasan lebih sedikit ketika berada di dalam wilayah koalisimu."
      it: "Le tue truppe da campo subiscono un 7% di danni da contrattacco in meno quando si trovano all'interno del territorio della tua coalizione."
      ja: "軍団領土内にいる場合、野戦部隊が受ける反撃ダメージが7%減少します。"
      ko: "군단 영토 내에서 야전 부대가 받는 반격 피해가 7% 감소한다."
      ms: "Trup lapangan anda menerima 7% kurang kerosakan serangan balas semasa berada dalam wilayah gabungan anda."
      pl: "Twoje oddziały w polu otrzymują o 7% mniej obrażeń od kontrataku, gdy znajdują się na terytorium twojej koalicji."
      pt: "Suas tropas de campo sofrem 7% menos dano de contra-ataque dentro do território da sua coalizão."
      ru: "Ваши отряды в поле получают на 7% меньше урона контратаками, находясь на территории вашей коалиции."
      th: "กองทหารภาคสนามของคุณจะรับความเสียหายจากการโจมตีสวนกลับน้อยลง 7% ขณะที่อยู่ในอาณาเขตของสัมพันธมิตรของคุณ"
      tr: "Sahra kıtaların, koalisyon bölgesinin içindeyken %7 daha az karşı saldırı hasarı alır."
      vi: "Đội quân dã chiến của ngài giảm 7% sát thương phản công hứng chịu khi chiến đấu bên trong lãnh thổ liên hiệp."
      zh_CN: "在军团领土内时，野战部队受到的反击伤害降低7%。"
      zh_TW: "在軍團領土內時，野戰部隊受到的反擊傷害降低7%。"
