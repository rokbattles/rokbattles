  25:
    name:
      ar: "شفاء الجرحى"
      de: "Triage"
      en: "Triage"
      es: "Triaje"
      fr: "Infirmerie"
      id: "Triase"
      it: "Triage"
      ja: "救済処置"
      ko: "부상자 분류"
      ms: "Triaj"
      pl: "Selekcja rannych"
      pt: "Triagem"
      ru: "Сортировка"
      th: "การคัดแยกผู้ป่วย"
      tr: "Triyaj"
      vi: "Chăm Sóc Thương Binh"
      zh_CN: "救死扶伤"
      zh_TW: "救死扶傷"
    description:
      ar: "8% من الوحدات المصابة بجروح بالغة في قواتك الميدانية ستصاب بجروح طفيفة فقط بدلًا من ذلك. يُمكن تقليل الوحدات المصابة بجروح بالغة بما يصل إلى 500000 من الوحدات. لا تؤثر على عدد وحداتك المقتولة."
      de: "8 % der schwer verletzten Einheiten deiner Feldtruppen werden stattdessen nur noch leicht verletzt. Die schwer verletzten Einheiten können um bis zu 500000 Einheiten verringert werden. Hat keinen Einfluss auf die Anzahl deiner getöteten Einheiten."
      en: "8% of your field troops' severely wounded units will instead only be slightly wounded. Severely wounded units can be reduced by up to 500000 units. Does not affect your number of dead units."
      es: "Un 8 % de las unidades severamente heridas de tus tropas de campo pasarán a estar levemente heridas. Las unidades severamente heridas se pueden reducir en hasta 500000 unidades. No afecta tu cantidad de unidades muertas."
      fr: "8 % des blessés graves de vos troupes de terrain sont convertis en blessés légers. Les blessés graves peuvent être réduits de 500000 unités au maximum. Sans effet sur le nombre de vos unités mortes."
      id: "8% dari unit yang terluka parah di pasukan lapanganmu akan menjadi terluka ringan. Unit yang terluka parah dapat dikurangi hingga maksimal 500000 unit. Tidak mempengaruhi jumlah unit yang tewas."
      it: "Un 8% delle tue truppe da campo ferite gravemente saranno invece ferite solo lievemente. Le unità ferite gravemente possono essere ridotte di un massimo di 500000 unità. Non influisce sul numero delle tue unità morte."
      ja: "自身の野戦部隊の重傷兵が8%減少し、軽傷兵になる。重傷兵の上限は500000、戦死者数には影響しない。"
      ko: "본인 야전 부대의 전투 중 중상 유닛 수량이 8% 감소하고, 해당 부분의 유닛은 경상 유닛으로 전환된다. 중상 유닛의 감소 상한은 500000이고, 전사 유닛 수량에 영향을 주지 않는다."
      ms: "8% daripada unit trup lapangan anda yang tercedera parah sebaliknya hanya akan cedera ringan. Unit yang tercedera parah boleh dikurangkan sehingga 500000 unit. Tidak menjejaskan bilangan unit anda yang mati."
      pl: "8% ciężko rannych jednostek w oddziałach w polu otrzyma status lekko rannych. Redukcja liczby ciężko rannych jednostek może wynieść maksymalnie 500000 jedn. Liczba twoich poległych pozostaje bez zmian."
      pt: "8% das unidades gravemente feridas de suas tropas de campo ficarão apenas feridas. Unidades gravemente feridas podem ser reduzidas em até 500000 unidades. Não afeta o número de unidades mortas."
      ru: "Для воинов в поле 8% бойцов вместо тяжелых ран получают легкие ранения. Число тяжело раненных воинов может быть снижено на величину до 500000. Не влияет на число погибших воинов."
      th: "8% ของหน่วยรบที่บาดเจ็บสาหัสของกองทหารภาคสนาม จะเปลี่ยนเป็นบาดเจ็บเล็กน้อยเท่านั้น หน่วยรบที่บาดเจ็บสาหัสสามารถลดลงได้สูงสุด 500000 หน่วย ไม่ส่งผลกระทบต่อจำนวนหน่วยรบที่ตายแล้ว"
      tr: "Sahra kıtalarının %8 kadarının ağır yaralı birimleri hafif yaralı duruma geçer. Ağır yaralı birimler 500000 birime kadar azaltılabilir. Ölü birimlerinin sayısını etkilemez."
      vi: "8% đơn vị trọng thương trong đội quân dã chiến sẽ chuyển thành đơn vị bị thương nhẹ. Giới hạn giảm đơn vị trọng thương là 500000. Không ảnh hưởng đến số lượng đơn vị hy sinh của ngài."
      zh_CN: "自身野战部队在战斗中的重伤单位减少8%，这部分单位将转化为轻伤单位。重伤单位的减少上限为500000，且不会影响阵亡单位的数量。"
      zh_TW: "自身野戰部隊在戰鬥中的重傷單位減少8%，這部分單位將轉化為輕傷單位。重傷單位的減少上限為500000，且不會影響陣亡單位的數量。"

  26:
    name:
      ar: "ترنيمة الأبطال"
      de: "Hymne der Helden"
      en: "Hymn of Heroes"
      es: "Himno de héroes"
      fr: "Hymne des héros"
      id: "Himne Hero"
      it: "Inno degli eroi"
      ja: "英霊の戦歌"
      ko: "영령의 군가"
      ms: "Lagu Pahlawan"
      pl: "Hymn bohaterów"
      pt: "Hino dos heróis"
      ru: "Песнь героям"
      th: "เพลงสรรเสริญฮีโร่"
      tr: "Kahraman Marşı"
      vi: "Bài Ca Anh Hùng"
      zh_CN: "英灵战歌"
      zh_TW: "英靈戰歌"
    description:
      ar: "كل 500000 من الوحدات الميتة من المستوى 5 في قاعة الأبطال الخاصة بك تمنحك مكافأة ضرر بنسبة 1% (حتى 5%). يتم احتساب وفيات الوحدات فقط على فترات 500000; لن يتم احتساب الوحدات التي تموت بين هذه الفترات."
      de: "Alle 500000 tote Klasse-5-Einheit(en) in deiner Halle der Helden gewährt dir einen Bonus von 1 % auf den verursachten Schaden (bis zu 5 %). Einheitenverluste werden nur in Intervallen von 500000 gezählt; Einheitenverluste zwischen diesen Intervallen werden nicht gezählt."
      en: "Every 500000 dead Tier 5 units in your Hall of Heroes grants you a 1% bonus to damage dealt (up to 5%). Unit deaths are only counted in intervals of 500000; unit deaths between these intervals will not be counted."
      es: "Cada 500000 unidades de nivel 5 muertas en tu Salón de Héroes, recibes una bonificación de daño provocado de un 1 % (hasta un 5 %). Las muertes de unidades solo se cuentan en intervalos de 500000; las muertes de unidades entre estos intervalos no contarán."
      fr: "Toutes les 500000 unités de niveau 5 mortes dans votre hall des héros vous accordent un bonus de dégâts infligés de 1 % (jusqu'à 5 %). Les unités mortes ne sont comptées que par intervalles de 500000 ; les décès qui interviennent entre ces intervalles ne seront pas comptabilisés."
      id: "Setiap 500000 unit Tingkat 5 yang tewas di Hall of Heroes milikmu, akan memberikan bonus 1% terhadap damage yang diberikan (hingga 5%). Kematian unit hanya dihitung dalam interval 500000; kematian unit di antara interval-interval ini tidak akan dihitung."
      it: "Ogni 500000 unità morte di grado 5 nella tua Sala degli Eroi ti concede un bonus di 1% ai danni inflitti (fino a 5%). Le morti delle unità vengono conteggiate solo a intervalli di 500000; le morti tra quest'ultimi non verranno conteggiate."
      ja: "英霊殿に戦死T5兵士が500000部隊存在するごとに、全ての与ダメージが1%上昇する（500000部隊未満の部分は計算されない）。上限は5%まで。"
      ko: "영령전의 5레벨 전사 유닛 500000명당 아군이 입히는 모든 피해가 1%씩, 최대 5% 증가한다. (500000명 미달일 경우 계산되지 않음)"
      ms: "Setiap 500000 unit Tingkat 5 yang mati dalam Dewan Wira anda memberikan anda 1% bonus kepada kerosakan yang disebabkan (sehingga 5%). Kematian unit hanya dikira dalam selang 500000; kematian unit antara selang ini tidak akan dikira."
      pl: "Każde 500000 szt. martwych jednostek poziomu 5 w twojej Sali Bohaterów zapewnia ci premię 1% do zadawanych obrażeń (maksymalnie 5%). Śmierci jednostek są liczone tylko w interwałach: 500000. Śmierci jednostek pomiędzy tymi interwałami nie będą brane pod uwagę."
      pt: "Cada 500000 unidades de Nível 5 mortas no seu Hall dos Heróis concede um bônus de 1% ao dano causado (até 5%). As mortes de unidades são contadas apenas em intervalos de 500000; mortes de unidades entre esses intervalos não serão contadas."
      ru: "Мертвые воины 5-го уровня в вашем Зале героев дают вам бонус к наносимому урону (каждые 500000 чел. — 1% бонуса; максимум 5%). Гибель воинов учитывается только с интервалом в 500000; гибель воинов между этими интервалами не учитывается."
      th: "ทุก 500000 หน่วยรบระดับ 5 ที่ตายในหอฮีโร่ของคุณจะให้โบนัสความเสียหายแก่คุณ 1% (สูงสุด 5%) การตายของหน่วยรบจะนับเฉพาะในช่วง 500000; การตายของหน่วยรบที่อยู่ระหว่างช่วงนี้จะไม่ถูกนับรวม"
      tr: "Kahraman Salonunda bulunan her 500000 ölü 5. Katman birim, verdiğin hasara %1 bonus sağlar (en fazla %5). Birim ölümleri sadece 500000 aralıklarla sayılır; bu aralıklar arasındaki birim ölümleri sayılmaz."
      vi: "Mỗi 500000 Đội quân đã Chết Cấp 5 trong Đại Sảnh Anh Hùng của bạn sẽ mang lại cho bạn 1% sát thương cộng thêm (tối đa 5%). Số lượng Đội quân đã Chết chỉ được tính theo từng khoảng 500000; số lượng Đội quân đã Chết giữa các khoảng này sẽ không được tính."
      zh_CN: "英灵殿中每有500000个阵亡的等级5单位，则造成的所有伤害提升1%，上限为5%。（未达到500000的部分不计算在内）"
      zh_TW: "英靈殿中每有500000個陣亡的等級5單位，則造成的所有傷害提升1%，上限為5%。（未達到500000的部分不計算在內）"

  27:
    name:
      ar: "موهبة عسكرية"
      de: "Martialisches Talent"
      en: "Martial Talent"
      es: "Talento marcial"
      fr: "Talent martial"
      id: "Bakat Bela Diri"
      it: "Talento marziale"
      ja: "軍事才能"
      ko: "군사적 재능"
      ms: "Bakat Bela Diri"
      pl: "Talent wojenny"
      pt: "Talento Marcial"
      ru: "Смертоносный талант"
      th: "ความสามารถในศิลปะการต่อสู้"
      tr: "Askerî Yetenek"
      vi: "Tài Năng Quân Sự"
      zh_CN: "军事才能"
      zh_TW: "軍事才能"
    description:
      ar: "اختر قطعة أثرية واحدة. عندما يكون القائد الثانوي للقوات مجهزًا بالقطعة الأثرية، فإن أي مهارات لديه تُطبّق على نوع واحد من الوحدات ستُطبّق بدلًا من ذلك على نوع وحدة مختلف (يعتمد نوع الوحدة المُحدد على القطعة الأثرية)."
      de: "Wähle 1 Artefakt. Wenn der zweite Kommandant einer Truppe mit dem Artefakt ausgerüstet ist, gelten alle Fähigkeiten, die er hat und die für einen einzigen Einheitentyp gelten, stattdessen für einen anderen Einheitentyp (der Einheitentyp hängt vom Artefakt ab)."
      en: "Select 1 artifact. When a troop's secondary commander is equipped with the artifact, any skills they have that apply to a single unit type will instead apply to a different unit type (the specific unit type depends on the artifact)."
      es: "Selecciona 1 artefacto. Cuando el comandante secundario de una tropa está equipado con el artefacto, sus habilidades que se apliquen a un solo tipo de unidad se aplicarán a un tipo de unidad diferente, según el artefacto."
      fr: "Sélectionnez 1 artefact. Quand le commandant secondaire d'une troupe a équipé l'artefact, toutes ses compétences qui ne s'appliquent qu'à un seul type d'unités s'appliqueront à la place à un autre type d'unités, en fonction de l'artefact."
      id: "Pilih 1 artefak. Ketika komandan sekunder pasukan dilengkapi dengan artefak, skill apa pun yang berlaku untuk satu jenis unit akan berlaku untuk jenis unit lain (jenis unit yang spesifik bergantung pada artefaknya)."
      it: "Seleziona 1 artefatto. Quando il comandante secondario di una truppa è equipaggiato con l'artefatto, le abilità che possiede e che si applicano a un singolo tipo di unità si applicheranno invece a un altro tipo di unità (il tipo specifico di unità dipende dall'artefatto)."
      ja: "奇兵の装身具を1つ選択して副将に装備すると、その副将が率いる単一兵種にのみ適用されていた効果が、新しい兵種に転換されて適用されるようになる。"
      ko: "기이한 장신구 1개 선택하여 부대 부사령관에게 장착시킬 시, 해당 사령관의 스킬 중 자신이 통솔한 단일 병종에 작용하는 스킬 효과가 새로운 병종에 적용된다."
      ms: "Pilih 1 artifak. Apabila komander sekunder trup dilengkapi dengan artifak tersebut, sebarang kemahiran yang mereka miliki yang terpakai pada jenis unit tunggal sebaliknya akan terpakai pada jenis unit yang berbeza (jenis unit tertentu bergantung pada artifak)."
      pl: "Wybierz 1 artefakt. Gdy drugi dowódca jest wyposażony w ten artefakt, jego umiejętności związane z danym rodzajem jednostek będą zamiast tego oddziaływać na jednostki innego rodzaju, w zależności od posiadanego artefaktu."
      pt: "Selecione 1 artefato. Quando o comandante secundário de uma tropa estiver equipado com um artefato, quaisquer habilidades que ele tenha e que se apliquem a um único tipo de unidade serão aplicadas a um tipo de unidade diferente (o tipo de unidade específico depende do artefato)."
      ru: "Выберите 1 артефакт. Если дать его второму командиру отряда, все навыки командира для одного типа воинов начинают работать для воинов другого типа (новый тип воинов зависит от артефакта)."
      th: "เลือก 1 สิ่งประดิษฐ์ เมื่อผู้บัญชาการลำดับที่สองของกองทหารใส่สิ่งประดิษฐ์ สกิลใดๆ ที่พวกเขามีที่ใช้กับหน่วยรบประเภทเดียวจะใช้กับหน่วยรบประเภทอื่น (ประเภทหน่วยรบเฉพาะจะขึ้นอยู่กับสิ่งประดิษฐ์ดังกล่าว)"
      tr: "1 kutsal eser seç. Bir kıtanın ikincil komutanı kutsal eseri kuşandığında sadece tek bir birim türüne uygulanan becerileri farklı bir birim türüne uygulanır (bunun hangi birim türü olacağı kutsal esere göre değişir)."
      vi: "Chọn 1 bí vật. Khi phó chỉ huy của một đội quân được trang bị bí vật, bất kỳ kỹ năng nào của chỉ huy áp dụng cho một binh chủng sẽ áp dụng cho một binh chủng khác (binh chủng cụ thể sẽ tùy theo bí vật)."
      zh_CN: "选择1件奇军秘饰。担任部队副将的统帅佩戴奇军秘饰后，该统帅所有对自身所率领单一兵种生效的技能效果，将转变为对新的兵种生效。"
      zh_TW: "選擇1件奇軍秘飾。當擔任部隊副將的統帥配戴上奇軍秘飾後，原本在率領特定兵種時才有效的技能，將對對應兵種生效。"

  28:
    name:
      ar: "أذكى، وليس أصعب"
      de: "Klüger, nicht härter"
      en: "Smarter, Not Harder"
      es: "Inteligencia sobre fuerza"
      fr: "Intelligemment, pas plus"
      id: "Kerja Cerdas"
      it: "Più mente, meno forza"
      ja: "効率の極み"
      ko: "최소 비용 최대 효과"
      ms: "Lebih Bijak, Bukan Lebih Kuat"
      pl: "Mądrzej, nie mocniej"
      pt: "Inteligente, não difícil"
      ru: "Работать головой"
      th: "ฉลาดกว่า ไม่ใช่ลำบากกว่า"
      tr: "Az ve Öz Çalış"
      vi: "Thông Minh Hơn, Không Phải Vất Vả Hơn"
      zh_CN: "事半功倍"
      zh_TW: "事半功倍"
    description:
      ar: "يزيد سعة الموارد بنسبة 100% عند نقل الموارد."
      de: "Erhöht die Ressourcen-Kapazität um 100 %, wenn Ressourcen transportiert werden."
      en: "Increases resource capacity by 100% when transporting resources."
      es: "Aumenta la capacidad de recursos un 100 % al transportar recursos."
      fr: "La capacité des ressources lors du transport augmente de 100 %."
      id: "Meningkatkan kapasitas sumber daya sebesar 100% saat pengangkutan."
      it: "Aumenta la capacità delle risorse di un 100% quando vengono trasportate."
      ja: "資源輸送時の輸送量が100%増加する。"
      ko: "자원 운송 시 적재량이 100% 증가한다."
      ms: "Meningkatkan kapasiti sumber sebanyak 100% apabila memindahkan sumber."
      pl: "Podczas transportu surowców zwiększa pojemność na surowce o 100%."
      pt: "Aumenta a capacidade de recursos em 100% ao transportar recursos."
      ru: "Увеличивает вместимость на 100% при транспортировке ресурсов."
      th: "เพิ่มความจุทรัพยากรขึ้น 100% เมื่อขนส่งทรัพยากร"
      tr: "Kaynak taşırken kaynak kapasitesini %100 artırır."
      vi: "Tăng sức chứa tài nguyên lên 100% khi vận chuyển tài nguyên."
      zh_CN: "运输资源时，容量提升100%。"
      zh_TW: "運輸資源時，容量提升100%。"

  29:
    name:
      ar: "واسع الحيِلة"
      de: "Einfallsreich"
      en: "Resourceful"
      es: "Ingenio"
      fr: "Débrouillardise"
      id: "Cerdik"
      it: "Ingegnoso"
      ja: "博文約礼"
      ko: "수정 정련"
      ms: "Pintar"
      pl: "Zaradność"
      pt: "Engenhoso"
      ru: "Умелый сбор"
      th: "แก้ปัญหาเก่ง"
      tr: "Bol Kaynak"
      vi: "Tài Nguyên"
      zh_CN: "博采众物"
      zh_TW: "博采眾物"
    description:
      ar: "سيكسبك جمع الموارد أيضًا الكريستال. ويُمكنك الحصول على ما يصل إلى 1000000 من الكريستال بهذه الطريقة لكل موسم."
      de: "Das Sammeln von Ressourcen wird dir ebenfalls Kristalle einbringen. Auf diese Weise kannst du bis zu 1000000 Kristalle pro Staffel erhalten."
      en: "Gathering resources will also earn you Crystals. You can obtain up to 1000000 Crystals this way per Season."
      es: "Al recolectar recursos, también obtendrás cristales. Puedes conseguir hasta 1000000 cristales por temporada de este modo."
      fr: "Vous recevez des cristaux quand vous récoltez des ressources. Vous pouvez obtenir un maximum de 1000000 cristaux de cette façon par saison."
      id: "Mengumpulkan sumber daya juga akan menghasilkan Kristal. Kamu dapat memperoleh hingga 1000000 Kristal dengan cara ini per Musim."
      it: "Raccogliere risorse ti farà guadagnare anche cristalli. In questo modo puoi ottenere fino a 1000000 cristalli per stagione."
      ja: "収集が完了すると、追加で少量の水晶を獲得する。この方法でシーズン終了までに最大1000000の水晶を獲得可能。"
      ko: "채집 종료 시 일부 수정을 추가 획득하며, 시즌 종료 전 해당 방식으로 최대 1000000 수정을 획득할 수 있다."
      ms: "Mengumpul sumber juga akan memberi anda Kristal. Anda boleh memperoleh hingga 1000000 Kristal dengan cara ini setiap Musim."
      pl: "Zbieranie surowców pozwoli ci również zdobyć kryształy. Możesz w ten sposób uzyskać do 1000000 kryształów na sezon."
      pt: "Coletar recursos também renderá Cristais. Você pode obter até 1000000 Cristais desta forma por Temporada."
      ru: "Сбор ресурсов также принесет вам кристаллы. Таким образом вы можете получить до 1000000 кристаллов за сезон."
      th: "การเก็บทรัพยากรจะทำให้คุณได้รับคริสตัล คุณสามารถรับคริสตัลได้สูงสุด 1000000 ต่อฤดูกาล"
      tr: "Kaynak toplamak sana Kristaller de kazandıracaktır. Bu şekilde her Sezon en fazla 1000000 Kristal elde edebilirsin."
      vi: "Thu thập tài nguyên cũng sẽ mang lại cho ngài Pha lê. Ngài có thể thu được tối đa 1000000 Pha lê theo cách này mỗi Mùa."
      zh_CN: "结束采集时，将额外获得一些水晶。赛季结束前通过该方式最多获得1000000水晶。"
      zh_TW: "結束採集時，將額外獲得一些水晶。賽季結束前最多可透過該方式獲得1000000水晶。"

  30:
    name:
      ar: "مثمر"
      de: "Fruchtbar"
      en: "Fruitful"
      es: "Productividad"
      fr: "Fructueux"
      id: "Bermanfaat"
      it: "Produttività"
      ja: "豊作の利"
      ko: "풍작의 수익"
      ms: "Berhasil"
      pl: "Owocne"
      pt: "Frutífero"
      ru: "Лавры и сокровища"
      th: "ผลงอกเงย"
      tr: "Bereketli"
      vi: "Cây quả"
      zh_CN: "丰收之利"
      zh_TW: "豐收之利"
    description:
      ar: "يزيد من سرعة الجمع بنسبة 10% لجميع الموارد باستثناء الجواهر."
      de: "Erhöht deine Sammelgeschwindigkeit um 10 % für alle Ressourcen außer Edelsteinen."
      en: "Increases your Gathering Speed by 10% for all resources other than Gems."
      es: "Aumenta tu velocidad de recolección un 10 % para todos los recursos, excepto las gemas."
      fr: "Augmente la vitesse de récolte de toutes les ressources sauf les gemmes de 10 %."
      id: "Meningkatkan Kecepatan Mengumpulkan sebesar 10% untuk semua sumber daya selain Gem."
      it: "Aumenta la tua velocità di raccolta di un 10% per tutte le risorse tranne le gemme."
      ja: "資源採集速度が10%上昇する。（宝石の採集には無効）"
      ko: "자원 채집 속도가 10% 증가한다. (보석 제외)"
      ms: "Meningkatkan Kelajuan Pengumpulan anda sebanyak 10% untuk semua sumber yang lain selain Permata."
      pl: "Zwiększa twoją szybkość zbioru o 10% dla wszystkich surowców oprócz klejnotów."
      pt: "Aumenta sua Velocidade de Coleta em 10% para todos os Recursos, exceto Gemas."
      ru: "Увеличивает скорость сбора на 10% для всех ресурсов, кроме самоцветов."
      th: "เพิ่มความเร็วการเก็บของคุณ 10% สำหรับทรัพยากรอื่นๆ นอกเหนือจากอัญมณี"
      tr: "Cevherler dışında tüm kaynaklar için Toplama Hızını %10 artırır."
      vi: "Tăng Tốc Độ Thu Gom của bạn lên 10% cho tất cả các tài nguyên ngoại trừ Đá quý."
      zh_CN: "资源采集速度提升10%。（采集宝石不生效）"
      zh_TW: "資源採集速度提升10%（採集寶石不生效）。"

  31:
    name:
      ar: "قلب واحد وعقل واحد"
      de: "Ein Herz, ein Geist"
      en: "One Heart, One Mind"
      es: "Un corazón, una mente"
      fr: "De cœur et d'esprit"
      id: "Satu Hati, Satu Jiwa"
      it: "Un cuore, una mente"
      ja: "戮力一心"
      ko: "단합의 힘"
      ms: "Sehati Sejiwa"
      pl: "Jedność serc i umysłów"
      pt: "Um Coração, Uma Mente"
      ru: "В едином порыве"
      th: "หัวเดียว ใจเดียว"
      tr: "Tek Kalp, Tek İrade"
      vi: "Vạn Chúng Nhất Tâm"
      zh_CN: "戮力一心"
      zh_TW: "戮力一心"
    description:
      ar: "عند مهاجمة حشد أو حامية لمعقل، فإن كل واحدة من قواتك المشاركة ستوفر 1% من الضرر الإضافي للقائد. يُمكن أن يتكدس هذا التأثير حتى 10 من المرّات. لا يؤثر على القوات الميدانية."
      de: "Beim Besetzen oder einem Gemeinschaftsangriff auf ein Bollwerk gewährt jede deiner teilnehmenden Truppen dem Hauptmann einen Schadensbonus von 1 %. Dieser Effekt ist bis zu 10 Mal stapelbar und betrifft Feldtruppen nicht."
      en: "When garrisoning or rally attacking a stronghold, every one of your troops taking part will provide a 1% damage bonus to the captain. This effect can stack up to 10 times. It does not affect field troops."
      es: "Al guarnecer o atacar en congregación un bastión, cada una de tus tropas participantes otorgará una bonificación de daño del 1 % al capitán. Este efecto se puede acumular hasta 10 veces. No afecta a las tropas de campo."
      fr: "Lors d'une garnison ou de l'attaque groupée d'un bastion, chacune de vos troupes qui participe fournit un bonus de dégâts de 1 % au capitaine. Effet cumulable 10 fois. Sans effet sur les troupes de terrain."
      id: "Ketika menjaga garnisun atau menyerang benteng pertahanan secara rally, tiap pasukanmu yang berpartisipasi akan memberikan bonus damage sebesar 1% pada kapten. Efek ini dapat ditumpuk maksimum 10 kali. Tindakan ini tidak memengaruhi pasukan lapangan."
      it: "Quando si presidia o si attacca in raduno una roccaforte, ogni truppa che vi partecipa fornisce un bonus danni di un 1% al capitano. Questo effetto può essere cumulato fino a un massimo di 10 volte. Non influisce sulle truppe da campo."
      ja: "拠点への集結攻撃または拠点防衛にあたる部隊の中で、自身が率いる部隊それぞれが、隊長に全てのダメージを1%上昇させるバフ効果を付与する。この効果は最大10回まで重複するが、野戦部隊には無効となる。"
      ko: "거점에 집결 공격 또는 집결 주둔 시 자신의 부대 1개당 대장이 입히는 모든 피해를 1%씩 증가시킨다. 해당 효과는 최대 10스택 중첩되고, 야전 부대에는 적용되지 않는다."
      ms: "Apabila berada dalam garison atau rali menyerang kubu, setiap trup anda yang mengambil bahagian akan memberikan 1% bonus kerosakan kepada kapten. Kesan ini boleh bertindan hingga 10 kali. Ia tidak menjejaskan trup lapangan."
      pl: "W garnizonie lub podczas mobilizacji ataku na twierdzę każdy oddział uczestniczący w walce zapewnia kapitanowi premię 1% do obrażeń. Efekt kumuluje się maks. 10 razy i nie wpływa na oddziały w polu."
      pt: "Ao guarnecer ou realizar ataque de reunião em uma fortaleza, cada uma de suas tropas participantes fornecerá um bônus de dano de 1% ao capitão. Este efeito pode acumular até 10 vezes. Não afeta as tropas de campo."
      ru: "В гарнизоне или при совместной атаке на крепость каждый ваш отряд-участник дает капитану 1% бонус к урону. Эффект накапливается до 10 раз. Он не влияет на отряды в поле."
      th: "เมื่อทำการประจำการหรือระดมทัพโจมตีที่มั่น กองทหารของคุณทั้งหมดที่มีส่วนร่วมจะให้โบนัสความเสียหาย 1% กับกัปตัน เอฟเฟกต์นี้สามารถสะสมซ้อนสูงสุด 10 ครั้ง และจะไม่กระทบต่อกองทหารภาคสนาม"
      tr: "Konuşlanırken ya da bir kaleye karşı toplu saldırı yaparken, dâhil olan her kıtan komutana %1 hasar bonusu verir. Bu etki 10 defaya kadar birikebilir. Sahra kıtalarını etkilemez."
      vi: "Khi đồn trú hoặc tập kết tấn công một thành trì, mỗi đội quân tham gia sẽ tăng sát thương 1% cho đội trưởng. Hiệu ứng này cộng dồn tối đa 10 lần. Không ảnh hưởng đến các đội quân dã chiến."
      zh_CN: "对据点发起的集结进攻或驻防据点的部队中，自身每支部队为队长提供所有伤害提升1%的增益效果，该效果最多叠加10层，对野战部队无效。"
      zh_TW: "對據點發起的集結進攻/駐防的部隊中，自身每支部隊會為隊長提供一個傷害提升1%的增益效果。該效果最多疊加10層，對野戰部隊無效。"
