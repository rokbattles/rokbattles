      de: "In Kämpfen außerhalb des Gebietes deiner Koalition erhalten deine Feldtruppen +12 % Angriff."
      en: "Your field troops gain 12% Attack while outside of your coalition's territory."
      es: "Tus tropas de campo obtienen un 12 % del ataque mientras están fuera del territorio de tu coalición."
      fr: "Vos troupes de terrain gagnent 12 % d'attaque quand elles sont hors du territoire de votre coalition."
      id: "Pasukan lapanganmu mendapat 12% Serangan ketika berada di luar wilayah koalisimu."
      it: "Le tue truppe da campo ottengono un 12% di attacco quando si trovano fuori dal territorio della tua coalizione."
