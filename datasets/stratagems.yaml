      ko: "군단 영토 밖에서 야전 부대의 공격력이 12% 증가한다."
      ms: "Trup lapangan anda memperoleh 12% Serangan semasa berada di luar wilayah gabungan anda."
      pl: "Twoje oddziały w polu zyskują premię 12% do ataku, gdy znajdują się poza terytorium twojej koalicji."
      pt: "Suas tropas de campo ganham 12% de Ataque enquanto estão fora do território da sua coalizão."
      ru: "Ваши отряды в поле получают 12% к атаке, находясь вне территории вашей коалиции."
      th: "กองทหารภาคสนามของคุณจะได้รับพลังโจมตี 12% ในขณะที่อยู่นอกอาณาเขตของสัมพันธมิตรของคุณ"
