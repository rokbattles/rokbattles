      ms: "Pakar Logistik"
      pl: "Spec od logistyki"
      pt: "Gênio da Logística"
      ru: "Умелая логистика"
      th: "ผู้ฉลาดด้านโลจิสติกส์"
      tr: "Seri Lojistik"
      vi: "Điều Binh Khiển Tướng"
      zh_CN: "调兵遣将"
      zh_TW: "調兵遣將"
    description:
      ar: "يمكنك إرسال ما يصل إلى 2 من القوات إلى الحشود التي يبدأها الحكام الآخرون."
      de: "Du kannst bis zu 2 Truppen zu Gemeinschaftsangriffen entsenden, die von anderen Statthaltern initiiert wurden."
      en: "You can dispatch up to 2 troops to rallies initiated by other governors."
      es: "Puedes enviar hasta 2 tropas a congregaciones iniciadas por otros gobernadores."
      fr: "Vous pouvez déployer jusqu'à 2 troupes dans les rassemblements initiés par d'autres gouverneurs."
      id: "Kamu dapat mengerahkan hingga 2 pasukan untuk rally yang diinisiasi oleh gubernur lain."
      it: "Puoi spedire fino a 2 truppe ai raduni avviati da altri governatori."
      ja: "他の総督が発動した集結攻撃に参加する際、2部隊を派遣して集結に参加できる（全て参加可能の集結に対して有効）。"
      ko: "다른 지도자가 개시한 집결 공격에 참여 시, 2개의 부대를 집결에 파견할 수 있다. (합류 가능한 모든 집결에 적용)"
      ms: "Anda boleh menghantar hingga 2 trup untuk rali yang dimulakan oleh gabenor lain."
      pl: "Możesz wysłać do 2 oddziałów do mobilizacji zainicjowanych przez innych zarządców."
      pt: "Você pode enviar até 2 tropas para reuniões iniciadas por outros governadores."
      ru: "Вы можете отправить до 2 войск на сборы, инициированные другими правителями."
      th: "คุณสามารถส่งกองทหารได้สูงสุด 2 กอง เพื่อเข้าร่วมการระดมทัพที่เริ่มโดยผู้ว่าการคนอื่นๆ"
      tr: "Diğer valiler tarafından başlatılan toplu saldırılara en fazla 2 kıta gönderebilirsin."
      vi: "Thống đốc có thể điều động tối đa 2 đội quân tham gia vào các cuộc tập kết do các thống đốc khác khởi xướng."
      zh_CN: "加入其他执政官发起的集结进攻时，可派遣2支部队加入该集结（对所有可加入的集结生效）。"
      zh_TW: "加入其他執政官發起的集結進攻時，可派遣2支部隊加入該集結（對所有可加入的集結生效）。"

  23:
    name:
      ar: "دعامات مؤقتة"
      de: "Provisorische Schienen"
      en: "Makeshift Splints"
