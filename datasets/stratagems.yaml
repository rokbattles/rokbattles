  4:
    name:
      ar: "الضربة المُفاجئة"
      de: "Überraschungsschlag"
      en: "Surprise Strike"
      es: "Ataque sorpresa"
      fr: "Assaut surprise"
      id: "Serangan Kejutan"
      it: "Colpo a sorpresa"
      ja: "奇策妙計"
      ko: "기묘한 계략"
      ms: "Serangan Mengejut"
      pl: "Atak z zaskoczenia"
      pt: "Golpe Surpresa"
      ru: "Внезапный удар"
      th: "โจมตีแบบไม่ทันตั้งตัว"
      tr: "Sürpriz Saldırı"
      vi: "Tấn Công Bất Ngờ"
      zh_CN: "出奇制胜"
      zh_TW: "出奇制勝"
    description:
      ar: "عندما تستخدم إحدى قواتك مهارة مفعلة ذات هدف واحد في المدى القريب تستهدف قوات العدو، فإن الهدف يتلقى ضررًا مباشرًا إضافيًا (معامل الضرر = عدد القوات الصديقة المحاصِرة للهدف × 100، حتى 700). يُمكن لكل واحدة من قواتك تفعيل هذا التأثير 1 من المرّات كل 20 من الثواني (لن يؤدي الخروج من القتال إلى إعادة تعيين وقت التهدئة)."
      de: "Immer wenn eine deiner Truppen eine aktive Fähigkeit gegen ein Einzelziel auf eine gegnerische Truppe anwendet, erleidet das Ziel zusätzlichen direkten Schaden (Schadensfaktor = Anzahl der befreundeten Truppen, die das Ziel umzingeln, x 100, bis zu 700). Jede deiner Truppen kann diesen Effekt 1-mal alle 20 Sekunden auslösen (das Verlassen des Kampfes setzt die Abklingzeit nicht zurück)."
      en: "Whenever one of your troops uses a single-target melee active skill targeting an enemy troop, the target takes extra direct damage (Damage Factor = number of friendly troops surrounding the target x 100, up to 700). Each of your troops can trigger this effect 1 time every 20 seconds (exiting combat will not reset the cooldown time)."
      es: "Cuando una de tus tropas usa una habilidad activa de cuerpo a cuerpo dirigida a un solo objetivo contra una tropa enemiga, el objetivo recibe daño directo adicional (factor de daño = cantidad de tropas amigas que rodean el objetivo x 100, hasta 700). Cada una de tus tropas puede activar este efecto 1 vez cada 20 segundos (si sales del combate, no se restablecerá el tiempo de enfriamiento)."
      fr: "Quand une de vos troupes utilise une compétence de corps-à-corps active à cible unique en ciblant une troupe ennemie, celle-ci subit des dégâts directs supplémentaires (multiplicateur de dégâts : nombre de troupes alliées entourant la cible x100, maximum 700). Chacune de vos troupes peut déclencher cet effet 1 fois toutes les 20 s (quitter le combat ne réinitialise pas le temps de recharge)."
      id: "Setiap kali salah satu pasukanmu menggunakan skill aktif bertarget tunggal jarak dekat yang menargetkan pasukan musuh, target akan menerima ekstra damage langsung (Faktor Damage = jumlah pasukan teman yang mengepung target x 100, hingga maksimum 700). Masing-masing pasukanmu dapat memicu efek ini 1 kali setiap 20 detik (keluar dari pertempuran tidak akan mereset waktu cooldown)."
      it: "Ogni volta che una delle tue truppe utilizza un'abilità attiva a bersaglio singolo in mischia su una truppa nemica, il bersaglio subisce danni diretti aggiuntivi (fattore di danno = numero di truppe amiche che circondano il bersaglio x 100, fino a 700). Ciascuna delle tue truppe può attivare questo effetto 1 volte ogni 20 secondi (l'uscita dal combattimento non ripristina il tempo di ricarica)."
      ja: "近接単体アクティブスキルを発動する時、追加でターゲット部隊に直接ダメージ（ダメージ係数＝100X挟み撃ち数、最大で700）を1回与える。各部隊は20秒ごとに最大1回発動可能（戦闘を離脱してもクールタイムはリセットされない）。"
      ko: "단일 액티브 근접전 스킬 시전 시 대상 부대에 고정 피해(피해 계수=100×협공 수, 최대 700)를 추가로 1회 입히고, 각 부대는 20초마다 해당 효과를 최대 1회 발동한다. (전투 이탈 시 쿨타임이 리셋되지 않음)"
      ms: "Setiap kali salah satu trup anda menggunakan kemahiran aktif malee sasaran tunggal yang menyasarkan trup musuh, sasaran akan menerima kerosakan langsung tambahan (Faktor Kerosakan = bilangan trup rakan yang mengepung sasaran x 100, hingga 700). Setiap trup anda boleh mencetuskan kesan ini 1 kali setiap 20 saat (keluar daripada pertempuran tidak akan menetapkan semula masa bertenang)."
      pl: "Gdy jeden z twoich oddziałów używa aktywnej umiejętności wręcz atakującej tylko jednego wroga, cel otrzymuje dodatkowe bezpośrednie obrażenia (współczynnik obrażeń = liczba zaprzyjaźnionych oddziałów otaczających cel × 100, do maks. 700). Każdy twój oddział może aktywować ten efekt 1 raz co 20 s (opuszczenie walki nie resetuje czasu odnowienia)."
      pt: "Sempre que uma de suas tropas usar uma habilidade ativa corpo a corpo de alvo único direcionada a uma tropa inimiga, o alvo receberá dano direto extra (Fator de Dano = número de tropas amigas cercando o alvo x 100, até 700). Cada uma de suas tropas pode ativar esse efeito 1 vez a cada 20 segundos (sair do combate não redefine o tempo de espera)."
      ru: "Когда один из ваших отрядов использует активный навык ближнего боя с одной целью против вражеского отряда, тот получает дополнительный прямой урон (множитель урона = число союзных отрядов вокруг цели * 100, до 700). Каждый ваш отряд может применять этот эффект 1 раз каждые 20 сек. (выход из боя не сбрасывает время перезарядки)."
      th: "ทุกครั้งที่หนึ่งในกองทหารของคุณใช้ทักษะกดใช้โจมตีระยะประชิดหนึ่งเป้าหมายต่อกองทหารศัตรู เป้าหมายจะได้รับความเสียหายโดยตรงเพิ่มเติม (ตัวคูณความเสียหาย = จำนวนกองทหารเป็นมิตรที่กำลังถูกล้อมเป้าหมาย x 100 สูงสุด 700) แต่ละกองทหารของคุณสามารถใช้เอฟเฟกต์นี้ 1 ครั้งทุก 20 วินาที (การออกจากการต่อสู้จะไม่รีเซ็ตเวลาคูลดาวน์)"
      tr: "Kıtalarından birisi, tek hedefli bir yakın dövüş etkin becerisiyle bir düşman kıtasını hedef aldığında hedef, fazladan doğrudan hasar alır (Hasar Faktörü = hedefin etrafını saran dost kıta sayısı x 100; en fazla 700 olabilir). Kıtalarından her biri bu etkiyi 20 saniyede bir 1 kez tetikleyebilir (çarpışmadan çıkıldığında bekleme süresi sıfırlanmaz)."
      vi: "Mỗi khi một trong những đội quân của ngài sử dụng một kỹ năng hoạt động đơn mục tiêu cận chiến nhắm vào một đội quân kẻ thù, mục tiêu chịu thêm sát thương trực tiếp (Hệ Số Sát Thương = số lượng đội quân của ngài bao vây mục tiêu x 100, tối đa 700). Mỗi đội quân của ngài có thể kích hoạt hiệu ứng này 1 lần mỗi 20 giây (thoát chiến đấu sẽ không làm mới thời gian hồi chiêu)."
      zh_CN: "施放近战单体主动技能时，额外对目标部队造成一次直接伤害（伤害系数=100X夹击数，上限为700），每支部队每20秒最多触发1次（脱离战斗不清除冷却时间）。"
      zh_TW: "施放近戰單體主動技能時，額外對目標部隊造成一次直接傷害（傷害係數=100X夾擊數，上限為700），每支部隊每20秒最多觸發1次（脫離戰鬥不清除冷卻時間）。"

  5:
    name:
      ar: "قرع الطبول"
      de: "Anspornendes Trommeln"
      en: "Rousing Drums"
      es: "Tambores motivadores"
      fr: "Tambour battant"
      id: "Drum Penyemangat"
      it: "Tamburi tonanti"
      ja: "鼓舞激励"
      ko: "치열한 전투"
      ms: "Gendang Semangat"
      pl: "Pobudzające bębny"
      pt: "Tambores Incitadores"
      ru: "Боевые барабаны"
      th: "กลองรบปลุกเร้า"
      tr: "Coşturan Davullar"
      vi: "Trống Trận Dồn Dập"
      zh_CN: "金鼓连天"
      zh_TW: "金鼓連天"
    description:
      ar: "عندما تتلقى إحدى قواتك تأثيرًا من قوات صديقة أو حليفة، فإن قواتك تتلقى 15% ضررًا أقل خلال الثواني الـ 5 التالية. يُمكن لكل من قواتك إطلاق هذا التأثير مرّة واحدة كل 15 من الثواني."
      de: "Immer wenn eine deiner Truppen einen Buff von einer befreundeten oder verbündeten Truppe erhält, erleidet deine Truppe in den nächsten 5 Sekunden 15 % weniger Schaden. Jede deiner Truppen kann diesen Effekt einmal alle 15 Sekunden auslösen."
      en: "Whenever one of your troops receives a buff from a friendly or allied troop, your troop takes 15% less damage for the next 5 seconds. Each of your troops can trigger this effect once every 15 seconds."
      es: "Cuando una de tus tropas recibe una bonificación de una tropa amiga o aliada, la tuya sufre un 15 % menos de daño durante los próximos 5 segundos. Cada una de tus tropas puede activar este efecto cada 15 segundos."
      fr: "Quand une de vos troupes reçoit un bonus de la part d'une troupe amie ou alliée, votre troupe subit 15 % de dégâts en moins pendant 5 secondes. Chacune de vos troupes peut déclencher cet effet une fois toutes les 15 s."
      id: "Setiap kali salah satu pasukanmu menerima buff dari pasukan teman atau sekutu, pasukanmu akan menerima damage 15% lebih sedikit selama 5 detik berikutnya. Masing-masing pasukanmu dapat memicu efek ini sekali setiap 15 detik."
      it: "Ogni volta che una delle tue truppe riceve un buff da una truppa amica o alleata, la tua truppa subisce un 15% di danni in meno per 5 secondi. Ogni truppa può attivare questo effetto una volta ogni 15 secondi."
      ja: "部隊が他の味方や友軍部隊からバフ効果を受けると、受ける全てのダメージが5秒間、15%減少する。15秒に1回発動可能。"
      ko: "부대가 기타 아군/우군 부대로부터 버프 효과를 받으면, 5초 동안 받는 모든 피해가 15% 감소하며, 해당 효과는 15초마다 최대 1회 발동한다."
      ms: "Apabila salah satu trup anda menerima buf daripada trup rakan atau bersekutu, trup anda menerima 15% kurang kerosakan selama 5 saat seterusnya. Setiap trup anda boleh mencetuskan kesan ini sekali setiap 15 saat."
      pl: "Gdy jeden z twoich oddziałów otrzyma wzmocnienie od zaprzyjaźnionego lub sojuszniczego oddziału, twój oddział będzie otrzymywał o 15% mniej obrażeń przez 5 s. Każdy z twoich oddziałów może aktywować ten efekt raz na 15 s."
      pt: "Sempre que uma de suas tropas receber um buff de uma tropa amiga ou aliada, sua tropa receberá 15% a menos de dano pelos próximos 5 segundos. Cada uma de suas tropas pode ativar este efeito uma vez a cada 15 segundos."
      ru: "Когда один из ваших отрядов получает усиление от союзного отряда, ваш отряд получает на 15% меньше урона в течение следующих 5 сек. Каждый ваш отряд может применять этот эффект раз в 15 сек."
      th: "ทุกครั้งที่หนึ่งในกองทหารของคุณได้รับบัฟจากกองทหารที่เป็นมิตรหรือพันธมิตร กองทหารของคุณจะได้รับความเสียหายน้อยลง 15% ในอีก 5 วินาทีถัดไป แต่ละกองทหารของคุณสามารถใช้เอฟเฟกต์นี้หนึ่งครั้งทุก 15 วินาที"
      tr: "Kıtalarından birisi dost veya müttefik bir kıtadan bir güç aldıktan sonra 5 saniye boyunca %15 daha az hasar alır. Kıtalarından her biri bu etkiyi 15 saniyede bir tetikleyebilir."
      vi: "Mỗi khi một trong các đội quân của bạn nhận được hiệu ứng bổ trợ từ đội quân của bạn hoặc đồng đội, đội quân nhận ít hơn 15% sát thương trong 5 giây tiếp theo. Mỗi đội quân có thể kích hoạt hiệu ứng này 15 giây một lần."
      zh_CN: "部队获得来自其他己方或友方部队的增益效果时，受到的所有伤害降低15%，持续5秒，每15秒最多触发一次。"
      zh_TW: "部隊獲得來自其他己方或友方部隊的增益效果時，受到的所有傷害降低15%，持續5秒，每15秒最多觸發一次。"

  6:
    name:
      ar: "صيادو القطيع"
      de: "Rudeljäger"
      en: "Pack Hunters"
      es: "Cacería en manada"
      fr: "Prédation en meute"
      id: "Pemburu Paket"
      it: "Cacciatori in gruppo"
      ja: "包囲制圧"
      ko: "포위 작전"
      ms: "Pemburu Berkelompok"
      pl: "Polowanie w stadzie"
      pt: "Caçadores de matilha"
      ru: "Нападение стаей"
      th: "นักล่าแพ็ก"
      tr: "Sürü Avı"
      vi: "Nhóm Thợ Săn"
      zh_CN: "合围制胜"
      zh_TW: "合圍制勝"
    description:
      ar: "كلما قاتلت إحدى قواتك قوات العدو التي تحتوي على عدد وحدات لا يقل عن 200% من عدد وحداتها الخاصة، فإن قواتك تلحق ضررًا إضافيًا بها (التأثير الإضافي للضرر = عدد القوات الصديقة المحاصِرة للعدو × 2%، بحد أقصى 5 قوات محاصِرة و10% من الضرر الإضافي)."
      de: "Immer wenn eine deiner Truppen gegen eine gegnerische Truppe kämpft, deren Einheitenanzahl mindestens 200 % der eigenen beträgt, verursacht deine Truppe zusätzlichen Schaden an ihr (Schadensbonus = Anzahl der befreundeten Truppen, die den Feind umzingeln, mal 2 %, begrenzt auf 5 umzingelnde Truppen und 10 % Bonus-Schaden)."
      en: "Whenever one of your troops battles an enemy troop whose unit count is at least 200% of its own, your troop deals extra damage to it (damage bonus = number of friendly troops surrounding the enemy x 2%, capped at 5 surrounding troops and 10% bonus damage)."
      es: "Siempre que una de tus tropas batalle contra una tropa enemiga cuyo conteo de unidades sea al menos del 200 % del propio, tu tropa le provoca daño extra (bonificación de daño = cantidad de tropas amigas que rodean al enemigo x 2 %, con un límite de 5 tropas que rodean y una bonificación de daño del 10 %)."
      fr: "Chaque fois qu'une de vos troupes combat une troupe ennemie dont le nombre d'unités dépasse le vôtre d'au moins 200 %, votre troupe lui inflige des dégâts supplémentaires (bonus de dégâts = nombre de troupes amies autour de l'ennemi x 2 %, maximum 5 troupes autour de la cible et 10 % de bonus de dégâts)."
      id: "Setiap kali salah satu pasukanmu bertempur dengan pasukan musuh yang jumlah unitnya setidaknya 200% dari jumlah unit pasukanmu, pasukanmu memberikan damage ekstra kepada mereka (Bonus Damage = jumlah pasukan teman yang mengepung musuh x 2%, dibatasi hingga 5 pasukan yang mengepung dan 10% bonus damage)."
      it: "Ogni volta che una delle tue truppe combatte contro una truppa nemica il cui numero di unità è almeno un 200% del proprio, la tua truppa infligge danni extra (bonus danni = numero di truppe amiche che circondano il nemico x 2%, fino a un massimo di 5 truppe circostanti e un 10% di bonus danni)."
      ja: "兵力が自部隊より200%多い敵部隊と戦闘する際、相手部隊に与える全てのダメージが上昇する（ダメージ上昇率=2%X挟み撃ち数、挟み撃ち数の上限は5、ダメージ上昇率の上限は10%）。"
      ko: "자기 병력 200%보다 많은 적군 부대와 교전 시 해당 부대에 입히는 모든 피해(피해 증가 비율=2%X협공 수, 최대 협공 수: 5, 피해 증가 비율 상한: 10%)가 증가한다."
      ms: "Setiap kali salah satu trup anda bertempur dengan trup musuh yang jumlah unitnya sekurang-kurangnya 200% daripada jumlah unit trup anda, trup anda akan memberikan kerosakan tambahan kepada musuh tersebut (bonus kerosakan = bilangan trup rakan yang mengepung musuh x 2%, dihadkan kepada 5 trup yang mengepung dan 10% bonus kerosakan)."
      pl: "Gdy jeden z twoich oddziałów walczy z wrogim oddziałem, którego liczba jednostek wynosi co najmniej 200% liczby twoich jednostek, twój oddział zadaje mu dodatkowe obrażenia (premia do obrażeń = liczba zaprzyjaźnionych oddziałów otaczających tego wroga × 2%, maksymalnie 5 otaczających oddziałów i 10% premii do obrażeń)."
      pt: "Sempre que uma das suas tropas batalhar contra uma tropa inimiga cujo número de unidades seja pelo menos 200% dela mesma, sua tropa causará dano extra a ela (bônus de dano = número de tropas amigas cercando o inimigo x 2%, limitado a 5 tropas cercando e 10% de bônus de dano)."
      ru: "Когда один из ваших отрядов вступает в битву с вражеским отрядом, количество воинов в котором составляет как минимум 200% от вашего, ваш отряд наносит дополнительный урон (бонус к урону равен количеству своих войск, окруживших врага, умноженному на 2%, максимум 5 окруживших войск и 10% бонуса к урону)."
      th: "ทุกครั้งที่กองทหารของคุณทำการต่อสู้กับกองทหารศัตรูที่มีจำนวนหน่วยรบอย่างน้อย 200% ของกองทหารตนเอง กองทหารของคุณจะสร้างความเสียหายเพิ่มเติมให้กับกองทหารศัตรู (โบนัสความเสียหาย = จำนวนกองทหารเป็นมิตรที่กำลังล้อมศัตรู x 2% จำกัดที่กองทหารที่กำลังถูกล้อม 5 หน่วยและโบนัสความเสียหาย 10%)"
      tr: "Kıtalarından biri, birim sayısı kendi birim sayısının en az %200 kadarı olan bir düşman kıtasıyla savaştığında kıtan ona ekstra hasar verir (hasar bonusu = düşmanın etrafını saran dost kıta sayısı x %2; etrafı saran kıta sayısı en fazla 5 olabilir ve en fazla %10 bonus hasar verilebilir)."
      vi: "Bất cứ khi nào một trong các đội quân của ngài chiến đấu với đội quân kẻ thù có số lượng đơn vị ít nhất là 200% so với đội quân của ngài, đội quân của ngài sẽ gây thêm sát thương lên địch (thưởng sát thương = số lượng đội quân của ngài bao vây kẻ thù x 2%, giới hạn ở 5 đội quân bao vây và 10% thêm sát thương)."
      zh_CN: "与兵力高于自身200%的敌方部队作战时，对其造成的所有伤害提升（伤害提升比例=2%X夹击数，夹击数上限为5，伤害提升比例上限10%)。"
      zh_TW: "與兵力高於自身200%的敵方部隊作戰時，對其造成的所有傷害提升（傷害提升比例=2%X夾擊數，夾擊數上限為5，傷害提升比例上限10%）。"
