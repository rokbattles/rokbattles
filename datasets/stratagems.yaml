  7:
    name:
      ar: "اعرف متى تنسحب"
      de: "Wissen, wann passen"
      en: "Know When to Fold"
      es: "Saber cuándo retirarse"
      fr: "Savoir quand se coucher"
      id: "Tahu Kapan Harus Menyerah"
      it: "Sapere quando arrendersi"
      ja: "急流勇退"
      ko: "급류용퇴"
      ms: "Tahu Masa Untuk Berhenti"
      pl: "Rozsądne wycofanie"
      pt: "Saber quando desistir"
      ru: "Знать, когда уйти"
      th: "รู้จักล่าถอย"
      tr: "Zamanında Çekil"
      vi: "Biết Khi Nào nên Dừng lại"
      zh_CN: "急流勇退"
      zh_TW: "急流勇退"
    description:
      ar: "يزيد من سرعة مسيرة قواتك المنسحبة بمقدار 200%."
      de: "Erhöht das Marschtempo deiner besiegten Truppen um 200 %."
      en: "Increases the March Speed of your routed troops by 200%."
      es: "Aumenta la velocidad de marcha de tus tropas abatidas un 200 %."
      fr: "Augmente la vitesse de marche de vos troupes acheminées de 200 %."
      id: "Meningkatkan Kecepatan Berjalan pasukanmu yang mundur sebesar 200%."
      it: "Aumenta la velocità di marcia delle truppe sconfitte di un 200%."
      ja: "部隊敗退後の行軍速度が200%上昇する。"
      ko: "퇴각 시 부대의 행군 속도가 200% 증가한다."
      ms: "Meningkatkan Kelajuan Kawad trup anda yang dihalakan sebanyak 200%."
      pl: "Zwiększa szybkość marszu twoich rozgromionych oddziałów o 200%."
      pt: "Aumenta a Velocidade de Marcha de suas tropas em fuga em 200%."
      ru: "Увеличивает скорость ваших разбитых отрядов на марше на 200%."
      th: "เพิ่มความเร็วการเคลื่อนพลของกองทหารที่พ่ายแพ้ของคุณขึ้น 200%"
      tr: "Yönlendirilmiş kıtalarının İntikal Hızını %200 artırır."
      vi: "Tăng tốc độ hành quân của đội quân bị đánh bại của ngài lên 200%."
      zh_CN: "部队溃退时，行军速度提升200%。"
      zh_TW: "部隊潰退時，行軍速度提升200%。"

  8:
    name:
      ar: "نهب أرض المعركة"
      de: "Schlachtfeld-Plünderung"
      en: "Battlefield Plunder"
      es: "Saqueo en la batalla"
      fr: "Pillage de guerre"
      id: "Penjarahan"
      it: "Saccheggio del campo"
      ja: "戦地徴収"
      ko: "맞불작전"
      ms: "Rampasan Medan Tempur"
      pl: "Grabież na polu bitwy"
      pt: "Pilhagem da Batalha"
      ru: "Военная добыча"
      th: "การปล้นในสนามรบ"
      tr: "Savaş Meydanı Yağması"
      vi: "Cướp Bóc Nơi Chiến Trường"
      zh_CN: "以战养战"
      zh_TW: "以戰養戰"
    description:
      ar: "عندما تَهزَم واحدة من قواتك الميدانية قوات حاكم آخر (باستثناء الحاميات)، فإنها تشفي ما يصل إلى 5 من القوات الميدانية الصديقة أو المتحالفة القريبة (معامل الشفاء 400). وقت التهدئة: 5 ثوانٍ."
      de: "Immer wenn eine deiner Feldtruppen die Truppe eines anderen Statthalters (ausgenommen Garnisonen) besiegt, heilt sie bis zu 5 nahe befreundete oder verbündete Feldtruppen (Heilungsfaktor 400). Abklingzeit: 5 Sekunden."
      en: "Whenever one of your field troops defeats another governor's troop (excluding garrisons), it heals up to 5 nearby friendly or allied field troops (Healing Factor 400). Cooldown: 5 seconds."
      es: "Cuando una de tus tropas de campo derrota a la tropa de otro gobernador (salvo guarniciones), sana a hasta 5 tropas de campo aliadas o amigas cercanas (factor de sanación 400). Enfriamiento: 5 s."
      fr: "Chaque fois qu'une de vos troupes de terrain bat la troupe d'un autre gouverneur (hors garnison), elle soigne un maximum de 5 troupes de terrain alliées ou amies à proximité (facteur de soin : 400). Recharge : 5 s."
      id: "Setiap kali salah satu pasukan lapangan milikmu mengalahkan pasukan gubernur lain (tidak termasuk berjaga), pasukan tersebut menyembuhkan hingga 5 pasukan teman atau sekutu di sekitar (Faktor Penyembuhan 400). Cooldown: 5 detik."
      it: "Ogni volta che una delle tue truppe da campo sconfigge una truppa di un altro governatore (escluse le guarnigioni), guarisce fino a 5 truppe da campo amiche o alleate nelle vicinanze (fattore di guarigione 400). Tempo di ricarica: 5 secondi."
      ja: "野戦部隊が他の総督の部隊を撃破（防衛部隊を除く）する度に、周囲にいる味方及び友軍の最大5つの野戦部隊を治療（治療係数400）する。クールタイム：5秒。"
      ko: "야전 부대가 다른 지도자의 부대(주둔 부대 제외) 1개를 처치할 때마다 주변 최대 5개의 아군 및 우군의 야전 부대를 1회 치료(치료 계수 400)한다. 쿨타임: 5초"
      ms: "Setiap kali salah satu trup lapangan anda mengalahkan trup gabenor lain (tidak termasuk garison), ia menyembuhkan hingga 5 trup lapangan rakan atau bersekutu berhampiran (Faktor Penyembuhan 400). Bertenang: 5 saat."
      pl: "Za każdym razem, gdy twoje oddziały w polu pokonują oddział innego zarządcy (nie dotyczy garnizonów), otrzymujesz leczenie dla maks. 5 twoich pobliskich sojuszniczych lub zaprzyjaźnionych oddziałów w polu (współczynnik leczenia: 400). Czas odnowienia: 5 s."
      pt: "Sempre que uma das suas tropas de campo derrotar a tropa de outro Governador (excluindo guarnições), até 5 tropas de campo amigas ou aliadas próximas são curadas (Fator de Cura 400). Espera: 5 segundos."
      ru: "Когда один из ваших отрядов в поле побеждает отряд другого правителя (исключая гарнизоны), он исцеляет до 5 своих или союзных отрядов в поле поблизости (множитель исцеления 400). Перезарядка: 5 секунд."
      th: "ทุกครั้งที่หนึ่งในกองทหารภาคสนามของคุณเอาชนะกองทหารของผู้ว่าการคนอื่น (ยกเว้นกองทหารประจำการ) กองทหารจะรักษากองทหารที่เป็นมิตรใกล้เคียงหรือกองทหารภาคสนามพันธมิตรสูงสุด 5 กอง (ตัวคูณการรักษา 400) คูลดาวน์: 5 วินาที"
      tr: "Bir sahra kıtan başka bir valinin kıtasını (garnizonlar hariç) yendiğinde yakındaki dost veya müttefik sahra kıtalarından en fazla 5 tanesini iyileştirir (İyileştirme Faktörü 400). Bekleme süresi: 5 saniye."
      vi: "Bất cứ khi nào một trong các đội quân dã chiến của ngài đánh bại đội quân của thống đốc khác (trừ đồn trú), nó sẽ chữa lành cho tối đa 5 đội quân dã chiến trong phạm vi hình tròn của ngài hoặc đồng đội (hệ số chữa lành 400). Thời gian hồi: 5 giây."
      zh_CN: "野战部队每击败一支其他执政官的部队（驻防部队除外）后，对周围最多5支己方及友方野战部队进行一次治疗（治疗系数400），冷却时间：5秒。"
      zh_TW: "野戰部隊每擊敗一支其他執政官的部隊（駐防部隊除外）後，對周圍最多5支己方及友方野戰部隊進行一次治療（治療係數400），冷卻時間：5秒。"

  9:
    name:
      ar: "النجاح أو مت"
      de: "Alles oder nichts"
      en: "Do or Die"
      es: "Actuar o morir"
      fr: "Quitte ou double"
      id: "Lakukan atau Mati"
      it: "O la va o la spacca"
      ja: "捨身忘死"
      ko: "결사분투"
      ms: "Buat atau Mati"
      pl: "Bez odwrotu"
      pt: "Fazer ou morrer"
      ru: "Не жалея себя"
      th: "อยู่หรือตาย"
      tr: "Yap ya da Öl"
      vi: "Sống hay Chết"
      zh_CN: "舍生忘死"
      zh_TW: "捨生忘死"
    description:
      ar: "القوات الميدانية الخاصة بك تلحق 10% ضرر أكثر عند قتال الجيوش المجمعة أو القوات الميدانية الأخرى، لكن 2% من الجروح الخطيرة التي تتعرض لها ستتحول إلى وفيات."
      de: "Deine Feldtruppen verursachen 10 % mehr Schaden, wenn sie gegen versammelte Armeen oder andere Feldtruppen kämpfen, aber 2 % der schweren Wunden, die sie erleiden, werden in Todesfälle umgewandelt."
      en: "Your field troops deal 10% more damage when fighting rallied armies or other field troops, but 2% of the severe wounds they suffer will be converted into deaths."
      es: "Tus tropas de campo provocan un 10 % más de daño cuando luchan contra ejércitos congregados u otras tropas de campo, pero el 2 % de las heridas severas que sufran resultarán en su muerte."
      fr: "Vos troupes de terrain infligent 10 % de dégâts supplémentaires lorsqu'elles combattent des armées ralliées ou d'autres troupes de terrain, mais 2 % des blessures graves qu'elles subissent seront converties en morts."
      id: "Pasukan lapanganmu memberikan 10% lebih banyak damage saat bertarung melawan pasukan rally atau pasukan lapangan lainnya, tetapi 2% dari luka parah yang mereka derita akan diubah menjadi kematian."
      it: "Le tue truppe da campo infliggono un 10% di danni in più quando combattono contro eserciti radunati o altre truppe da campo, ma un 2% delle ferite gravi che subiscono sarà convertito in morti."
      ja: "自軍の野戦部隊が敵の野戦部隊や集結部隊を攻撃する時、与える全てのダメージが10%上昇するが、自軍部隊の2%の重傷兵が直接戦死する。"
      ko: "아군 야전 부대가 야전 부대 또는 집결 부대를 공격 시 입히는 모든 피해가 10% 증가하지만, 아군 부대 중상 유닛의 2%가 즉시 전사한다."
      ms: "Trup lapangan anda menyebabkan 10% lebih kerosakan apabila bertempur dengan tentera rali atau trup lapangan lain, tetapi 2% daripada kecederaan parah yang mereka alami akan ditukar kepada kematian."
      pl: "Twoje oddziały w polu zadają o 10% więcej obrażeń podczas walki ze zmobilizowanymi armiami lub innymi oddziałami w polu, ale 2% poniesionych przez nie ciężkich ran poskutkuje śmiercią."
      pt: "Suas tropas de campo causam 10% mais dano ao lutar contra exércitos reunidos ou outras tropas de campo, mas 2% das feridas graves que sofrem serão convertidas em mortes."
      ru: "Ваши отряды в поле наносят на 10% больше урона при сражении с объединенными армиями или другими отрядами в поле, но 2% тяжелых ранений, которые они получают, будут заменены на смерть."
      th: "กองทหารภาคสนามของคุณจะสร้างความเสียหายเพิ่มขึ้น 10% เมื่อสู้กับกองทัพที่รวมพลหรือกองทหารภาคสนามอื่นๆ แต่ 2% ของบาดแผลรุนแรงที่พวกเขาได้รับจะถูกเปลี่ยนเป็นการตาย"
      tr: "Sahra kıtalarınız, kuşatma orduları veya diğer sahra kıtalarıyla savaşırken yüzde 10 daha fazla hasar verir ancak aldıkları ağır yaralanmalar %2 oranla ölüme dönüşecektir."
      vi: "Đội quân dã chiến của bạn gây thêm 10% sát thương khi chiến đấu với các đội quân tập hợp hoặc các đội quân dã chiến khác, nhưng 2% số quân bị thương nghiêm trọng mà họ phải chịu sẽ được chuyển thành tử vong."
      zh_CN: "己方野战部队在攻击野战部队或集结部队时，造成的所有伤害提升10%，但会使己方部队2%的重伤单位直接阵亡。"
      zh_TW: "己方野戰部隊在攻擊野戰部隊或集結部隊時，造成的所有傷害提升10%，但會使己方部隊2%的重傷單位直接陣亡。"

  10:
    name:
      ar: "لا يُقهر"
      de: "Unbezwungen"
      en: "Invictus"
      es: "Invicto"
      fr: "Inébranlable"
      id: "Tak Terkalahkan"
      it: "Invictus"
      ja: "万夫不当"
      ko: "만부부당"
      ms: "Tak dapat dikalahkan"
      pl: "Invictus"
      pt: "Invicto"
      ru: "Аура победы"
      th: "ไม่พ่ายแพ้"
      tr: "Yenilmez"
      vi: "Vạn Người Không Qua"
      zh_CN: "万夫莫当"
      zh_TW: "萬夫莫當"
    description:
      ar: "عندما تَهزم إحدى قواتك وحدة قوات واحدة من معسكر مختلف، فستُلحِق المهارات النشطة وحيدة الهدف لقواتك ضررًا إضافيًا بنسبة 10% خلال الثواني الـ 20 التالية (لن تفقد هذا التأثير بعد الخروج من القتال). لا ينطبق على قوات الحشد أو الحامية الخاصة بك."
      de: "Immer wenn eine deiner Truppen eine Truppe aus einem anderen Lager besiegt, verursachen die aktiven Einzelziel-Fähigkeiten deiner Truppe in den nächsten 20 Sekunden 10 % mehr Schaden (dieser Effekt geht nicht verloren, wenn du den Kampf verlässt). Dies gilt nicht für deine Gemeinschaftsangriffs- oder Garnisonstruppen."
      en: "Whenever one of your troops defeats a troop from a different camp, your troop's single-target active skills will deal 10% more damage for the next 20 seconds (you will not lose this effect after exiting combat). Does not apply to your rally or garrison troops."
      es: "Cuando una de tus tropas derrota a una tropa de otro campamento, las habilidades activas de un solo objetivo de tu tropa provocarán un 10 % más de daño durante los próximos 20 s (no perderás este efecto al salir del combate). No se aplica a tus tropas de congregación o guarnición."
      fr: "Quand une de vos troupes bat une troupe d'un autre camp, ses compétences actives touchant une seule cible infligent 10 % de dégâts supplémentaires pendant les 20 prochaines secondes (vous ne perdrez pas cet effet après avoir quitté le combat). Ne s'applique pas aux troupes rassemblées ou de garnison."
      id: "Setiap kali salah satu pasukanmu mengalahkan pasukan dari kamp lain, skill aktif target tunggal milik pasukanmu akan menyebabkan 10% lebih banyak damage selama 20 detik berikutnya (kamu tidak akan kehilangan efek ini setelah keluar dari pertempuran). Tidak berlaku untuk pasukan rally atau garnisun milikmu."
      it: "Ogni volta che una delle tue truppe sconfigge una truppa di un altro campo, le abilità attive a bersaglio singolo della tua truppa infliggeranno un 10% di danni in più per i successivi 20 secondi (non perderai questo effetto all'uscita dal combattimento). Non si applica alle tue truppe di raduno o di guarnigione."
      ja: "味方部隊が別陣営の部隊を撃破すると、その部隊の単体アクティブスキルによるダメージが20秒間、10%上昇する。（自軍が集結防衛部隊の場合、この効果は発動しない。戦闘を離脱しても効果は消えない）"
      ko: "우군 부대가 진영이 다른 부대 1개를 처치 후, 해당 우군 부대의 단일 액티브 스킬 피해가 20초간 10% 증가한다. (집결/주둔 부대일 경우 적용되지 않으며, 전투 이탈 시 효과가 사라지지 않음)"
      ms: "Setiap kali salah satu trup anda mengalahkan trup dari kem yang berbeza, kemahiran aktif sasaran tunggal trup anda akan menyebabkan 10% lebih kerosakan selama 20 saat berikutnya (anda tidak akan kehilangan kesan ini selepas keluar dari pertempuran). Tidak terpakai kepada trup rali atau pasukan garison anda."
      pl: "Gdy jeden z twoich oddziałów pokona oddział z innego obozu, jego aktywne umiejętności atakujące tylko jednego wroga będą zadawać o 10% więcej obrażeń przez 20 s (efekt utrzymuje się po opuszczeniu walki). Nie dotyczy zmobilizowanych oddziałów ani garnizonu."
      pt: "Sempre que uma de suas tropas derrotar uma tropa de um acampamento diferente, as habilidades ativas de alvo único da sua tropa causarão 10% a mais de dano pelos próximos 20 segundos (você não perderá esse efeito após sair do combate). Não se aplica às suas tropas de reunião ou guarnição."
      ru: "Когда ваш отряд побеждает отряд из другого лагеря, активные навыки вашего отряда, бьющие по одной цели, наносят на 10% больше урона в течение 20 сек. (эффект не пропадает при выходе из боя). Не применяется к вашим отрядам сбора и отрядам в гарнизоне."
      th: "ทุกครั้งที่หนึ่งในกองทหารของคุณเอาชนะกองทหารจากค่ายอื่น ทักษะกดใช้เป้าหมายเดี่ยวของกองทหารของคุณจะสร้างความเสียหายเพิ่ม 10% เป็นเวลาอีก 20 วินาทีต่อจากนี้ (คุณจะไม่สูญเสียเอฟเฟกต์นี้หลังจากออกจากการต่อสู้) ไม่มีผลกับกองทหารระดมทัพหรือกองทหารประจำการของคุณ"
      tr: "Kıtalarından biri, farklı kamptaki bir kıtayı her yendiğinde kıtanın tek hedefli etkin becerileri sonraki 20 saniye boyunca %10 daha fazla hasar verir (çarpışmadan çıktığında bu etki kalkmaz). Bu etki toplu saldırı veya garnizon kıtalarına uygulanmaz."
      vi: "Khi một trong những đội quân của ngài đánh bại đội quân từ một trại khác, kỹ năng hoạt động đơn mục tiêu của đội quân sẽ gây ra thêm 10% sát thương trong 20 giây tiếp theo (không mất hiệu ứng này sau khi thoát giao tranh). Không áp dụng cho đội quân tập kết hoặc đồn trú của ngài."
      zh_CN: "己方部队击败一支不同阵营部队后，该部队的单体主动技能造成的伤害提升10%，持续20秒。（自身是集结驻防部队时不生效，脱离战斗不清除此效果）"
      zh_TW: "己方部隊擊敗一支不同陣營部隊後，該部隊的單體主動技能造成的傷害提升10%，持續20秒。（自身是集結駐防部隊時不生效，脫離戰鬥不清除此效果）"
