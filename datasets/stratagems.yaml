      pt: "Talas Temporárias"
      ru: "Самодельные шины"
      th: "เฝือกทำเอง"
      tr: "Pratik Tedavi"
      vi: "Vật Liệu Có Cách"
      zh_CN: "简材有方"
      zh_TW: "簡材有方"
    description:
      ar: "تُقلل من تكلفة الموارد لشفاء الوحدات بنسبة 10%. يُمكنك توفير ما يصل إلى 700000000 من الموارد بهذه الطريقة لكل موسم."
      de: "Verringert die Ressourcenkosten für das Heilen von Einheiten um 10 %. Auf diese Art kannst du bis zu 700000000 Ressourcen pro Staffel sparen."
      en: "Reduces resource cost of healing units by 10%. You can save up to 700000000 resources this way per Season."
      es: "Reduce el costo de recursos de las unidades de sanación un 10 %. Puedes ahorrar hasta 700000000 recursos por temporada de esta forma."
      fr: "Réduit de 10 % le coût en ressource pour soigner les unités. Vous pouvez économiser 700000000 ressources de cette façon par saison."
      id: "Mengurangi penggunaan sumber daya untuk menyembuhkan unit sebesar 10%. Dengan cara ini, kamu dapat berhemat hingga 700000000 sumber daya per Musim."
      it: "Riduce di un 10% il costo delle risorse per la guarigione delle unità. In questo modo puoi risparmiare fino a un massimo di 700000000 risorse per stagione."
      ja: "治療に消費される資源が10%減少する。今シーズンの全ての資源消費を最大700000000減少できる。"
      ko: "치료 시 자원 소모가 10% 감소한다. 해당 방식을 통해 본 시즌의 모든 자원 소모량을 최대 700000000 감소할 수 있다."
      ms: "Mengurangkan kos sumber untuk menyembuhkan unit sebanyak 10%. Anda boleh menjimatkan hingga 700000000 sumber dengan cara ini setiap Musim."
      pl: "Zmniejsza koszt leczenia jednostek o 10%. Możesz w ten sposób zaoszczędzić maksymalnie 700000000 jedn. surowców na sezon."
      pt: "Reduz o custo de recursos de unidades de cura em 10%. Você pode economizar até 700000000 recursos desta forma por Temporada."
      ru: "Снижает стоимость лечения воинов в ресурсах на 10%. За сезон так можно сэкономить до 700000000 ед. ресурсов."
      th: "ลดค่าทรัพยากรในการรักษาหน่วยรบ 10% คุณสามารถประหยัดสูงสุด 700000000 ทรัพยากรด้วยวิธีนี้ต่อฤดูกาล"
      tr: "Birimleri iyileştirmek için gereken kaynakları %10 azaltır. Her Sezonda bu yöntemle en fazla 700000000 kaynak tasarrufu sağlayabilirsin."
      vi: "Giảm 10% chi phí tài nguyên khi chữa lành đơn vị. Ngài có thể tiết kiệm tối đa 700000000 tài nguyên bằng cách này mỗi Mùa."
      zh_CN: "治疗资源消耗降低10%。通过该方式，本赛季所有资源消耗最多可降低700000000。"
      zh_TW: "治療資源消耗降低10%。透過該方式，本賽季所有資源消耗最多可降低700000000。"

