stratagems:
  1:
    name:
      ar: "سافك للدماء"
      de: "Blutgehärtet"
      en: "Blood-Tempered"
      es: "Impulso de sangre"
      fr: "Forgé dans le sang"
      id: "Pemarah"
      it: "Temprato dal sangue"
      ja: "悪戦苦闘"
      ko: "피의 분투"
      ms: "Ditempa Dengan Darah"
      pl: "Zahartowanie krwią"
      pt: "Têmpera de sangue"
      ru: "Закалка кровью"
      th: "โลหิตเดือดดาล"
      tr: "Kan Dirençli"
      vi: "Máu Nóng"
      zh_CN: "浴血奋战"
      zh_TW: "浴血奮戰"
    description:
      ar: "يحسب إجمالي قوة جميع وحداتك التي أصيبت بجروح بالغة خلال الساعات الماضية البالغ عددها 3. مقابل كل 3000000 من القوة، تحصل قواتك الميدانية على زيادة 2% في الهجوم (حتى 20%). يتم حساب قوة الوحدات المصابة فقط على فترات تبلغ 3000000؛ ولن يتم احتساب أي قوة بين هذه الفترات.\nتتم إعادة حساب هذا التأثير كل 30 من الدقائق. لن يتم احتساب الوحدات التي أصيبت بجروح بالغة في أثناء عدم تجهيز هذه الخدعة العسكرية."
      de: "Berechnet die Gesamtenergie deiner Einheiten, die in den letzten 3 Stunden schwer verletzt wurden. Für jeweils 3000000 Energie erhalten deine Feldtruppen einen Bonus von 2 % auf den Angriff (bis zu 20 %). Die Energie der verwundeten Einheiten wird nur in Intervallen von 3000000 berechnet. Jegliche Energie zwischen diesen Intervallen wird nicht gezählt.\nDieser Effekt wird alle 30 Minuten neu berechnet. Einheiten, die schwer verletzt wurden, während dieses Strategem nicht ausgerüstet war, werden nicht gezählt."
      en: "Calculates the total power of all your units who were severely wounded over the past 3 hours. For every 3000000 power, your field troops gain a 2% bonus to Attack (up to 20%). Wounded unit power is only calculated in intervals of 3000000; any power between these intervals will not be counted.\nThis effect is recalculated every 30 minutes. Units who were severely wounded while this Stratagem was not equipped will not be counted."
      es: "Calcula el poder total de todas tus unidades que fueron severamente heridas durante las últimas 3 horas. Por cada 3000000 de poder, tus tropas de campo obtienen una bonificación de 2 % de ataque (hasta un 20 %). El poder de las unidades heridas solo se calcula en intervalos de 3000000; cualquier poder entre estos intervalos no se contará.\nEste efecto se recalcula cada 30 minutos. Las unidades que fueron severamente heridas mientras esta estratagema no estaba equipada no se contarán."
      fr: "- Calcule la puissance totale de toutes vos unités qui ont été gravement blessées au cours des 3 dernières heures. Pour chaque tranche de 3000000 de puissance, vos troupes de terrain gagnent un bonus de 2 % d'attaque (jusqu'à 20 %). La puissance des unités blessées n'est calculée que par intervalles de 3000000 ; toute puissance entre ces intervalles ne sera pas comptabilisée.\nCet effet est recalculé toutes les 30 minutes. Les unités qui ont été gravement blessées alors que ce stratagème n'était pas équipé ne seront pas comptabilisées."
      id: "Menghitung jumlah Power dari semua unit yang terluka parah milikmu selama 3 jam terakhir. Untuk setiap 3000000 Power, pasukan lapanganmu mendapatkan bonus sebesar 2% untuk Serangan (hingga 20%). Power unit yang terluka hanya dihitung dalam interval 3000000; Power apa pun di antara interval ini tidak akan dihitung.\nEfek ini dihitung ulang setiap 30 menit. Unit yang terluka parah saat Stratagem ini tidak digunakan tidak akan dihitung."
      it: "Calcola la potenza totale di tutte le tue unità che sono state ferite gravemente nelle ultime 3 ore. Per ogni 3000000 di potenza, le tue truppe da campo ottengono un bonus di un 2% all'attacco (fino a un 20%). La potenza delle unità ferite viene calcolata solo a intervalli di 3000000; qualsiasi potenza tra questi intervalli non sarà conteggiata.\nQuesto effetto viene ricalcolato ogni 30 minuti. Le unità che sono state ferite gravemente mentre questo stratagemma non era equipaggiato non saranno conteggiate."
      ja: "過去3時間以内に、味方の重傷戦力が3000000増えるごとに、野戦部隊の攻撃力が2%上昇する。上限は20%まで。（3000000に達しなかった分は計算されない）\nこの効果は30分ごとに計算される。未装備時に発生した重傷兵は計算対象外となる。"
      ko: "아군이 지난 3시간 동안 3000000 중상 전투력이 발생할 때마다 야전 부대의 공격력이 2%씩, 최대 20%까지 증가한다. (3000000 미만의 중상 전투력은 집계 않함)\n해당 효과는 30분마다 재집계되며, 본 카드 미장착 시 발생한 중상 유닛은 집계되지 않는다."
      ms: "Mengira jumlah kuasa semua unit anda yang tercedera parah dalam 3 jam yang lalu. Bagi setiap 3000000 kuasa, trup lapangan anda memperoleh 2% bonus untuk Serangan (hingga 20%). Kuasa unit yang tercedera hanya dikira dalam selang 3000000; sebarang kuasa antara selang ini tidak akan dikira.\nKesan ini dikira semula setiap 30 minit. Unit yang tercedera parah semasa Taktik ini tidak dilengkapi tidak akan dikira."
      pl: "Oblicza całkowitą siłę wszystkich twoich jednostek, które zostały poważnie ranne w ciągu ostatnich 3 godzin. Za każde 3000000 pkt siły twoje oddziały w polu zyskują 2% premii do ataku (maksymalnie 20%). Siła rannych jednostek jest obliczana tylko w odstępach co 3000000 – wartości pomiędzy tymi odstępami nie będą liczone.\nTen efekt jest przeliczany co 30 min. Jednostki, które zostały poważnie ranne, gdy ten manewr nie był używany, nie będą liczone."
      pt: "Calcula o poder total de todas as suas unidades que foram gravemente feridas nas últimas 3 horas. Para cada 3000000 de poder, suas tropas de campo ganham um bônus de 2% de Ataque (até 20%). O poder das unidades feridas é calculado apenas em intervalos de 3000000; qualquer poder entre esses intervalos não será contado.\nEste efeito é recalculado a cada 30 min. As unidades que foram gravemente feridas enquanto este Estratagema não estava equipado não serão contadas."
      ru: "Подсчитывается общая мощь всех ваших воинов, которые были тяжело ранены за последние 3 ч. За каждые 3000000 ед. мощи ваши отряды в поле получают 2%-й бонус к атаке (до 20%). Мощь раненных воинов рассчитывается только с интервалами в 3000000; мощь между этими интервалами учитываться не будет.\nЭтот эффект пересчитывается каждые 30 мин. Воины, которые были тяжело ранены, когда эта стратагема не была выбрана, при подсчете не учитываются."
      th: "คำนวณอำนาจรวมทั้งหมดของหน่วยรบที่บาดเจ็บสาหัสของคุณในช่วง 3 ชั่วโมงที่ผ่านมา ทุกๆ อำนาจ 3000000 หน่วย กองทหารภาคสนามของคุณจะได้รับโบนัสพลังโจมตี 2% (สูงสุด 20%) อำนาจของหน่วยรบที่บาดเจ็บจะถูกคำนวณเป็นช่วงเท่านั้น ช่วงละ 3000000 หน่วย อำนาจที่อยู่ระหว่างช่วงนี้จะไม่ถูกนับรวม\nเอฟเฟกต์นี้จะถูกคำนวณใหม่ทุกๆ 30 นาที หน่วยรบที่บาดเจ็บสาหัสในขณะที่ไม่ได้ติดตั้งกลอุบายนี้จะไม่ถูกนับรวม"
      tr: "Son 3 saat içinde ağır yaralı tüm birimlerinin toplam gücünü hesaplar. Her 3000000 güç için sahra kıtaların %2 Saldırı bonusu kazanır (en fazla %20). Yaralı birim gücü yalnızca 3000000 aralıklarla hesaplanır; bu aralıklar arasındaki herhangi bir güç sayılmayacaktır.\nBu etki her 30 dakikada bir yeniden hesaplanır. Bu Strateji kuşanılmamışken ağır yaralı birimler hesaba katılmayacaktır."
      vi: "Tính toán tổng sức mạnh tất cả các đơn vị của ngài bị thương nặng trong 3 giờ qua. Cứ mỗi 3000000 sức mạnh, đội quân dã chiến của ngài được tăng 2% Tấn Công (tối đa 20%). Sức mạnh của đơn vị bị thương chỉ được tính theo khoảng 3000000; bất kỳ sức mạnh nào giữa các khoảng này sẽ không được tính.\nHiệu ứng này được tính toán lại sau mỗi 30 phút. Các đơn vị bị thương nặng khi không trang bị Chiến Lược này sẽ không được tính."
      zh_CN: "己方过去3小时内，每产生3000000重伤战力则为野战部队提升2%的攻击力，提升上限为20%。（未达到3000000重伤战力的部分不计算在内）\n该效果每30分钟重新计算一次，未装备此卡时产生的重伤单位不计算在内。"
      zh_TW: "己方過去3小時內，每產生3000000重傷戰力則為野戰部隊提升2%的攻擊力，提升上限為20%。（未達到3000000重傷戰力的部分不計算在內）\n該效果每30分鐘重新計算一次，未裝備此卡時產生的重傷單位不計算在內。"

  2:
    name:
      ar: "الإبادة"
      de: "Dezimierung"
      en: "Decimation"
      es: "Aniquilación"
      fr: "Décimation"
      id: "Desimasi"
      it: "Decimazione"
      ja: "敵軍撃破"
      ko: "적군 제거"
      ms: "Pemusnahan"
      pl: "Zdziesiątkowanie"
      pt: "Dizimação"
      ru: "Истребление противника"
      th: "ทำลายล้าง"
      tr: "Katliam"
      vi: "Sự Tàn Vong"
      zh_CN: "大破敌军"
      zh_TW: "大破敵軍"
    description:
      ar: "عندما تهاجم إحدى قواتك الميدانية قوات العدو الميدانية (باستثناء الهجمات عن بعد) لمدة 3 ثوانٍ على الأقل:\n- إذا بلغت النسبة النهائية لنقاط القتل في المعركة 200% لصالحك على الأقل، فستعاني قوات العدو من 2% من الإصابات الخطيرة الإضافية في نهاية المعركة.\n- إذا بلغت النسبة النهائية لنقاط القتل 300% لصالحك على الأقل، فسترتفع نسبة الإصابات الخطيرة الإضافية إلى 4%."
      de: "Immer wenn eine deiner Feldtruppen eine gegnerische Feldtruppe für mindestens 3 Sekunden angreift (ausgenommen Fernkampfangriffe), gilt:\n- Wenn das endgültige Tötungspunkteverhältnis des Kampfes mindestens 200 % zu deinen Gunsten ausfällt, erleidet die gegnerische Truppe am Ende des Kampfes 2 % zusätzliche schwere Verletzungen.\n- Wenn das endgültige Tötungspunkteverhältnis mindestens 300 % zu deinen Gunsten ausfällt, werden die zusätzlichen schweren Verletzungen auf 4 % erhöht."
      en: "Whenever one of your field troops attacks an enemy field troop (excluding ranged attacks) for at least 3 seconds:\n- If the battle's final kill point ratio is at least 200% in your favor, the enemy troop will suffer 2% extra severe wounds at the end of the battle.\n- If the final kill point ratio is at least 300% in your favor, the extra severe wounds will be increased to 4%."
      es: "Cuando una de tus tropas de campo ataque a una tropa de campo enemiga (excepto ataques a distancia) durante al menos 3 segundos:\n- Si la tasa final de puntos de muerte de la batalla es de al menos 200 % a tu favor, la tropa enemiga sufrirá un 2 % de heridas graves adicionales al final de la batalla.\n- Si la proporción final de puntos de muerte es de al menos 300 % a tu favor, las heridas graves adicionales aumentarán a 4 %."
      fr: "Chaque fois que l'une de vos troupes de terrain attaque une troupe ennemie de terrain (à l'exception des attaques à longue portée) pendant au moins 3 secondes :\n- Si le rapport de points de mort de la bataille final est d'au moins 200 % en votre faveur, la troupe ennemie subira 2 % de blessures graves supplémentaires à la fin de la bataille.\n- Si le rapport de points de mort final est d'au moins 300 % en votre faveur, les blessures graves supplémentaires passeront à 4 %."
      id: "Setiap kali salah satu pasukan lapangan milikmu menyerang pasukan lapangan musuh (tidak termasuk serangan jarak jauh) selama minimal 3 detik:\n- Jika rasio poin pembunuhan akhir dalam pertempuran minimal sebesar 200% berpihak padamu, pasukan musuh akan menderita 2% luka parah tambahan di akhir pertempuran.\n- Jika rasio poin pembunuhan akhir minimal sebesar 300% berpihak padamu, luka parah tambahan akan meningkat menjadi 4%."
      it: "Ogni volta che una delle tue truppe da campo attacca una truppa nemica da campo (esclusi gli attacchi a distanza) per almeno 3 secondi:\n- Se il rapporto finale dei punti uccisione è almeno di un 200% a tuo favore, la truppa nemica subirà un 2% di ferite gravi extra alla fine della battaglia.\n- Se il rapporto finale dei punti uccisione è almeno di un 300% a tuo favore, le ferite gravi extra saranno aumentate a 4%."
      ja: "味方の野戦部隊がターゲットの野戦部隊を攻撃した3秒後（遠隔攻撃は対象外）：\n- 最終撃破比率が200%以上の場合、戦闘終了時に敵部隊に2%の重傷兵が追加で発生する。\n- 最終撃破比率が300%以上の場合、戦闘終了時に敵部隊に4%の重傷兵が追加で発生する。"
      ko: "아군 야전 부대가 적군 야전 부대 공격 후 3초 동안(원거리 공격 제외):\n- 최종 처치 비율이 200% 이상일 경우, 전투 종료 시 적군 부대에 2%의 중상 유닛을 추가 발생시킨다.\n- 최종 처치 비율이 300% 이상일 경우, 전투 종료 시 추가 중상 유닛 발생률이 4%로 증가한다."
      ms: "Apabila salah satu trup lapangan anda menyerang trup lapangan musuh (tidak termasuk serangan berjarak) selama sekurang-kurangnya 3 saat:\n- Jika nisbah mata bunuhan akhir pertempuran sekurang-kurangnya 200% memihak kepada anda, trup musuh akan mengalami 2% cedera teruk tambahan pada akhir pertempuran.\n- Jika nisbah mata bunuhan akhir sekurang-kurangnya 300% memihak kepada anda, cedera teruk tambahan akan meningkat kepada 4%."
      pl: "Gdy jeden z twoich oddziałów w polu atakuje wrogi oddział w polu (z wyłączeniem ataków dystansowych) przez co najmniej 3 sekundy:\n– Jeśli ostateczny stosunek punktów zabójstw w bitwie wynosi co najmniej 200% na twoją korzyść, wrogi oddział odniesie 2% dodatkowych ciężkich ran na końcu potyczki.\n– Jeśli ostateczny stosunek punktów zabójstw wynosi co najmniej 300% na twoją korzyść, dodatkowe ciężkie rany zostaną zwiększone do 4%."
      pt: "Sempre que uma de suas tropas de campo atacar uma tropa de campo inimiga (excluindo ataques a distância) por pelo menos 3 segundos:\n- Se a proporção final de pontos de abate da batalha for de pelo menos 200% a seu favor, a tropa inimiga sofrerá 2% de ferimentos graves extras ao final da batalha.\n- Se a proporção final de pontos de abate for de pelo menos 300% a seu favor, os ferimentos graves extras aumentarão para 4%."
      ru: "Каждый раз, когда один из ваших отрядов в поле атакует вражеский отряд в поле (исключая дальние атаки) в течение как минимум 3 сек.:\n- Если итоговое соотношение очков убийств в битве составляет не менее 200% в вашу пользу, вражеские войска получат дополнительно 2% тяжелых ранений в конце битвы.\n- Если итоговое соотношение очков убийств составляет не менее 300% в вашу пользу, дополнительные тяжелые ранения увеличатся до 4%."
      th: "เมื่อใดก็ตามที่กองทหารภาคสนามของคุณโจมตีกองทหารภาคสนามของศัตรู (ไม่รวมการโจมตีระยะไกล) เป็นเวลาอย่างน้อย 3 วินาที:\n- หากคุณมีอัตราส่วนคะแนนสังหารสุดท้ายที่ได้เปรียบอย่างน้อย 200% กองทหารศัตรูจะได้รับบาดเจ็บสาหัสเพิ่มขึ้น 2% เมื่อสิ้นสุดการต่อสู้\n- หากมีอัตราส่วนคะแนนสังหารสุดท้ายที่ได้เปรียบอย่างน้อย 300% การบาดเจ็บสาหัสเพิ่มเติมจะเพิ่มขึ้นเป็น 4%"
      tr: "Sahra kıtalarından biri düşman sahra kıtasına en az 3 saniye boyunca saldırdığında (menzilli saldırılar hariç):\n- Savaşın son öldürme puanı oranı senin lehine en az %200 ise düşman kıtası savaşın sonunda %2 ek ağır yara alacaktır.\n- Son öldürme puanı oranı senin lehine en az %300 ise ek ağır yaralar %4 oranında yükselecektir."
      vi: "Bất cứ khi nào một trong những đội quân dã chiến của ngài tấn công một đội quân dã chiến kẻ thù (không bao gồm tấn công tầm xa) trong ít nhất 3 giây:\n- Nếu tỷ lệ điểm hạ gục cuối cùng của trận đấu ít nhất là 200% nghiêng về phía ngài, đội quân kẻ thù sẽ chịu thêm 2% thương tích nặng vào cuối trận đấu.\n- Nếu tỷ lệ điểm hạ gục cuối cùng ít nhất là 300% nghiêng về phía ngài, thương tích nặng bổ sung sẽ tăng lên 4%."
      zh_CN: "己方野战部队攻击目标野战部队3秒后（远程攻击不生效）：\n- 如果最终击杀比例达到200%以上，则会在战斗结束时额外造成敌方部队2%的重伤单位；\n- 如果最终击杀比例达到300%以上，战斗结束时额外造成的重伤单位提升至4%。"
      zh_TW: "己方野戰部隊攻擊目標野戰部隊3秒後（遠距攻擊不生效）：\n- 如果最終擊殺比例達到200%以上，則會在戰鬥結束時額外造成敵方部隊2%的重傷單位；\n- 如果最終擊殺比例達到300%以上，戰鬥結束時額外造成的重傷單位提升至4%。"

  3:
    name:
      ar: "هجوم مضاد"
      de: "Gegenoffensive"
      en: "Counter Offensive"
      es: "Represalia"
      fr: "Contre-offensive"
      id: "Serangan Balik"
      it: "Controffensiva"
      ja: "反攻の一撃"
      ko: "복수의 일격"
      ms: "Serangan Balas"
      pl: "Kontrofensywa"
      pt: "Contra-ofensiva"
      ru: "Сменить сторону"
      th: "โต้กลับเชิงรุก"
      tr: "Karşı Saldırı"
      vi: "Phản Công"
      zh_CN: "反戈一击"
      zh_TW: "反戈一擊"
    description:
      ar: "كلما بادرت بحشد، أو إذا كان أحد قادتك يخدم كقائد الحامية، فإن الجيش المُحتشد/الحامية يسبب 20% أكثر من ضرر الهجوم المضاد."
      de: "Immer wenn du einen Gemeinschaftsangriff zusammenstellst oder einer deiner Kommandanten als Garnisonskommandant dient, verursacht die Sammelarmee/Garnison 20 % mehr Gegenangriffsschaden."
      en: "Whenever you initiate a rally, or if one of your commanders is serving as a garrison commander, the rallied army/garrison deals 20% more counterattack damage."
      es: "Cada vez que inicies una congregación, o si uno de tus comandantes es comandante de guarnición, el ejército congregado/ la guarnición provoca un 20 % más de daño de contraataque."
      fr: "Chaque fois que vous lancez un rassemblement, ou si l'un de vos commandants est commandant de garnison, l'armée/la garnison ralliée inflige 20 % de dégâts de contre-attaque supplémentaires."
      id: "Setiap kali kamu memulai Rally, atau jika salah satu komandanmu bertugas sebagai komandan Garnisun, Pasukan Rally/Garnisun memberikan 20% lebih banyak damage serangan balasan."
      it: "Ogni volta che avvii un raduno, o se uno dei tuoi comandanti è in servizio come comandante di guarnigione, l'esercito radunato o la guarnigione infligge un 20% di danni da contrattacco in più."
      ja: "防衛指揮官を担当した際、あるいは集結を発動した際に与える反撃ダメージが20%上昇する。"
      ko: "주둔 부대 사령관을 맡거나 집결 발동 시 입히는 반격 피해가 20% 증가한다."
      ms: "Setiap kali anda memulakan rali atau jika salah seorang komander anda bertugas sebagai komander garison, trup rali/garison tersebut akan menyebabkan 20% lebih banyak kerosakan serangan balas."
      pl: "Za każdym razem, gdy rozpoczynasz mobilizację lub gdy jeden z twoich dowódców służy jako dowódca garnizonu, zmobilizowana armia / garnizon zadaje 20% więcej obrażeń od kontrataku."
      pt: "Sempre que você iniciar uma reunião, ou se um de seus comandantes estiver servindo como comandante de guarnição, o exército reunido/guarnição causará 20% mais dano de contra-ataque."
      ru: "Всякий раз, когда вы созываете сбор, или если один из ваших командиров служит командиром гарнизона, созванная армия/гарнизон наносит на 20% больше урона контратаками."
      th: "เมื่อใดก็ตามที่คุณระดมทัพ หรือหากผู้บัญชาการคนใดคนหนึ่งของคุณกำลังทำหน้าที่เป็นผู้บัญชาการกองทหารประจำการ กองทหารที่ระดมทัพ/ประจำการจะสร้างความเสียหายจากการโจมตีสวนกลับเพิ่มขึ้น 20%"
      tr: "Bir toplu saldırı başlattığında veya komutanlarından biri garnizon komutanı olarak görev yapıyorsa seferberlik ordusu/garnizon %20 daha fazla karşı saldırı hasarı verir."
      vi: "Bất cứ khi nào bạn chuẩn bị tập kết, hoặc nếu một trong những chỉ huy của bạn đang ở trạng thái là chỉ huy đồn trú, đội quân tập kết/đồn trú sẽ gây thêm 20% sát thương phản công."
      zh_CN: "担任驻防统帅或发起集结时，造成的反击伤害提升20%。"
      zh_TW: "擔任駐防統帥或發起集結時，造成的反擊傷害提升20%。"
