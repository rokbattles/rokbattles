stratagems:
  1:
    name: "Blood-Tempered"
    description: "Calculates the total power of all your units who were severely wounded over the past 3 hours. For every 3000000 power, your field troops gain a 2% bonus to Attack (up to 20%). Wounded unit power is only calculated in intervals of 3000000; any power between these intervals will not be counted.\nThis effect is recalculated every 30 minutes. Units who were severely wounded while this Stratagem was not equipped will not be counted."

  2:
    name: "Decimation"
    description: "Whenever one of your field troops attacks an enemy field troop (excluding ranged attacks) for at least 3 seconds:\n- If the battle's final kill point ratio is at least 200% in your favor, the enemy troop will suffer 2% extra severe wounds at the end of the battle.\n- If the final kill point ratio is at least 300% in your favor, the extra severe wounds will be increased to 4%."

  3:
    name: "Counter Offensive"
    description: "Whenever you initiate a rally, or if one of your commanders is serving as a garrison commander, the rallied army/garrison deals 20% more counterattack damage."
    override:
      203:
        name: "Counter Offensive"
        description: "Whenever you initiate a rally, or if one of your commanders is serving as a garrison commander, the rallied army/garrison deals 16% more counterattack damage."

  4:
    name: "Surprise Strike"
    description: "Whenever one of your troops uses a single-target melee active skill targeting an enemy troop, the target takes extra direct damage (Damage Factor = number of friendly troops surrounding the target x 100, up to 700). Each of your troops can trigger this effect 1 time every 20 seconds (exiting combat will not reset the cooldown time)."

  5:
    name: "Rousing Drums"
    description: "Whenever one of your troops receives a buff from a friendly or allied troop, your troop takes 15% less damage for the next 5 seconds. Each of your troops can trigger this effect once every 15 seconds."

  6:
    name: "Pack Hunters"
    description: "Whenever one of your troops battles an enemy troop whose unit count is at least 200% of its own, your troop deals extra damage to it (damage bonus = number of friendly troops surrounding the enemy x 2%, capped at 5 surrounding troops and 10% bonus damage)."
    override:
      203:
        name: "Pack Hunters"
        description: "Whenever one of your troops battles an enemy troop whose unit count is at least 200% of its own, your troop deals extra damage to it (damage bonus = number of friendly troops surrounding the enemy x 2.5%, capped at 5 surrounding troops and 12.5% bonus damage)."

  7:
    name: "Know When to Fold"
    description: "Increases the March Speed of your routed troops by 200%."

  8:
    name: "Battlefield Plunder"
    description: "Whenever one of your field troops defeats another governor's troop (excluding garrisons), it heals up to 5 nearby friendly or allied field troops (Healing Factor 400). Cooldown: 5 seconds."

  9:
    name: "Do or Die"
    description: "Your field troops deal 10% more damage when fighting rallied armies or other field troops, but 2% of the severe wounds they suffer will be converted into deaths."

  10:
    name: "Invictus"
    description: "Whenever one of your troops defeats a troop from a different camp, your troop's single-target active skills will deal 10% more damage for the next 20 seconds (you will not lose this effect after exiting combat). Does not apply to your rally or garrison troops."
    override:
      203:
        name: "Invictus"
        description: "Whenever one of your troops defeats a troop from a different camp, your troop's single-target active skills will deal 15% more damage for the next 20 seconds (you will not lose this effect after exiting combat). Does not apply to your rally or garrison troops."

  11:
    name: "Berserker Blood"
    description: "Your troops deal 5% more damage, but they also take 3% more damage."

  12:
    name: "Ant Crusher"
    description: "Whenever one of your field troops battles an enemy field troop whose unit count is less than 15% of your troop's unit count, your troop deals 15% more damage to it."

  13:
    name: "Till I Fall"
    description: "The Attack bonus from the Blood-Tempered Stratagem becomes:\nFor every 3000000 power, your field troops gain a 3% bonus to Attack (up to 30%)."

  14:
    name: "Run Them Down"
    description: "The severe wound bonus from the Decimation Stratagem becomes:\n- If the battle's final kill point ratio is at least 200% in your favor, the enemy troop will suffer 3% extra severe wounds at the end of the battle.\n- If the final kill point ratio is at least 300% in your favor, the extra severe wounds will be increased to 6%."

  15:
    name: "Right Back At You"
    description: "Increases the counterattack damage bonus from the Counter Offensive Stratagem to 30%"
    override:
      203:
        name: "Right Back At You"
        description: "Increases the counterattack damage bonus from the Counter Offensive Stratagem to 24%"

  16:
    name: "Proven Valor"
    description: "Reduces the cooldown for the Surprise Strike Stratagem to 10 seconds."

  17:
    name: "Rhythm Of War"
    description: "Increases the duration of the damage reduction effect from the Rousing Drums Stratagem to 8 seconds."

  18:
    name: "Beatdown"
    description: "Increases the damage bonus from the Pack Hunters Stratagem to number of friendly troops surrounding the enemy x 3% (up to 5 surrounding troops). Also increases the max damage bonus to 15%."
    override:
      203:
        name: "Beatdown"
        description: "Increases the damage bonus from the Pack Hunters Stratagem to number of friendly troops surrounding the enemy x 4% (up to 5 surrounding troops). Also increases the max damage bonus to 20%."

  19:
    name: "Far From Home"
    description: "Your field troops gain 12% Attack while outside of your coalition's territory."

  20:
    name: "Breakneck"
    description: "Your troops gain 10% March Speed."

  21:
    name: "Home Field Advantage"
    description: "Your field troops take 7% less counterattack damage while within your coalition's territory."
    override:
      203:
        name: "Home Field Advantage"
        description: "Your field troops take 10% less counterattack damage while within your coalition's territory."

  22:
    name: "Logistics Whiz"
    description: "You can dispatch up to 2 troops to rallies initiated by other governors."

  23:
    name: "Makeshift Splints"
    description: "Reduces resource cost of healing units by 10%. You can save up to 700000000 resources this way per Season."

  24:
    name: "Kind-Hearted"
    description: "Increases your Hospital Capacity by 100%."

  25:
    name: "Triage"
    description: "8% of your field troops' severely wounded units will instead only be slightly wounded. Severely wounded units can be reduced by up to 500000 units. Does not affect your number of dead units."

  26:
    name: "Hymn of Heroes"
    description: "Every 500000 dead Tier 5 units in your Hall of Heroes grants you a 1% bonus to damage dealt (up to 5%). Unit deaths are only counted in intervals of 500000; unit deaths between these intervals will not be counted."

  27:
    name: "Martial Talent"
    description: "Select 1 artifact. When a troop's secondary commander is equipped with the artifact, any skills they have that apply to a single unit type will instead apply to a different unit type (the specific unit type depends on the artifact)."

  28:
    name: "Smarter, Not Harder"
    description: "Increases resource capacity by 100% when transporting resources."

  29:
    name: "Resourceful"
    description: "Gathering resources will also earn you Crystals. You can obtain up to 1000000 Crystals this way per Season."

  30:
    name: "Fruitful"
    description: "Increases your Gathering Speed by 10% for all resources other than Gems."

  31:
    name: "One Heart, One Mind"
    description: "When garrisoning or rally attacking a stronghold, every one of your troops taking part will provide a 1% damage bonus to the captain. This effect can stack up to 10 times. It does not affect field troops."
