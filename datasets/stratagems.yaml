  18:
    name:
      ar: "هزيمة ساحقة"
      de: "Niederschlagen"
      en: "Beatdown"
      es: "Paliza"
      fr: "Mathématiques"
      id: "Pertarungan"
      it: "Pestaggio"
      ja: "掎角の勢い"
      ko: "협공 형세"
      ms: "Kalah Teruk"
      pl: "Manto"
      pt: "Suprimir"
      ru: "Избиение"
      th: "อัดจนน่วม"
      tr: "Yıldırma"
      vi: "Thế Trận Hai Mặt"
      zh_CN: "掎角之势"
      zh_TW: "掎角之勢"
    description:
      ar: "يزيد التأثير الإضافي للضرر من خدعة صيادي القطيع إلى عدد من القوات الصديقة المحاصِرة للعدو × 3% (حتى 5 قوات محاصِرة). كما يزيد من الحد الأقصى للتأثير الإضافي للضرر إلى 15%."
      de: "Erhöht den Schadensbonus des Strategems Rudeljäger auf die Anzahl der umzingelnden befreundeten Truppen mal 3 % (bis zu 5 umzingelnde Truppen). Erhöht ebenfalls den maximalen Schadensbonus auf 15 %."
      en: "Increases the damage bonus from the Pack Hunters Stratagem to number of friendly troops surrounding the enemy x 3% (up to 5 surrounding troops). Also increases the max damage bonus to 15%."
      es: "Aumenta la bonificación de daño de la estratagema Cacería en manada un 3 % a cierta cantidad de tropas amigas que rodean al enemigo (hasta 5 tropas que rodean al enemigo). También aumenta la bonificación de daño máxima hasta un 15 %."
      fr: "Augmente le bonus de dégâts du stratagème Prédation en meute au nombre de troupes amies autour de l'ennemi x 3 % (jusqu'à 5 troupes autour de la cible). Augmente également le bonus de dégâts max à 15 %."
      id: "Meningkatkan bonus damage dari Stratagem Pemburu Paket menjadi jumlah pasukan teman mengepung musuh x 3% (hingga 5 pasukan mengepung) dan juga akan meningkatkan bonus damage maksimum menjadi 15%."
      it: "Aumenta il bonus danni dello stratagemma Cacciatori in gruppo in base al numero di truppe amiche che circondano il nemico x 3% (fino a 5 truppe circostanti). Aumenta anche il bonus danni massimo fino a 15%."
      ja: "包囲制圧のダメージ上昇率が、挟み撃ち数×3%になり（挟み撃ち数上限は5）、ダメージ上昇率の上限が15%になる。"
      ko: "포위 작전의 피해 증가 비율이 [3%X협공 수(최대 5)]로 변경되고, 피해 증가 비율 상한이 15%로 변경된다."
      ms: "Meningkatkan bonus kerosakan daripada Taktik Pemburu Berkelompok berdasarkan bilangan trup rakan yang mengepung musuh x 3% (sehingga 5 trup yang mengepung). Juga meningkatkan bonus kerosakan maks kepada 15%."
      pl: "Zwiększa premię do obrażeń z manewru polowanie w stadzie do: liczba zaprzyjaźnionych oddziałów otaczających wroga × 3% (maksymalnie: 5 otaczających oddziałów). Zwiększa również maksymalną premię do obrażeń do 15%."
      pt: "Aumenta o bônus de dano do Estratagema Caçadores de matilha para o número de tropas amigas cercando o inimigo x 3% (até 5 tropas cercando). Também aumenta o bônus de dano máximo para 15%."
      ru: "Увеличивает бонус к урону от стратагемы Нападение стаей для количества своих войск, окруживших врага, до x3% (до 5 окруживших отрядов). Также увеличивает максимальный бонус к урону до 15%."
      th: "เพิ่มโบนัสความเสียหายจากกลอุบายนักล่าแพ็ก ให้กับจำนวนกองทหารเป็นมิตรที่กำลังล้อมศัตรู x 3% (สูงสุดถึงกองทหารล้อม 5 กองทหาร) นอกจากนี้จะเพิ่มโบนัสความเสียหายสูงสุดถึง 15%"
      tr: "Düşmanın etrafını saran dost kıtaların sayısına bağlı olarak Sürü Avı Stratejisinin hasar bonusunu x %3 artırır (en fazla 5 etrafı saran kıta sayılır). Ayrıca maksimum hasar bonusunu %15 düzeyine artırır."
      vi: "Tăng thêm sát thương từ Chiến Lược Nhóm Thợ Săn cho số lượng đội quân đồng minh bao vây kẻ thù x 3 % (tối đa 5 đội quân bao vây). Đồng thời tăng thêm thưởng sát thương tối đa lên 15%."
      zh_CN: "合围制胜的伤害提升比例修改为3%X夹击数（夹击数上限为5），同时伤害提升比例上限修改为15%。"
      zh_TW: "合圍制勝的傷害提升比例修改為3%X夾擊數（夾擊數上限為5），同時傷害提升比例上限修改為15%。"
