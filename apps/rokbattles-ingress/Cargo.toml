[package]
name = "rokbattles-ingress"
version = "1.2.0"
edition = "2024"

[dependencies]
axum = { workspace = true, features = ["multipart"] }
bytes = { workspace = true }
core-tcp-stream = { path = "../../core/core-tcp-stream" }
dotenvy = { workspace = true }
flate2 = { workspace = true, default-features = false, features = ["zlib"] }
mail-decoder = { path = "../../crates/mail-decoder" }
mail-registry = { path = "../../crates/mail-registry" }
mongodb = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower_governor = { workspace = true, default-features = false, features = ["axum"] }
zstd = { workspace = true }
sentry = { workspace = true }
