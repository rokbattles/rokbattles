services:
  site-platform:
    build:
      context: .
      dockerfile: infra/platform.Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4447:3000"
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/rokbattles
    networks:
      - rokbattles
  site-ingress:
    build:
      context: .
      dockerfile: infra/ingress.Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4445:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017/rokbattles
    networks:
      - rokbattles
  site-processor:
    build:
      context: .
      dockerfile: infra/processor.Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/rokbattles
    networks:
      - rokbattles
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27017 --quiet
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "4446:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - rokbattles

networks:
  rokbattles:
    driver: bridge
